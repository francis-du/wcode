- schema_version: 1
  id: CONSTRAINT-ROOT-ISOLATION
  title: Canonical workspace root isolation
  statement: Model-facing paths must remain beneath the selected canonical workspace root and must reject absolute paths and parent traversal.
  applies_to:
    - component:workspace-security

- schema_version: 1
  id: CONSTRAINT-SYMLINK-REJECTION
  title: Symlink aliases are rejected
  statement: Model-facing filesystem operations must reject symlink path components rather than following aliases across trust boundaries.
  applies_to:
    - component:workspace-security

- schema_version: 1
  id: CONSTRAINT-SHA-PRECONDITION
  title: Existing-file edits require SHA preconditions
  statement: Replacements of existing files must fail when the supplied SHA-256 precondition is stale.
  applies_to:
    - component:workspace-security

- schema_version: 1
  id: CONSTRAINT-NO-SHELL
  title: Command execution never invokes a shell
  statement: Model-facing command execution must launch allowlisted programs directly with argument arrays and must not evaluate shell syntax.
  applies_to:
    - component:command-execution

- schema_version: 1
  id: CONSTRAINT-BOUNDED-DEV-TOOLS
  title: Common development CLIs remain command-bounded
  statement: Known developer CLIs must use tool-specific policy that separates read/check-only shapes from exact authorized mutations and permanently blocks credential redirection, unbounded helper execution, destructive infrastructure operations and secret-bearing state output; exact Git push may mediate only the current SSH Agent through a fixed non-interactive SSH command.
  applies_to:
    - component:command-execution

- schema_version: 1
  id: CONSTRAINT-MCP-COMPATIBILITY
  title: MCP revision handling is explicit
  statement: Supported MCP protocol revisions are accepted intentionally and unknown revisions fail explicitly.
  applies_to:
    - component:mcp-runtime

- schema_version: 1
  id: CONSTRAINT-BOUNDED-VERIFICATION
  title: Verification remains bounded
  statement: Verification plans, output, concurrency and execution shapes must remain bounded and deterministic.
  applies_to:
    - component:verification-harness

- schema_version: 1
  id: CONSTRAINT-EXPLICIT-PRECISION
  title: Software graph precision is explicit
  statement: Software graph facts must expose provider, precision and revision and Tree-sitter facts must never imply compiler-level semantic precision.
  applies_to:
    - component:software-graph
    - component:graph-persistence
    - component:semantic-providers

- schema_version: 1
  id: CONSTRAINT-EVIDENCE-PROVENANCE
  title: Evidence and imported facts retain provenance
  statement: Evidence and semantic or runtime facts must retain their real producer, revision and artifact identity so lower-confidence claims cannot be promoted into stronger proof.
  applies_to:
    - component:evidence-runtime
    - component:semantic-providers
    - component:graph-persistence

- schema_version: 1
  id: CONSTRAINT-FAIL-CLOSED-VERIFICATION
  title: Required verification stages fail closed
  statement: A required verification stage may clear only from real evidence bound to the Verification Plan's exact active code and Design State revision; stale contract evidence must not clear readiness, and one producer failure or disagreement must not be hidden by another producer pass.
  applies_to:
    - component:verification-mesh

- schema_version: 1
  id: CONSTRAINT-EXPLICIT-EXECUTION-TRUST
  title: Repository-aware execution uses explicit or hardened bounded trust
  statement: Repository-aware execution remains fail closed unless it uses a built-in hardened execution profile with bounded stdio, timeouts, sensitive and injection-capable environment scrubbing, a provider executable resolved outside the Workspace, and provider-specific repository-code execution disabled where supported. Hardened semantic providers may run automatically and must provide an explicit opt-out; persistent sessions must remain capacity-bounded, tied to Workspace plus provider-binary identity, discard dead or stale unleased slots, and never widen the Workspace boundary. Explicit trust for a non-automatic semantic provider must also bind the current provider-binary identity so replacing the executable invalidates the old grant. Other language servers and non-deterministic project verification executors require explicit trust expansion before execution.
  applies_to:
    - component:semantic-providers
    - component:verification-mesh

- schema_version: 1
  id: CONSTRAINT-SAFE-RECONCILIATION
  title: Reconciliation cannot bypass normal write and evidence gates
  statement: Reconciliation coordinates work but source mutations must use the bounded hash-guarded workspace write surface and Verification or HumanApproval tasks advance only from corresponding evidence.
  applies_to:
    - component:reconciliation-engine
    - component:reconciliation-execution

- schema_version: 1
  id: CONSTRAINT-RECONCILIATION-BOUNDED
  title: Reconciliation execution remains bounded and reviewable
  statement: Durable reconciliation execution must enforce dependency order, bounded retries, real system evidence gates and explicit human approval where required.
  applies_to:
    - component:reconciliation-execution

- schema_version: 1
  id: CONSTRAINT-PRODUCT-SCOPE-CANONICAL
  title: Product scopes are canonical across wcode surfaces
  statement: Source architecture, semantic scope aliases, software context navigation, MCP tool metadata and project context must use one canonical Product Scope registry while preserving freeform business scopes.
  applies_to:
    - component:product-scopes
    - component:semantic-registry
    - component:mcp-capabilities
    - component:convention-engine

- schema_version: 1
  id: CONSTRAINT-SCHEDULER-RESOURCES
  title: Scheduler decisions come from explicit workspace resources
  statement: Parallel scheduling must model reads, writes, creates, move sources, move destinations and deletes; independent work may fan out and conflicting resources must be dependency ordered.
  applies_to:
    - component:scheduler

- schema_version: 1
  id: CONSTRAINT-DESTRUCTIVE-AUTH
  title: Destructive operations require exact authorization
  statement: Delete and other dynamically gated destructive operations must bind approval to the exact operation fingerprint and consume one-shot grants once.
  applies_to:
    - component:authorization
    - component:workspace-operations

- schema_version: 1
  id: CONSTRAINT-INTEROPERABILITY-STANDARDS
  title: Agent and connector interoperability follows explicit standards
  statement: Remote agent integration must retain explicit MCP revision handling, OAuth PKCE/resource binding, bounded DCR metadata, protected-resource metadata, safe Origin handling and portable local stdio support. Persistent OAuth clients and tokens must be atomically stored outside repositories, scoped to configured Workspace roots, owner-protected, bounded, symlink-safe and fail closed on malformed state; authorization codes remain ephemeral.
  applies_to:
    - component:mcp-capabilities
    - component:oauth-interoperability
    - component:agent-integration

- schema_version: 1
  id: CONSTRAINT-SCOPED-SEMANTICS
  title: Semantic scopes change retrieval behavior
  statement: Requested scopes must filter scoped semantic facts and recognized Product Scopes must narrow software-context source navigation; unscoped facts remain global and unknown business scopes remain representable.
  applies_to:
    - component:semantic-registry
    - component:traceability-drift

- schema_version: 1
  id: CONSTRAINT-CONVENTION-BOUNDED
  title: Convention governance is bounded and source-derived
  statement: Convention and architecture findings must come from bounded workspace source inspection and must report rather than silently rewrite repository structure.
  applies_to:
    - component:convention-engine

- schema_version: 1
  id: CONSTRAINT-MAINTAINABILITY-REVIEW
  title: Correct behavior alone is not sufficient approval
  statement: Review must distinguish deterministic structural-growth signals from model judgment, escalate strong maintainability regressions into risk, and require independent review of code-judo simplification, branching/spaghetti growth, canonical ownership, type and abstraction boundaries, helper duplication, file-size growth, and parallel or atomic orchestration where relevant.
  applies_to:
    - component:actual-state-providers
    - component:risk-engine
    - component:verification-mesh

- schema_version: 1
  id: CONSTRAINT-ARCHITECTURE-FIRST-OBSERVABILITY
  title: Project observability is architecture-first
  statement: Operator-facing WebUI must show the complete component architecture before Requirement drill-down, overlay declared Design dependencies with current code-derived Actual dependencies using explicit provider/precision, distinguish strong positive-evidence drift from advisory evidence gaps, expose interpretable observed-drift and evidence-coverage metrics, then preserve Requirement → Desired State → Actual State → Change → Proof → Convergence detail with revision-matching Evidence, bounded code/change statistics, a bounded project file tree, largest-file and line-limit signals, and revision history. An undifferentiated global node-ball graph must not be the primary project view, and the browser must not perform an independent unbounded filesystem scan.
  applies_to:
    - component:intelligence-ui
    - component:traceability-drift
    - component:software-graph

- schema_version: 1
  id: CONSTRAINT-SPARSE-DESIGN-STATE
  title: Desired State files must carry meaning
  statement: Design initialization must not create empty collection documents merely to satisfy a schema shape; absent collections represent no declared desired state and collection files are created only when meaningful design content exists.
  applies_to:
    - component:design-state

- schema_version: 1
  id: CONSTRAINT-LANGUAGE-CAPABILITY-HONESTY
  title: Language support is a capability vector, not a checkbox
  statement: wcode must reuse the canonical indexed-language surface and report syntax, semantics, format, lint, type/static analysis, tests, security and advanced verification coverage separately; repository-declared or language-native tooling outranks imposed defaults, unavailable providers remain visible, and language-quality execution must be check-only with no formatter fix/write mode.
  applies_to:
    - component:language-quality
    - component:intelligence-ui
    - component:agent-integration

- schema_version: 1
  id: CONSTRAINT-AGENT-CONTEXT-ENFORCEMENT
  title: Agent guidance is not policy enforcement
  statement: Always-on agent guidance must remain a short map with detailed context loaded progressively through Skills and wcode retrieval; isolated agents may research or review independently, but model consensus cannot satisfy deterministic gates and mandatory policy must remain in Harness authorization verification and Evidence mechanisms.
  applies_to:
    - component:agent-integration
    - component:mcp-capabilities
    - component:verification-mesh

- schema_version: 1
  id: CONSTRAINT-DOCUMENTATION-GOVERNANCE
  title: Documentation has canonical ownership and one hosted surface
  statement: Maintained product integration architecture development and release documentation must live under docs/manual, render as one bilingual /docs/ and /zh/docs/ tree within the official Pages site, keep the product homepage as an entry surface rather than a second manual, preserve legacy /wiki/ URLs as redirects, and keep vendor-specific commands in one integration guide; root Markdown is limited to the project README and repository policy while package-local documentation stays with its package.
  applies_to:
    - component:documentation-governance
    - component:agent-integration

- schema_version: 1
  id: CONSTRAINT-CONTEXT-BUDGET
  title: Coding context is bounded and progressively disclosed
  statement: The default coding startup path must return a compact task-specific pack whose serialized size is actively trimmed to an explicit or bounded adaptive approximate token budget; when the caller omits a budget, task ambiguity, matched symbols, related Requirements, Design breadth, graph truncation, risk and scope breadth may raise the effective budget within a fixed range. Only the strongest direct match may contribute bounded hot source while additional bodies remain progressively disclosed, unrelated traceability is filtered before truncation, working-tree context is limited to direct targets and gathered fail-soft in parallel rather than expanding into full Git review, exact edit SHA preconditions plus relevant verification references are retained ahead of lower-value metadata, and the deterministic MCP tool catalog keeps bounded descriptions and a tested serialized byte budget.
  applies_to:
    - component:agent-context
    - component:agent-integration
    - component:mcp-capabilities

- schema_version: 1
  id: CONSTRAINT-SOURCE-DECOMPOSITION
  title: Source modules stay bounded
  statement: Maintained text files must stay at or below 1000 physical lines; generated lockfiles and binary assets are exempt. Split cohesive responsibilities into domain subdirectories before a file crosses that boundary. Repository filenames stay at or below 32 characters, with Rust stems at or below 24, because the directory already supplies context.
  applies_to:
    - component:convention-engine
    - component:documentation-governance

- schema_version: 1
  id: CONSTRAINT-TEST-ROOT
  title: Tests live in the repository test root
  statement: Standalone automated tests belong under tests/, grouped by source domain. Source modules may attach those files for private unit coverage instead of accumulating large inline test modules.
  applies_to:
    - component:verification-harness
    - component:convention-engine

- schema_version: 1
  id: CONSTRAINT-DESIGN-SYNC
  title: Design references move with the code
  statement: Changes to responsibilities, source paths, test paths, trust boundaries or transport behavior must update the matching .wcode Design State in the same change.
  applies_to:
    - component:design-state
    - component:traceability-drift

- schema_version: 1
  id: CONSTRAINT-CLI-SURFACE
  title: Default CLI surface stays task-level and model-readable
  statement: Default help must explain the no-subcommand runtime behavior and expose only stable task-level commands. One-command setup belongs in that default surface; package-export, compatibility, low-frequency transport/resource tuning and broad trust-boundary controls must not expand the normal model-facing catalog and may remain accepted but hidden when removing them would break existing workflows.
  applies_to:
    - component:cli-lifecycle

- schema_version: 1
  id: CONSTRAINT-VERIFIED-SELF-UPDATE
  title: Self-update cannot replace an unverified candidate
  statement: Self-update must use the release checksum contract, stage the downloaded binary separately, require successful version and help smoke tests, and replace the installation only afterward. A failed download, checksum, signature or smoke test must leave the existing installed binary in place; Windows replacement must occur only after the running executable exits.
  applies_to:
    - component:cli-lifecycle
