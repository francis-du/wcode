- schema_version: 1
  id: CONSTRAINT-ROOT-ISOLATION
  title: Canonical workspace root isolation
  statement: Model-facing paths must remain beneath the selected canonical workspace root and must reject absolute paths and parent traversal.
  applies_to:
    - component:workspace-security

- schema_version: 1
  id: CONSTRAINT-SYMLINK-REJECTION
  title: Symlink aliases are rejected
  statement: Model-facing filesystem operations must reject symlink path components rather than following aliases across trust boundaries.
  applies_to:
    - component:workspace-security

- schema_version: 1
  id: CONSTRAINT-SHA-PRECONDITION
  title: Existing-file edits require SHA preconditions
  statement: Replacements of existing files must fail when the supplied SHA-256 precondition is stale.
  applies_to:
    - component:workspace-security

- schema_version: 1
  id: CONSTRAINT-NO-SHELL
  title: Command policy is bypassed only by explicit all-command trust
  statement: Normal model-facing command execution must launch policy-checked programs directly with argument arrays and must not evaluate shell syntax. An explicit Workspace all-command grant or Full Access intentionally bypasses command-policy, executable, argument, shell, hardening and environment-scrubbing restrictions while retaining resource admission, process ownership, timeout, cancellation, bounded output and Workspace cwd selection.
  applies_to:
    - component:command-execution

- schema_version: 1
  id: CONSTRAINT-BOUNDED-DEV-TOOLS
  title: Common development CLIs remain command-bounded
  statement: Without explicit all-command trust, known developer CLIs for every indexed language must default bounded local test/check/lint/build/format/codegen/dependency and workspace-script workflows to the hardened autonomous development lane, while tool-specific policy blocks shell evaluation, inline/interactive interpreter escape where unsafe, compiler/plugin/agent injection, credential or filesystem redirection, destructive infrastructure operations and secret-bearing state output; exact Git push may mediate only the current SSH Agent through a fixed non-interactive SSH command. Explicit all-command trust bypasses these command-policy restrictions by operator choice.
  applies_to:
    - component:command-execution

- schema_version: 1
  id: CONSTRAINT-MCP-COMPATIBILITY
  title: MCP revision handling is explicit
  statement: Supported MCP protocol revisions are accepted intentionally and unknown revisions fail explicitly.
  applies_to:
    - component:mcp-runtime

- schema_version: 1
  id: CONSTRAINT-BOUNDED-VERIFICATION
  title: Verification remains bounded
  statement: Verification plans, output, concurrency and execution shapes must remain bounded and deterministic.
  applies_to:
    - component:verification-harness

- schema_version: 1
  id: CONSTRAINT-EXPLICIT-PRECISION
  title: Software graph precision is explicit
  statement: Software graph facts must expose provider, precision and revision and Tree-sitter facts must never imply compiler-level semantic precision.
  applies_to:
    - component:software-graph
    - component:graph-persistence
    - component:semantic-providers

- schema_version: 1
  id: CONSTRAINT-EVIDENCE-PROVENANCE
  title: Evidence and imported facts retain provenance
  statement: Evidence and semantic or runtime facts must retain their real producer, revision and artifact identity so lower-confidence claims cannot be promoted into stronger proof.
  applies_to:
    - component:evidence-runtime
    - component:semantic-providers
    - component:graph-persistence

- schema_version: 1
  id: CONSTRAINT-FAIL-CLOSED-VERIFICATION
  title: Required verification stages fail closed
  statement: A required verification stage may clear only from real evidence bound to the Verification Plan's exact active code and Design State revision; stale contract evidence must not clear readiness, and one producer failure or disagreement must not be hidden by another producer pass.
  applies_to:
    - component:verification-mesh

- schema_version: 1
  id: CONSTRAINT-EXPLICIT-EXECUTION-TRUST
  title: Repository-aware execution uses explicit or hardened bounded trust
  statement: Repository-aware execution remains fail closed unless it uses a built-in hardened execution profile with bounded stdio, timeouts, sensitive and injection-capable environment scrubbing, a provider executable resolved outside the Workspace, and provider-specific repository-code execution disabled where supported. Hardened semantic providers may run automatically and must provide an explicit opt-out; persistent sessions must remain capacity-bounded, tied to Workspace plus provider-binary identity, discard dead or stale unleased slots, and never widen the Workspace boundary. Explicit trust for a non-automatic semantic provider must also bind the current provider-binary identity so replacing the executable invalidates the old grant. Other language servers and non-deterministic project verification executors require explicit trust expansion before execution.
  applies_to:
    - component:semantic-providers
    - component:verification-mesh

- schema_version: 1
  id: CONSTRAINT-SAFE-RECONCILIATION
  title: Reconciliation cannot bypass normal write and evidence gates
  statement: Reconciliation coordinates work but source mutations must use the bounded hash-guarded workspace write surface and Verification or HumanApproval tasks advance only from corresponding evidence.
  applies_to:
    - component:reconciliation-engine
    - component:reconciliation-execution

- schema_version: 1
  id: CONSTRAINT-RECONCILIATION-BOUNDED
  title: Reconciliation execution remains bounded and reviewable
  statement: Durable reconciliation execution must enforce dependency order, bounded retries, real system evidence gates and explicit human approval where required.
  applies_to:
    - component:reconciliation-execution

- schema_version: 1
  id: CONSTRAINT-PRODUCT-SCOPE-CANONICAL
  title: Product scopes are canonical across wcode surfaces
  statement: Source architecture, semantic scope aliases, software context navigation, MCP tool metadata and project context must use one canonical Product Scope registry while preserving freeform business scopes.
  applies_to:
    - component:product-scopes
    - component:semantic-registry
    - component:mcp-capabilities
    - component:convention-engine

- schema_version: 1
  id: CONSTRAINT-SCHEDULER-RESOURCES
  title: Scheduler decisions come from explicit workspace resources
  statement: Parallel scheduling must model reads, writes, creates, move sources, move destinations, deletes and external-process contention resources; independent work may fan out and conflicting resources must be dependency ordered. Heavy process admission uses a per-Workspace/subspace quota before a separate host physical cap so one subspace cannot monopolize another subspace's local capacity. Cargo registry mutation is globally exclusive, workspace compilation/analysis is exclusive against same-workspace Cargo tests, and verification-safe test execution may share only a bounded reader lane governed by the subspace quota plus host capacity. Git-worktree mutation ownership remains independent from execution quota identity.
  applies_to:
    - component:scheduler

- schema_version: 1
  id: CONSTRAINT-DESTRUCTIVE-AUTH
  title: Destructive operations require exact authorization
  statement: Delete and other dynamically gated destructive operations must bind approval to the exact operation fingerprint and consume one-shot grants once.
  applies_to:
    - component:authorization
    - component:workspace-operations

- schema_version: 1
  id: CONSTRAINT-INTEROPERABILITY-STANDARDS
  title: Agent and connector interoperability follows explicit standards
  statement: Remote agent integration must retain explicit MCP revision handling, OAuth PKCE/resource binding, bounded DCR metadata, protected-resource metadata, safe Origin handling and portable local stdio support. Persistent OAuth clients and tokens must be atomically stored outside repositories, scoped to configured Workspace roots, owner-protected, bounded, symlink-safe and fail closed on malformed state; authorization codes remain ephemeral.
  applies_to:
    - component:mcp-capabilities
    - component:oauth-interoperability
    - component:agent-integration

- schema_version: 1
  id: CONSTRAINT-SCOPED-SEMANTICS
  title: Semantic scopes change retrieval behavior
  statement: Requested scopes must filter scoped semantic facts and recognized Product Scopes must narrow software-context source navigation; unscoped facts remain global and unknown business scopes remain representable.
  applies_to:
    - component:semantic-registry
    - component:traceability-drift

- schema_version: 1
  id: CONSTRAINT-CONVENTION-BOUNDED
  title: Convention governance is bounded and source-derived
  statement: Convention and architecture findings must come from bounded workspace source inspection and must report rather than silently rewrite repository structure.
  applies_to:
    - component:convention-engine

- schema_version: 1
  id: CONSTRAINT-MAINTAINABILITY-REVIEW
  title: Correct behavior alone is not sufficient approval
  statement: Review must distinguish deterministic structural-growth signals from model judgment, escalate strong maintainability regressions into risk, and require independent review of code-judo simplification, branching/spaghetti growth, canonical ownership, type and abstraction boundaries, helper duplication, file-size growth, and parallel or atomic orchestration where relevant.
  applies_to:
    - component:actual-state-providers
    - component:risk-engine
    - component:verification-mesh

- schema_version: 1
  id: CONSTRAINT-ARCHITECTURE-FIRST-OBSERVABILITY
  title: Project observability is architecture-first
  statement: >-
    Operator-facing TUI and WebUI must make the project understandable without an IDE. The WebUI leads with a readable semantic System Map rather than a node-link graph: one System root is followed by four responsibility layers (Orchestration, Composition, Consumers and Foundation), and each subsystem exposes its real depth, purpose, component/file/requirement counts and drift/change state. The primary map may use only a sparse top-down structural spine from System root through adjacent semantic tiers to make reading order obvious; these explanatory connectors are not raw dependency edges and must never become a crossing-line dependency network. Exact Design-vs-Actual dependency evidence remains explicit but is presented through the selected subsystem inspector and a separate source→target Dependency Ledger with provider/precision/status, never through a dense node-ball or spaghetti visualization. Component indexes stay secondary. A bounded Code Graph is permitted only as an internal Engineering Architecture workbench mode: it must use searchable/focusable upstream–focus–downstream lanes, preserve relation provenance and precision, cap depth/nodes/edges, and explain call/reference/dependency/test/requirement/proof relations without becoming the primary System Map or a free-form node-ball. The TUI leads with live task execution: wide terminals place Architecture / Drift / Proof / Repository Model in a right-side Engineering control rail beside Workspace Activity, while medium/narrow terminals hide the permanent pulse and keep those details in the Engineering Console so task rows are never displaced. Both surfaces preserve Requirement → Desired State → Actual State → Change → Proof → Convergence detail, visibly separate verification mapping from Executed, Passed and current-revision Fresh Evidence, and keep bounded code/change/file/history views. The canonical visual grammar includes four data-driven diagrams derived from the approved Observatory prototypes: the layered Architecture Blueprint, the Understand → Plan → Implement → Prove → Learn → Observe Engineering Closed Loop with one bounded feedback loop and a Design State / Codebase / Verification / Evidence support lane, the Requirement → Component → Code → Verification → Evidence traceability chain with independent Mapped / Executed / Passed / Fresh convergence dimensions, and the Current Changes → Impact Analysis → Verification → Confidence convergence view. These diagrams may use sparse sequential arrows between adjacent stages or zones when the arrows clarify direction; decorative arrow webs, arbitrary cross-links, raw dependency spaghetti, node-ball graphs, card walls, panel stacks, or a second mutable control-state source must never become the primary project representation.
  applies_to:
    - component:intelligence-ui
    - component:traceability-drift
    - component:software-graph

- schema_version: 1
  id: CONSTRAINT-BRAND-PALETTE
  title: Operator surfaces preserve the canonical wcode brand and fluid hierarchy
  statement: >-
    Engineering Observatory, TUI Engineering Console, Setup Hub and OAuth/operator pages must derive their visual identity from the canonical wcode Logo and homepage, never from an invented replacement palette. Dark foundations are #0b0812/#120d1c/#151020, primary brand accents are #8b7cff/#665cff with #f05aa6 secondary emphasis, and the Logo gradient is #665cff → #9b4dff → #f43f8f; light mode uses the homepage's corresponding purple/pink family. Success, warning and error remain subordinate semantic signals. Web surfaces must use the real repository Logo asset rather than text substitutes and must prefer only open/free typefaces: Inter with Noto Sans SC/Noto Sans for interface text and JetBrains Mono with Noto Sans Mono for code/identifiers; proprietary platform font names must not be part of the product CSS stack, and light/dark theme text tokens must preserve clear readable contrast. Desktop WebUI typography is readability-first: ordinary body text stays around 15–16px, controls around 13–14px, supporting/status/metadata text must remain at least 12px, and architecture node labels must remain large enough to read without zoom; density must come from hierarchy and progressive disclosure, never micro-copy. Observability color and elevation must encode meaning before decoration: current success, warning, failure, stale/unknown and inconclusive states remain visually distinguishable across Overview, Digital Twin, Activity, Proof, Changes, Requirements and Runtime, while the same project state uses the same semantic treatment wherever it appears. The Engineering Observatory follows one canonical desktop composition rather than free-form per-page layout: exactly one sticky Global Bar contains logo/title, project search, Workspace, live/refresh, language, theme, semantics and access; below it a non-sticky page Hero carries the current workspace kicker/title/subtitle, followed by exactly seven primary tabs (Overview, Engineering architecture, Task activity, Verification evidence, Current changes, Requirements, Project files) and one bounded metadata strip for parser/provider, freshness and tunnel state. Engineering signals, diagnostics and language quality are secondary Overview content rather than additional top-level tabs. Exactly one primary workspace is visible at a time. Workspace tabs never overlap or wrap labels onto each other; constrained widths use bounded horizontal scrolling, and a second sticky chrome row must never be introduced. The Global Bar exposes only short operational state and must never carry unbounded provider, precision or repository-path strings; provider/precision details belong in the non-sticky metadata strip. The approved Observatory prototypes are implementation specifications for composition, not optional inspiration: the Architecture workspace uses the root + four semantic swimlanes + inspector grammar and one internal four-mode workbench switch (System Map, Components, Dependencies, Code Graph); Overview leads with the six-stage engineering closed loop and its four support systems; Requirements leads with the five-column Requirement → Component → Code → Verification → Evidence traceability poster plus independent convergence criteria; Current Changes leads with Change Inputs → Impact Propagation → Convergence Outcomes plus an engineering-signal strip; Verification Evidence uses a four-metric strip followed by an approximately 70/30 Evidence Ledger / Evidence Inspector composition. The primary Architecture view is presented as the dominant left surface in an approximately 70/30 desktop map-to-inspector composition: the System root is visually highest and the detailed numeric depths are compressed into four readable semantic tiers (Orchestration → Composition → Consumers → Foundation), while every subsystem keeps its real L-depth, purpose, implementation counts and state. The Architecture workspace keeps exactly one internal workbench switch for System Map / Components / Dependencies / Code Graph; System Map retains functional Fit, zoom and Full Map controls, while Code Graph remains bounded and provenance-first. It may render only sparse structural connectors from root to the first tier and between adjacent tier columns; it must never render the complete dependency graph as arrows, Bezier edge webs, node-link SVGs or crossing lines. A selected subsystem keeps a stable desktop inspector beside the map and exposes purpose, owned components, upstream dependencies, downstream consumers, drift and linked evidence; Full Map explicitly hides that inspector, and narrow screens stack it below the map. Complete dependency evidence belongs to a separate readable source→target ledger that can filter Design, Actual or combined evidence without drawing a graph. The former multi-row utility-deck/dashboard shell and full-page stack of simultaneously expanded engineering workspaces must not be reintroduced. Desktop composition must preserve visible outer breathing room on every edge (roughly 32–44px horizontal, 20–24px top and generous bottom space). Only the single Global Bar remains sticky so Workspace, language, theme, live state, refresh and access controls stay anchored while workspace tabs and project content scroll naturally; narrow layouts may relax stickiness to protect usable viewport height but must retain safe gutters. Glass/blur is reserved for the single Global Bar, transient search results and lightweight overlays, while primary content and the architecture inspector rely on whitespace, typography, restrained surfaces and thin rules instead of card walls. Finite low-cardinality choices such as language, theme and live-refresh state must be directly visible buttons or segmented controls; dropdowns are reserved for genuinely dynamic collections such as Workspace selection. Rounded geometry must express hierarchy rather than turning every datum into a card; diagrams use spacious grouped surfaces, strong headings and bounded sequential arrows instead of visual noise. Dependency detail must never permanently consume the map with network lines. Top-level tab workspaces are not collapsible accordions and therefore must not show plus/minus or close-like disclosure affordances. TUI cannot simulate browser blur or choose the operator's terminal font, but it must use the same brand palette, rounded terminal borders, spacing hierarchy and restrained semantic emphasis. Narrow/touch layouts retain at least 44px interaction targets without reverting to square stacked boxes.
  applies_to:
    - component:intelligence-ui

- schema_version: 1
  id: CONSTRAINT-SPARSE-DESIGN-STATE
  title: Desired State files must carry meaning
  statement: Design initialization must not create empty collection documents merely to satisfy a schema shape; absent collections represent no declared desired state and collection files are created only when meaningful design content exists.
  applies_to:
    - component:design-state

- schema_version: 1
  id: CONSTRAINT-LANGUAGE-CAPABILITY-HONESTY
  title: Language support is a capability vector, not a checkbox
  statement: wcode must reuse the canonical indexed-language surface and report syntax, semantics, format, lint, type/static analysis, tests, security and advanced verification coverage separately; repository-declared or language-native tooling outranks imposed defaults, unavailable providers remain visible, and language-quality execution must be check-only with no formatter fix/write mode.
  applies_to:
    - component:language-quality
    - component:intelligence-ui
    - component:agent-integration

- schema_version: 1
  id: CONSTRAINT-AGENT-CONTEXT-ENFORCEMENT
  title: Agent guidance is not policy enforcement
  statement: Always-on agent guidance must remain a short map with detailed context loaded progressively through Skills and wcode retrieval; isolated agents may research or review independently, but model consensus cannot satisfy deterministic gates and mandatory policy must remain in Harness authorization verification and Evidence mechanisms.
  applies_to:
    - component:agent-integration
    - component:mcp-capabilities
    - component:verification-mesh

- schema_version: 1
  id: CONSTRAINT-DOCUMENTATION-GOVERNANCE
  title: Documentation has canonical ownership and one hosted surface
  statement: Maintained product integration architecture development and release documentation must live under docs/manual, render as one bilingual /docs/ and /zh/docs/ tree within the official Pages site, keep the product homepage as an entry surface rather than a second manual, preserve legacy /wiki/ URLs as redirects, and keep vendor-specific commands in one integration guide; root Markdown is limited to the project README and repository policy while package-local documentation stays with its package.
  applies_to:
    - component:documentation-governance
    - component:agent-integration

- schema_version: 1
  id: CONSTRAINT-CONTEXT-BUDGET
  title: Coding context is bounded and progressively disclosed
  statement: The default coding startup path must return a compact task-specific pack whose serialized size is actively trimmed to an explicit or bounded adaptive approximate token budget; when the caller omits a budget, task ambiguity, matched symbols, related Requirements, Design breadth, graph truncation, risk and scope breadth may raise the effective budget within a fixed range. Only the strongest direct match may contribute bounded hot source while additional bodies remain progressively disclosed, unrelated traceability is filtered before truncation, working-tree context is limited to direct targets and gathered fail-soft in parallel rather than expanding into full Git review, exact edit SHA preconditions plus relevant verification references are retained ahead of lower-value metadata, and the ordered task-specific recommended tool names survive tight-budget compaction even when capability prose/action-group metadata is dropped. The deterministic MCP tool catalog keeps bounded descriptions and a tested serialized byte budget.
  applies_to:
    - component:agent-context
    - component:agent-integration
    - component:mcp-capabilities

- schema_version: 1
  id: CONSTRAINT-SOURCE-DECOMPOSITION
  title: Source modules stay bounded
  statement: Maintained text files must stay at or below 1000 physical lines; generated source outputs, lockfiles, and binary assets are exempt. Split cohesive responsibilities into domain subdirectories before a file crosses that boundary. Repository filenames stay at or below 32 characters, with Rust stems at or below 24, because the directory already supplies context.

- schema_version: 1
  id: CONSTRAINT-TEST-ROOT
  title: Tests live in the repository test root
  statement: Standalone automated tests belong under the repository tests directory, grouped by the source domain. Source modules may attach those files for private unit coverage instead of accumulating large inline test modules.

- schema_version: 1
  id: CONSTRAINT-DESIGN-SYNC
  title: Design references move with the code
  statement: Changes to responsibilities, source paths, test paths, trust boundaries or transport behavior must update the matching .wcode Design State in the same change.

- schema_version: 1
  id: CONSTRAINT-CLI-SURFACE
  title: Default CLI surface stays task-level and model-readable
  statement: Default help must explain the no-subcommand runtime behavior and expose stable task-level commands plus the discoverable help-all reference entry. One-command setup belongs in that default surface; package-export, compatibility, low-frequency transport/resource tuning and broad trust-boundary controls may remain accepted but hidden from standard help. Explicit help-all must derive every supported CLI command and argument from the canonical parser, preserve defaults, value choices, aliases and global scope, label hidden and deprecated behavior, and offer command-scoped text or JSON without initializing workspaces, services, updates or permissions. It is CLI documentation, not an external-program allowlist or MCP tool schema.
  applies_to:
    - component:cli-lifecycle

- schema_version: 1
  id: CONSTRAINT-VERIFIED-SELF-UPDATE
  title: Self-update cannot replace an unverified candidate
  statement: Self-update must use the release checksum contract, stage the downloaded binary separately, require successful version and help smoke tests, and replace the installation only afterward. A failed download, checksum, signature or smoke test must leave the existing installed binary in place; Windows replacement must occur only after the running executable exits.
  applies_to:
    - component:cli-lifecycle

- schema_version: 1
  id: CONSTRAINT-EXECUTION-AUTHORITY
  title: Execution projects authority instead of duplicating it
  statement: Durable Execution and checkpoints may project objective, phase, revision, runnable work, plan references and blockers, but Worklist remains authoritative for model work, Reconciliation remains authoritative for convergence tasks, Verification/Evidence remain authoritative for proof, and Authorization remains authoritative for trust. Execution cannot invent, overwrite or weaken those states and terminal completion must be derived from them.
  applies_to:
    - component:execution-runtime
    - component:agent-context

- schema_version: 1
  id: CONSTRAINT-APPROVED-PLAN-IMMUTABLE
  title: Approved implementation plans are immutable snapshots
  statement: Once a human-approved implementation or Reconciliation plan is admitted for execution, its canonical digest, code and Design revisions, acceptance references and trust/risk assumptions are frozen for that execution attempt. Material drift creates replan_required rather than silently mutating or re-deriving approved decisions.
  applies_to:
    - component:execution-runtime
    - component:reconciliation-engine

- schema_version: 1
  id: CONSTRAINT-MULTI-AGENT-WRITE-ISOLATION
  title: Parallel agents never share overlapping or unconstrained write ownership
  statement: Parallel investigation and review are read-only by default. Unscoped writers retain whole mutation-domain exclusivity. Concurrent writers inside one Git mutation domain require explicit approved workspace-relative write_scopes that normalize to non-overlapping path subtrees; every file mutation must remain inside its owner's scopes, while workspace-mutating commands require whole-domain ownership. One authenticated MCP owner may hold at most one writer lease so owner-level enforcement cannot merge multiple task scopes. Remote OAuth owner identity is stable per authorization grant across refresh and distinct across independent grants from the same client application; legacy persisted tokens keep their prior client-bound owner. Missing runtime ownership for a durable claim fails closed. Linked worktrees remain the preferred stronger isolation boundary for broad or uncertain lanes, and all lanes converge only through normal review, reconciliation and verification.
  applies_to:
    - component:execution-orchestrator
    - component:scheduler

- schema_version: 1
  id: CONSTRAINT-DECLARATIVE-EXECUTION-POLICY
  title: Mandatory lifecycle policy is declarative and non-executable
  statement: Mandatory coding lifecycle requirements must be evaluated by bounded declarative runtime policy rather than prompt memory or arbitrary repository-provided executable hooks. Policy may increase review, verification, approval or capability restrictions but cannot bypass existing Workspace, Authorization, Evidence or Verification gates.
  applies_to:
    - component:execution-policy
    - component:authorization
    - component:verification-mesh

- schema_version: 1
  id: CONSTRAINT-EXECUTION-SANDBOX-LAYERING
  title: Sandbox isolation and human approval are separate layers
  statement: If broad agent-owned shell execution is introduced, OS sandboxing constrains filesystem and network effects independently from approval; approval decides whether the request may be attempted. Neither layer may substitute for the other or weaken existing Workspace, environment-scrubbing, executable-identity or destructive-operation controls.
  applies_to:
    - component:execution-policy
    - component:workspace-operations
