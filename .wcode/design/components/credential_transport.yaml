schema_version: 1
id: component:credential-transport
name: Credential-safe execution environment and text transport
responsibilities:
  - Share one pure bounded Git SSH eligibility check across argument hardening, command launch and environment cleanup; preserve existing push behavior and admit only fully validated explicit-ref fetch.
  - Reuse existing command environment cleanup to reject inherited credential values and private credential/key locations in the guarded execution lane.
  - Redact exact-shaped Team and CI opaque credentials in source and output using the same bounded row-preserving text redactor.
implementation:
  - {kind: symbol, path: src/workspace/command_policy.rs, symbol: is_git_ssh_command}
  - {kind: symbol, path: src/workspace/command_policy/environment.rs, symbol: scrub_sensitive_environment}
  - {kind: file, path: src/workspace/operations/credential_redaction.rs}
