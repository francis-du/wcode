schema_version: 1
id: component:worklist-delegation
name: Host-neutral Worklist Delegation
responsibilities:
  - persist claim ownership, expiry, path coordination and reported child outcomes in the existing Worklist
  - publish private claim tokens only to the claimant and redact tokens from all public projections
  - provide bounded reusable source, Design, SHA, verification and host-native spawning handoffs
  - prune unrelated global progress before handoff budget/readiness planning while preserving mandatory execution recovery
  - reject stale revisions, unfinished dependencies, overlapping live scopes and forged evidence references
  - describe tool batching, serial context continuation and host model spawning as distinct capabilities
constraints:
  - CONSTRAINT-MULTI-AGENT-WRITE-ISOLATION
  - CONSTRAINT-FAIL-CLOSED-VERIFICATION
depends_on:
  - component:execution-runtime
  - component:agent-context
  - component:verification-mesh
implementation:
  - {kind: file, path: src/runtime/worklist.rs}
  - {kind: file, path: src/runtime/worklist_delegation.rs}
  - {kind: file, path: src/runtime/harness/context/handoff.rs}
  - {kind: file, path: src/runtime/harness/capabilities.rs}
  - {kind: file, path: src/runtime/harness/capability.rs}
  - {kind: symbol, path: src/integrations/mcp/dispatch/intelligence.rs, symbol: call}
