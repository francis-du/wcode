schema_version: 1
id: component:execution-orchestrator
name: Isolated Multi-Agent Execution Orchestrator
responsibilities:
  - run independent investigators and Review claims concurrently with read-only authority by default
  - retain one opaque runtime writer lease for a shared Git-worktree mutation domain and bind it to a claimed Design/Implementation task plus MCP owner
  - gate direct file mutations and commands classified as workspace-writing while a writer lease is active
  - resolve nested Workspace/subspace roots to their containing Git worktree so aliases cannot create a second writer domain
  - permit additional writers only through separately registered linked-worktree Workspace roots with isolated Execution/Reconciliation/Evidence state; never auto-create model-owned worktrees
  - converge writer results through review reconciliation and verification rather than model consensus
  - expose sanitized ownership state without exposing lease tokens
constraints:
  - CONSTRAINT-MULTI-AGENT-WRITE-ISOLATION
  - CONSTRAINT-PARALLEL-FIRST
  - CONSTRAINT-SCHEDULER-RESOURCES
depends_on:
  - component:execution-runtime
  - component:scheduler
  - component:verification-mesh
implementation:
  - {kind: file, path: src/integrations/mcp/writer.rs}
  - {kind: file, path: src/integrations/mcp/dispatch/mod.rs}
  - {kind: file, path: src/workspace/scheduler.rs}
  - {kind: file, path: src/reconciliation/mod.rs}
  - {kind: file, path: src/reconciliation/execution_store.rs}
