schema_version: 1
id: component:execution-sandbox
name: Broad Execution OS Sandbox
responsibilities:
  - classify command shapes outside bounded profiles as broad execution under ordinary permissive execution and explicit Workspace all-command or Full Access overrides
  - transform broad commands into platform-native sandbox launches before process spawn while leaving bounded profiles, including supported syntax-only shell checks, on the hardened direct path
  - make the selected Workspace read-only unless writes are enabled or an explicit all-command override supplies write access; retain required system/tool reads and private scratch while protecting credential, repository-control and configured authority-state paths
  - deny external network access and preserve cwd/time/resource bounds and sensitive/injection-capable environment scrubbing
  - use macOS Seatbelt and Linux bubblewrap; reject broad execution on Windows or when any platform/provider cannot enforce the required boundary
  - keep sandbox isolation independent from command authorization so ordinary admission, exact grants and session overrides never disable containment or authorize separate HumanApproval decisions
constraints:
  - CONSTRAINT-EXECUTION-SANDBOX-LAYERING
  - CONSTRAINT-EXPLICIT-EXECUTION-TRUST
  - CONSTRAINT-ROOT-ISOLATION
depends_on:
  - component:workspace-operations
  - component:execution-policy
  - component:authorization
implementation:
  - {kind: file, path: src/workspace/sandbox.rs}
  - {kind: symbol, path: src/workspace/operations/execution.rs, symbol: Workspace::run_command}
  - {kind: file, path: src/workspace/command_policy.rs}
