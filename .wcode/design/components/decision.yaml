schema_version: 1
id: component:decision-plane
name: Fast Decision Plane
responsibilities:
  - define provider-neutral probability, choice and score decision primitives with explicit confidence and evidence codes
  - evaluate bounded Agent Context state without requiring a large model round trip
  - expose assist recommendations for retrieval and semantic navigation while keeping verification escalation shadow-observable
  - preserve deterministic authorization, risk, evidence, SHA and verification floors as non-overridable authority
  - provide typed probability lookup and Brier primitives for measuring decision quality over independent outcomes
  - calibrate context sufficiency against Engineering Fitness Gold edit inputs, including false-stop and false-continue counts across budgets and cold/warm phases
  - compare baseline and candidate providers on the same request, recording overlap, numeric deltas, choice disagreements, malformed shape and safety-policy violations without granting the candidate execution authority
  - benchmark candidate providers against the same authored Fitness Gold so external or local providers can be evaluated without changing runtime behavior
depends_on: []
constraints:
  - CONSTRAINT-BOUNDED-VERIFICATION
  - CONSTRAINT-CONTEXT-BUDGET
implementation:
  - {kind: file, path: src/intelligence/decision.rs}
  - {kind: file, path: src/runtime/harness/agent_context.rs}
  - {kind: file, path: tests/unit/runtime/harness/fitness/scoring.rs}
  - {kind: file, path: tests/unit/runtime/harness/fitness/report.rs}
