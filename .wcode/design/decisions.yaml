- schema_version: 1
  id: ADR-001
  title: Structured Design State is the desired-state source of truth
  status: accepted
  decision: Requirements, components, constraints, decisions and acceptance criteria are stored as structured Design State; rendered documents are views rather than the authoritative machine state.
  rationale: Software intelligence, drift detection and reconciliation require stable machine-readable identifiers and relationships.
  affects:
    - product:wcode

- schema_version: 1
  id: ADR-002
  title: Software intelligence remains model-neutral
  status: accepted
  decision: Core design, graph, verification, evidence and risk contracts must not depend on a specific model vendor.
  rationale: Models are replaceable builders and reviewers while wcode owns durable software intelligence state and evidence.
  affects:
    - component:mcp-runtime
    - component:verification-harness
    - component:software-graph

- schema_version: 1
  id: ADR-003
  title: Documentation has one canonical hosted tree
  status: accepted
  decision: Maintained Markdown is organized under docs/manual and built into HTML under the official Pages /docs/ and /zh/docs/ routes using the same visual system as the product website; legacy /wiki/ routes redirect to the canonical documentation.
  rationale: One canonical documentation tree removes the website-versus-WIKI split, gives users one navigation model, and prevents scattered documents or conflicting integration instructions.
  affects:
    - component:documentation-governance
    - component:agent-integration

- schema_version: 1
  id: ADR-004
  title: agent_context prefers the most specific matching subspace
  status: accepted
  decision: When agent_context is invoked without an explicit workspace argument, wcode may select the deepest discovered subspace whose id or final path segment appears in the query text. Explicit workspace arguments always win; other tools retain default selection.
  rationale: Multi-project parent workspaces otherwise inject unrelated noise into the coding startup pack. Conservative textual matching keeps the preference predictable and does not expand the trust boundary of non-agent_context tools.
  affects:
    - component:agent-context
    - component:mcp-runtime
    - component:workspace-operations

- schema_version: 1
  id: ADR-005-ADVISORY-DECISION-PLANE
  title: Fast decisions are advisory and cannot weaken deterministic safety
  status: accepted
  decision: A provider-neutral Decision Plane may emit bounded probability, choice and score signals for Agent strategy, but those signals cannot reduce authorization, SHA preconditions, evidence requirements, risk-derived verification profiles, deterministic checks, or human approval. The deterministic provider remains behavioral authority for any work-reducing transition. Model-backed providers first run against the identical request for comparison; an explicitly integrated provider may then be promoted only to increase-only assist, where it can request more retrieval, semantic navigation, verification, or reasoning while a more permissive edit action is suppressed unless it exactly matches the deterministic baseline. Jev is the first such optional provider and is detected dynamically per Agent Context call; missing credentials, invalid configuration, low confidence, or provider failure must fail soft to deterministic behavior.
  rationale: Lightweight decisions can improve routing only if probabilistic confidence never becomes a bypass around wcode's deterministic trust boundary. Provider quality must be judged against independent evidence where available; context sufficiency therefore uses authored Engineering Fitness Gold edit inputs rather than the provider's own readiness labels, so external, local or deterministic providers can be compared on the same Brier and false-stop/false-continue basis. Increase-only promotion captures latency and search-quality benefits without allowing a network-backed provider to reduce required evidence or verification, while dynamic fail-soft discovery avoids making Jev availability a prerequisite for wcode correctness.
  affects:
    - REQ-DECISION-001
    - component:decision-plane
    - component:agent-context
    - component:verification-harness

- schema_version: 1
  id: ADR-006-DURABLE-EXECUTION
  title: Long-running coding work is represented by a derived durable Execution
  status: accepted
  decision: A per-Workspace Execution envelope and structured checkpoint sit above Worklist, Reconciliation, Verification and Authorization without replacing their authority. Execution stores prompt-free recovery state and Agent Context restores it before reconstructing prior work.
  rationale: Market-leading coding agents increasingly make task/session continuity first-class, while wcode already owns stronger durable engineering state. A derived Execution unifies those states without creating a second mutable source of truth or persisting chat history.
  affects:
    - REQ-EXECUTION-001
    - REQ-EXECUTION-SETTLEMENT-001
    - component:execution-runtime
    - component:agent-context

- schema_version: 1
  id: ADR-007-PROGRESSIVE-CAPABILITIES
  title: Specialized agent capabilities are progressively disclosed
  status: accepted
  decision: >-
    wcode keeps one shared mandatory core/action registry. Agent Context compiles a bounded task manifest and Jev may
    only promote extra read/advisory actions. The complete MCP tools/list remains deterministic and task-independent;
    MCP 2026-07-28 forbids varying list endpoints per connection or as a side effect of another request, so
    tools/list_changed is reserved for real catalog changes rather than task routing. Hosts can preload only core tools
    and use the task manifest to decide which on-demand schemas reach the model. Metadata-first is a recommendation;
    Hosts may ignore it and expose the complete catalog. Explicit requests, safety, recovery, authorization and
    required verification capabilities remain callable through normal runtime checks even outside the recommendation.
  rationale: >-
    Large always-on tool and Skill schemas consume model context and increase routing noise, but abusing protocol
    catalog mutation for task state would violate the stateless MCP contract and harm prompt-cache stability.
    Metadata-first host/model routing can reduce schema noise when the Host supports it while preserving protocol
    interoperability and explicit/recovery tool reachability. Serialized selection byte comparisons do not establish
    actual Host token savings, cache hits or end-to-end performance.
  affects:
    - REQ-CAPABILITY-ROUTING-001
    - component:capability-router
    - component:mcp-capabilities

- schema_version: 1
  id: ADR-008-PLAN-SNAPSHOT
  title: Approved plans are frozen inputs, not mutable suggestions
  status: accepted
  decision: Human-approved implementation plans execute from an immutable revision-bound snapshot. Material premise, trust-boundary or risk drift stops execution with replan_required; agents may not silently redesign the approved plan in place.
  rationale: Separating planning approval from implementation prevents the executed change from diverging materially from what the human reviewed and gives Verification a stable object to evaluate.
  affects:
    - REQ-APPROVED-PLAN-001
    - component:execution-runtime
    - component:reconciliation-engine

- schema_version: 1
  id: ADR-009-MULTI-AGENT-OWNERSHIP
  title: Multi-agent writers use explicit scope isolation with whole-domain fallback
  status: accepted
  decision: >-
    Independent investigators and reviewers run concurrently read-only. Design/Implementation tasks default to whole
    mutation-domain writer exclusivity, but an approved plan may declare explicit write_scopes and admit multiple
    authenticated writers only when their normalized path subtrees do not overlap. Direct file mutations are
    scope-checked and SHA-guarded; broad workspace-mutating commands still require whole-domain ownership. Linked
    worktrees remain available for stronger isolation.
  rationale: >-
    Read-many/single-writer is safe but unnecessarily serializes clearly independent implementation lanes. Explicit
    approved path scopes recover bounded parallel write throughput without allowing uncontrolled races. Overlap,
    unknown write surfaces, lost runtime ownership and restart ambiguity all fail closed, while existing unscoped
    plans preserve the former safety model.
  affects:
    - REQ-MULTI-AGENT-001
    - component:execution-orchestrator
    - component:scheduler

- schema_version: 1
  id: ADR-010-RUNTIME-POLICY
  title: Mandatory agent workflow belongs to declarative runtime policy
  status: accepted
  decision: Required lifecycle actions such as review, verification, approval and capability restrictions are enforced by inspectable declarative policy composed with existing trust/evidence mechanisms, not by relying on Skills/prompts or arbitrary executable repository hooks. An OS sandbox is added only if wcode later exposes broader agent-owned shell execution, and remains independent from approval.
  rationale: Prompt instructions are advisory and arbitrary hooks widen the attack surface. Declarative policy makes mandatory behavior testable and model-neutral while preserving wcode's existing authorization and verification boundaries.
  affects:
    - REQ-EXECUTION-POLICY-001
    - REQ-EXECUTION-SANDBOX-001
    - component:execution-policy

- schema_version: 1
  id: ADR-011-BROAD-EXECUTION-SANDBOX
  title: Policy-bypass commands are sandboxed instead of becoming raw Full Access children
  status: accepted
  decision: Commands that remain valid under wcode's bounded command profiles keep the existing direct execution path. A command admitted only because Workspace all-command or Full Access bypasses the bounded profile is broad execution and must be transformed by an OS sandbox before spawn. macOS uses Seatbelt and Linux uses bubblewrap; an unavailable or unsupported provider fails the broad command closed. Sandbox policy grants Workspace read/write and required system/tool reads, denies external network access, preserves resource/cwd bounds and keeps sensitive environment scrubbing active. Human authorization cannot disable this isolation layer.
  rationale: All-command and Full Access currently create the exact broad agent-owned execution surface anticipated by REQ-EXECUTION-SANDBOX-001. Sandboxing only the bypass lane preserves compatibility and performance for normal engineering commands while preventing explicit approval from becoming equivalent to unisolated shell authority.
  affects:
    - REQ-EXECUTION-SANDBOX-001
    - component:execution-sandbox
    - component:workspace-operations
    - component:execution-policy
