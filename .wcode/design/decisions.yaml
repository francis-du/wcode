- schema_version: 1
  id: ADR-001
  title: Structured Design State is the desired-state source of truth
  status: accepted
  decision: Requirements, components, constraints, decisions and acceptance criteria are stored as structured Design State; rendered documents are views rather than the authoritative machine state.
  rationale: Software intelligence, drift detection and reconciliation require stable machine-readable identifiers and relationships.
  affects:
    - product:wcode

- schema_version: 1
  id: ADR-002
  title: Software intelligence remains model-neutral
  status: accepted
  decision: Core design, graph, verification, evidence and risk contracts must not depend on a specific model vendor.
  rationale: Models are replaceable builders and reviewers while wcode owns durable software intelligence state and evidence.
  affects:
    - component:mcp-runtime
    - component:verification-harness
    - component:software-graph

- schema_version: 1
  id: ADR-003
  title: Documentation has one canonical hosted tree
  status: accepted
  decision: Maintained Markdown is organized under docs/manual and built into HTML under the official Pages /docs/ and /zh/docs/ routes using the same visual system as the product website; legacy /wiki/ routes redirect to the canonical documentation.
  rationale: One canonical documentation tree removes the website-versus-WIKI split, gives users one navigation model, and prevents scattered documents or conflicting integration instructions.
  affects:
    - component:documentation-governance
    - component:agent-integration

- schema_version: 1
  id: ADR-004
  title: agent_context prefers the most specific matching subspace
  status: accepted
  decision: When agent_context is invoked without an explicit workspace argument, wcode may select the deepest discovered subspace whose id or final path segment appears in the query text. Explicit workspace arguments always win; other tools retain default selection.
  rationale: Multi-project parent workspaces otherwise inject unrelated noise into the coding startup pack. Conservative textual matching keeps the preference predictable and does not expand the trust boundary of non-agent_context tools.
  affects:
    - component:agent-context
    - component:mcp-runtime
    - component:workspace-registry
