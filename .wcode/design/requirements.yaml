- schema_version: 1
  id: REQ-OBSERVABILITY-001
  title: Architecture-first project observability
  intent: The protected WebUI must first expose the complete component architecture as a Design-vs-Actual dependency graph with interpretable observed-drift, evidence-coverage and implementation-coverage metrics, explicit provider/precision, and component/module drill-down for responsibilities, implementation mappings, related requirements, dependencies and current changes. Requirement detail then remains organized as Desired State → Actual State → Change → Proof → Convergence with revision-exact Evidence and real blockers. Negative inference must remain precision-aware; absence from a bounded syntax graph is advisory rather than proof of a missing dependency.
  priority: critical
  implemented_by:
    - component:intelligence-ui
    - component:traceability-drift
    - component:actual-state-providers
    - component:software-graph
  acceptance:
    - AC-OBSERVABILITY-001
  constraints:
    - CONSTRAINT-ARCHITECTURE-FIRST-OBSERVABILITY
    - CONSTRAINT-EXPLICIT-PRECISION
  risk:
    reliability: critical

