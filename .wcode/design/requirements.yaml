- schema_version: 1
  id: REQ-AGENT-INSTALL-001
  title: Safe one-command Agent host installation
  intent: agent-plugin --install-all must detect known local hosts through adapter evidence, show a no-write dry run, merge wcode into recognized project-local JSON schemas atomically and idempotently, preserve every unrelated MCP server, write no credential, and report unsafe or unknown host schemas as manual or failed instead of claiming success.
  priority: critical
  implemented_by:
    - component:agent-host-install
    - component:agent-integration
  acceptance:
    - AC-AGENT-INSTALL-001
  constraints:
    - CONSTRAINT-INTEROPERABILITY-STANDARDS
    - CONSTRAINT-ROOT-ISOLATION
  risk:
    security: critical
    compatibility: critical

- schema_version: 1
  id: REQ-SOURCE-LAYOUT-001
  title: Source structure stays bounded and traceable
  intent: Rust production and test files must remain at or below 1000 lines, large domains must be split into concise submodules, tests must live under the repository root tests tree, and path or trust-boundary moves must update Design State in the same change.
  priority: critical
  implemented_by:
    - component:convention-engine
    - component:design-state
  acceptance:
    - AC-SOURCE-LAYOUT-001
  constraints:
    - CONSTRAINT-SOURCE-DECOMPOSITION
    - CONSTRAINT-TEST-ROOT
    - CONSTRAINT-DESIGN-SYNC
  risk:
    reliability: critical
    performance: medium

- schema_version: 1
  id: REQ-SCOPE-001
  title: Product Scopes drive wcode capability boundaries
  intent: wcode must use one canonical Product Scope model across source architecture, semantic scope aliases, software-context navigation, MCP tool metadata and project context while retaining freeform business scopes.
  priority: critical
  implemented_by:
    - component:product-scopes
    - component:semantic-registry
    - component:mcp-capabilities
  acceptance:
    - AC-SCOPE-001
  constraints:
