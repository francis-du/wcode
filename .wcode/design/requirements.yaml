- schema_version: 1
  id: REQ-WORKSPACE-001
  title: Transactional workspace coding primitives
  intent: Models must use guarded workspace primitives. The WebUI may authorize a canonical, non-symlink derived subspace inside its selected parent without relaxing manual overlap policy; executable access and exact repository-operation approval remain separate grants and never bypass no-shell or risky-operation checks.
  priority: critical
  implemented_by:
    - component:workspace-operations
    - component:workspace-security
    - component:authorization
  acceptance:
    - AC-WORKSPACE-001
  constraints:
