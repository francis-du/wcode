    - CONSTRAINT-SHA-PRECONDITION
    - CONSTRAINT-DESTRUCTIVE-AUTH
  risk:
    security: critical
    reliability: critical

- schema_version: 1
  id: REQ-SCHEDULER-001
  title: Dependency-aware parallel tool scheduling
  intent: Independent workspace reads and writes must fan out under the global capacity cap while conflicting resources are dependency ordered and safe same-file edits are coalesced atomically.
  priority: critical
  implemented_by:
    - component:scheduler
    - component:verification-harness
  acceptance:
    - AC-SCHEDULER-001
  constraints:
    - CONSTRAINT-SCHEDULER-RESOURCES
  risk:
    reliability: critical
    performance: high

- schema_version: 1
  id: REQ-AUTH-001
  title: Dynamic destructive authorization
  intent: Destructive and dynamically gated operations, including narrowly authorizable repository mutations, must require explicit human authorization bound to the exact operation; one-shot destructive grants must be consumed once and session grants must not widen permanently blocked command shapes.
  priority: critical
  implemented_by:
    - component:authorization
    - component:workspace-operations
  acceptance:
    - AC-AUTH-001
  constraints:
    - CONSTRAINT-DESTRUCTIVE-AUTH
  risk:
    security: critical
    reliability: high

