- schema_version: 1
  id: REQ-LANGUAGE-QUALITY-001
  title: Language support is capability-complete and observable
  intent: Every syntax-indexed language must participate in one explicit capability matrix covering syntax, semantic providers, repository-declared or language-native format/lint/type/static/test/security providers, and advanced Property/Mutation/Fuzz/Runtime verification stages; gaps must remain visible, and executable quality providers must be check-only, authorization-bound, and produce revision-exact Evidence.
  priority: critical
  implemented_by:
    - component:language-quality
    - component:intelligence-ui
  acceptance:
    - AC-LANGUAGE-QUALITY-001
  constraints:
    - CONSTRAINT-LANGUAGE-CAPABILITY-HONESTY
    - CONSTRAINT-EVIDENCE-PROVENANCE
  risk:
    reliability: critical
    compatibility: high

- schema_version: 1
  id: REQ-DOCS-001
  title: Canonical documentation is unified with the product site
  intent: Users must reach one canonical bilingual Documentation tree from the website and README. English and Chinese pages should read naturally in their own language, use direct product wording, avoid translated sentence structure and inflated marketing claims, and keep changing vendor details in one maintained integration reference.
  priority: high
  implemented_by:
    - component:documentation-governance
  acceptance:
    - AC-DOCS-001
  constraints:
    - CONSTRAINT-DOCUMENTATION-GOVERNANCE
  risk:
    reliability: high
    compatibility: medium

- schema_version: 1
  id: REQ-AGENT-CONTEXT-001
  title: Token-efficient edit-ready agent context
  intent: Coding agents must be able to start substantial implementation work from one bounded task-specific context pack that prioritizes relevant Design State, symbol signatures, exact edit SHA preconditions, verification references, graph evidence and quality gates while excluding unrelated traceability, ranking likely callers/callees/helpers through a compact repository map, and deferring source bodies until explicitly requested.
  priority: critical
  implemented_by:
    - component:agent-context
  acceptance:
    - AC-AGENT-CONTEXT-001
  constraints:
    - CONSTRAINT-CONTEXT-BUDGET
    - CONSTRAINT-AGENT-CONTEXT-ENFORCEMENT
    - CONSTRAINT-EXPLICIT-PRECISION
  risk:
    performance: critical
    reliability: high

- schema_version: 1
  id: REQ-TUNNEL-001
  title: Public tunnel availability is provider-resilient
  intent: Remote MCP startup must not depend on one tunnel vendor. wcode keeps every instance-health-verified tunnel live, self-heals failures without restarting the process, directs OAuth to the hostname receiving the request, and preserves scoped persisted sessions when clients reconnect through another verified alias or restart the runtime.
  priority: high
  implemented_by:
    - component:managed-tunnel
  acceptance:
    - AC-TUNNEL-001
  risk:
    reliability: critical
    compatibility: high
