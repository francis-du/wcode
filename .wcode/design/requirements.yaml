  id: REQ-DESIGN-SPARSE-001
  title: Desired State stays sparse and meaningful
  intent: Design initialization must create project and product state plus the meaningful source-decomposition, root-test-tree and Design-sync constraints; unrelated empty requirement, component, acceptance, or decision collections must not be materialized as placeholders.
