- schema_version: 1
  id: REQ-HARNESS-001
  title: Verification must remain bounded
  intent: >-
    Deterministic project verification must use bounded inferred checks, bounded output and controlled concurrency. Fail-fast scheduling may learn only from versioned deterministic check Evidence normalized to one latest observation per exact-command revision so retries cannot manufacture statistical confidence; equal-timestamp result conflicts stay fail-closed. It may reorder execution into a bounded frontier of at most two phase-zero sentinels: the first requires at least four independent revision samples, two observed failures and positive expected savings from repeatedly sampled remaining costs, while a second may be promoted only when shared revision evidence proves at least four first-sentinel-surviving samples, at least two failures missed by the first sentinel and positive marginal expected savings after charging its own runtime. Temporal revision replay is an activation circuit breaker: cold-start exploration is permitted before four evaluable holdout revisions, but a mature adaptive frontier remains active only with positive net time savings and zero outcome mismatches; proven non-positive replay or any outcome mismatch restores the canonical static plan. Correlated failures, history-read failure, insufficient evidence or diagnostic mode likewise preserve the static plan, and adaptive scheduling must never remove required checks or change pass/fail semantics. Quick verification may add at most one Rust, Python or Go focused test only when a direct changed implementation path maps through valid Design State to an Acceptance test in the same owning language island, that exact simple test symbol resolves in the declared file through the syntax index, and the island uses its canonical cargo-test, pytest or go-test runner; focused pytest node IDs and Go package/-run filters must remain workspace-relative exact verification shapes, the focused check runs after static quick checks, never replaces broad full tests, and stale, ambiguous, dynamic, escaping or otherwise unsupported mappings must preserve the original plan. Repeated verification may reuse only a short-lived allowlist of successful static check results when code revision, Design revision, exact command/check shape, execution mode, environment and executable identity match; behavioral tests and unknown scripts always rerun, failures and incomplete/stale revisions are never promoted, reused checks are explicit in the report, and citing prior proof must not mint duplicate Evidence.
  priority: critical
  implemented_by:
    - component:verification-harness
  acceptance:
    - AC-HARNESS-001
  constraints:
    - CONSTRAINT-BOUNDED-VERIFICATION
  risk:
    security: high
    reliability: critical
    performance: high

