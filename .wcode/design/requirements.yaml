- schema_version: 1
  id: REQ-SEMANTIC-001
  title: Cross-language scoped semantic runtime
  intent: >-
    Every indexed language must have exactly one tested canonical LSP launch profile and may have bounded real alternate profiles; runtime selection must use current provider-specific launch contracts, discover provider binaries from trusted PATH plus bounded language-native install locations where defined, and fall back to an installed alternate when the canonical provider fails initialization. Discovery must validate that an apparent executable is actually runnable before marking it available: language-manager shims such as rustup hardlinks/symlinks whose component is not installed are unavailable, viability probes are cached and strictly time-bounded, and a broken automatic provider must degrade to honest syntax fallback instead of creating a repeating semantic_auto error storm. Provider state and failures must distinguish missing/discovery, authorization, spawn, initialize, protocol and live states with actionable next steps instead of leaking ambiguous raw OS errors. Scoped semantic retrieval must integrate Product Scopes without losing freeform business scopes, and operator-facing intelligence must prefer fresh semantic or runtime graph evidence while exposing syntax fallback honestly. Hardened first-party providers may maintain bounded warm sessions automatically, synchronize source revisions according to each server's advertised LSP Full/Incremental/None document-sync contract and negotiated position encoding, and expose symbol-first semantic navigation for cross-file relationships while simple localization stays on the cheaper syntax/search path. Warm-session capacity and idle eviction must remain physically bounded without evicting leased sessions, provider identity replacement must fail closed while the old slot is in use, and failed LSP subrequests must never masquerade as valid empty semantic relationships. Automatic semantics remain explicitly disableable; providers without a hardened profile remain authorization-bound.
  priority: high
  implemented_by:
    - component:semantic-providers
    - component:semantic-registry
    - component:product-scopes
  acceptance:
    - AC-SEMANTIC-001
  constraints:
    - CONSTRAINT-EXPLICIT-PRECISION
    - CONSTRAINT-EXPLICIT-EXECUTION-TRUST
    - CONSTRAINT-SCOPED-SEMANTICS
