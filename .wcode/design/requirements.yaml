    - CONSTRAINT-INTEROPERABILITY-STANDARDS
    - CONSTRAINT-PRODUCT-SCOPE-CANONICAL
  risk:
    compatibility: critical
    reliability: critical

- schema_version: 1
  id: REQ-MCP-003
  title: Standards-based OAuth and connector interoperability
  intent: Remote MCP registration and authorization must use PKCE, protected-resource metadata, resource binding, bounded DCR metadata and safe same-origin handling. Metadata and redirects use the verified tunnel that received the request. Client registrations and bounded tokens persist without clock expiry across process restarts for the same configured Workspace-root scope, while historical resources never activate stale Hosts or widen access to another scope.
  priority: critical
  implemented_by:
    - component:oauth-interoperability
    - component:mcp-runtime
  acceptance:
    - AC-MCP-003
  constraints:
    - CONSTRAINT-INTEROPERABILITY-STANDARDS
  risk:
    security: critical
    compatibility: critical

