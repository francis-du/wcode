- schema_version: 1
  id: REQ-AUTH-001
  title: Dynamic human authorization
  intent: Destructive and externally consequential operations must require explicit human authorization when they are not part of the bounded autonomous repository lifecycle. Normal bounded read-only Git repository inspection, validated Git add/commit/branch/switch/tag/staged-restore and non-force push, plus bounded local development workflows for every indexed language — test/check/lint/build/format, workspace scripts, code generation, dependency/lockfile maintenance and repository-declared Property/Mutation/Fuzz/Runtime executors — are first-class autonomous operations under the hardened no-shell Workspace lane so verified iteration can execute without approval churn. Inline/interactive interpreter eval, response/plugin/agent injection, Git inspection modes that invoke helpers/pagers or widen into ignored/no-index/submodule content, force/delete/history rewriting, credential or remote publish actions, host-wide configuration and destructive infrastructure operations remain gated or permanently blocked. Local stdio MCP must surface genuinely consequential pending authorization through standards-based human elicitation while the model remains unable to approve itself. Modern MRTR retries bind the pending request to the exact MCP owner plus an opaque one-time challenge; legacy stdio may issue elicitation/create only when the client declared form elicitation support. Full Access may enable otherwise-authorizable runtime capabilities but never bypass protected-path, symlink/hard-link, no-shell, filesystem-root or permanent command-policy boundaries. One-shot destructive grants are consumed once and session grants never widen permanently blocked command shapes.
  priority: critical
  implemented_by:
    - component:authorization
    - component:workspace-operations
  acceptance:
    - AC-AUTH-001
  constraints:
    - CONSTRAINT-DESTRUCTIVE-AUTH
  risk:
    security: critical
    reliability: high

