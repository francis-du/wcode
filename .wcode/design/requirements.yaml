- schema_version: 1
  id: REQ-AGENT-CONTEXT-001
  title: Token-efficient edit-ready agent context
  intent: >-
    Coding agents must be able to start substantial implementation work from one bounded task-specific context pack that prioritizes relevant Design State, symbol signatures, exact edit SHA preconditions, verification references, graph evidence and quality gates while excluding unrelated traceability, ranking likely callers/callees/helpers through a compact repository map, and deferring source bodies until explicitly requested. Repository retrieval may specialize its bounded heuristic ranking for requirement-trace-to-code, code-to-test, review-comment-to-context, reproduced-failure-trace-to-code or edit-to-ripple tasks only when one intent is unambiguous; mixed signals must abstain to balanced context, expose the heuristic routing reason and never overstate precision. A reviewed file supplied as an exact anchor is already-given context: explicit review comments that ask for consistency, reuse or related behavior must continue bounded cross-file retrieval while excluding that reviewed file from additional-context ranking. Strong reproduced failure traces such as Rust error codes/panics/backtraces, assertion failures, Python tracebacks/exceptions or equivalent crash markers likewise retain exact frame/Hot Source/SHA evidence while continuing bounded cross-file root-cause retrieval and excluding already-given frame files from extra ranking; ordinary unscoped locations still defer graph expansion. Exact literal/qualified symbol targets remain stronger than recall-oriented lexical seeds, fresh semantic/deterministic/runtime relationships retain their stronger provenance, and under tight budgets explanatory routing metadata must be discarded before direct SHA targets, verification references, the strongest repo-map item or diagnostic Hot Source. Readiness must default ordinary single-target work to a minimal-patch strategy with an explicit zero-growth complexity budget for new production files, abstractions, configuration knobs and public API changes, escalating only when current-task evidence requires broader structure. Multi-step work must persist a per-Workspace revision-guarded Worklist across reconnects/model switches; Agent Context restores active unfinished work, stale concurrent updates fail closed, blocked items remain unfinished, and a new list cannot silently replace unfinished user tasks. Direct edit targets must retain file-SHA priority over unrelated alphabetical mappings; readiness graph precision must be covered by every direct target rather than upgraded by the strongest relationship of only one target, so mixed semantic/runtime/syntax evidence is reported conservatively; repeated sizing must preserve truncation state. Parallel recommendations may use discovery scopes and active Worklist lanes but must respect the runtime cap. Adaptive sizing must not treat unresolved symbol discovery as justification for a large context increase by itself: direct precision stays on the low tier and broader budgets are earned incrementally by Requirement/Design breadth, graph truncation, risks, requested scopes or query complexity. Hidden MCP telemetry must report actual model tokens against the selected budget so Observatory/TUI can expose descriptive budget utilization without adding telemetry noise to model-visible context. The final Agent Context pack must not echo the full query already present in the tool-call arguments; query text may be used internally for routing/readiness but is removed before final model-visible sizing. Model-facing tool discovery must also hide routine context-budget tuning knobs so adaptive sizing remains the default; explicit protocol callers may still supply supported budgets when they intentionally need a fixed cap. Tool routing must not require duplicate repository-context startup or repeated schema discovery.
  priority: critical
  implemented_by:
    - component:agent-context
  acceptance:
    - AC-AGENT-CONTEXT-001
  constraints:
    - CONSTRAINT-CONTEXT-BUDGET
    - CONSTRAINT-AGENT-CONTEXT-ENFORCEMENT
    - CONSTRAINT-EXPLICIT-PRECISION
  risk:
    performance: critical
    reliability: high

- schema_version: 1
  id: REQ-TUNNEL-001
  title: Public tunnel availability is provider-resilient
  intent: >-
    Remote MCP startup must not depend on one tunnel vendor. wcode keeps every instance-health-verified tunnel live and treats primary health as one hysteretic state: three consecutive failures are required before failover, two consecutive successes are required for recovery, and suspect/recovery probes accelerate without duplicating failure counters. Every standby has an independent bounded health lease; repeated probe failures quarantine it from promotion without killing the provider or immediately revoking its Host, so a transient outage can recover in place. Stable endpoint trust is a separate lifecycle from the provider child process: a stable Host may remain active after a child exit only when an instance-matched /healthz recheck proves it still reaches this runtime, is continuously monitored while reconnecting, and is revoked immediately when that proof fails; restart recovery likewise re-discovers only instance-verified stable endpoints. Asynchronous health completion is identity-bound so delayed results from recycled or demoted tunnels cannot poison replacement state. Failed providers reconnect through fast bounded deterministic backoff and circuit half-open attempts, while long cooldown applies only to persistent failure and history resets only after sustained stability. OAuth follows only instance-verified active aliases, historical resources never reactivate Hosts, and quick-tunnel hostnames remain distinguishable from stable endpoints. Zero-configuration auto mode remains limited to providers that do not require account credentials; operator-managed stable services such as named/account tunnels integrate through validated --public-url without exposing their credentials to wcode. Monitor, health and operator UI surfaces must expose bounded per-provider role/state, lease age, failure streak, death count, circuit state, retry horizon and uptime without making observability a second control-state source. Public endpoint reachability and recent MCP request activity are distinct signals: missing or stale MCP traffic may explain an idle/non-functional client path but must never by itself revoke a verified endpoint or drive failover. Shutdown cancels in-flight health work and background diagnostics never write directly to the terminal while the TUI owns it.
  priority: high
  implemented_by:
    - component:managed-tunnel
  acceptance:
    - AC-TUNNEL-001
  risk:
    reliability: critical
    compatibility: high

- schema_version: 1
  id: REQ-CLI-001
  title: Governed stable CLI lifecycle
  intent: >-
    The default CLI command catalog must stay small and model-readable. Running with no subcommand starts the runtime; setup, update, mcp-stdio, intelligence and verification are stable visible task-level commands. A visible help-all entry derives the complete CLI reference from the canonical parser, including hidden parameters, aliases, declared defaults and enum values, supports a selected command path and JSON, and exits before any workspace, resource, authorization or service initialization. agent-plugin remains a hidden advanced export control, while restart and stop are removed so process lifecycle belongs to Ctrl-C/SIGTERM for foreground runtimes and to the MCP Host for stdio. The runtime must not retain a separate control route or per-user restart/stop token file. Low-frequency resource, transport-provider and trust-boundary flags stay accepted but hidden from default help. The redundant generated help subcommand is disabled. wcode update must target the running binary's installation directory by default and reuse the verified release installer contract with official release artifacts, SHA-256 verification, a staged candidate binary, version/help smoke tests, and replacement only after those checks succeed.
  priority: high
  implemented_by:
    - component:cli-lifecycle
  acceptance:
    - AC-CLI-001
  constraints:
    - CONSTRAINT-CLI-SURFACE
    - CONSTRAINT-VERIFIED-SELF-UPDATE
  risk:
    reliability: critical
    compatibility: high

- schema_version: 1
  id: REQ-EXPERIENCE-001
  title: Verified repository experience improves future retrieval
  intent: >-
    Successful stable quick or full deterministic verification may persist bounded prompt-free per-Workspace co-change experience so later repository retrieval can recover likely edit-ripple files. Failed, unverified, incomplete, truncated or overly broad work must not teach. Historical relevance must remain explicitly heuristic and weaker than exact symbols, Design State and fresh semantic, deterministic or runtime graph evidence; missing or removed paths must never be promoted. Retrieval must resist popularity and release-sweep bias by normalizing pair affinity against per-path support, shrinking low-evidence relationships, discounting broad change sets, applying bounded recency decay with full verification stronger than quick, and keeping the final history contribution capped below direct lexical evidence. wcode must evaluate this memory without storing prompts, queries, model reasoning or chain-of-thought by replaying verified history through a global temporal A/B holdout: records from the same timestamp batch cannot teach one another, only earlier batches may predict later verified co-changes, stale paths are excluded, and the normalized candidate is compared against the prior raw-count baseline on the same cases. Engineering Observatory must expose both model identities, raw denominators, baseline values and percentage-point deltas for coverage, hit-rate, precision@K and recall@K with provider, heuristic precision and evaluation method, distinguish unavailable from cold-start, and must not collapse the result into an opaque self-score.
  priority: critical
  implemented_by:
    - component:experience-graph
    - component:agent-context
    - component:intelligence-ui
  acceptance:
    - AC-EXPERIENCE-001
  constraints:
    - CONSTRAINT-EVIDENCE-PROVENANCE
    - CONSTRAINT-CONTEXT-BUDGET
    - CONSTRAINT-EXPLICIT-PRECISION
  risk:
    reliability: critical
    performance: high
    security: high
