- schema_version: 1
  id: REQ-SEC-001
  title: Workspace root isolation
  intent: Remote models must never escape the configured workspace root through model-facing file operations.
  priority: critical
  implemented_by:
    - component:workspace-security
  acceptance:
    - AC-SEC-001
  constraints:
    - CONSTRAINT-ROOT-ISOLATION
  risk:
    security: critical
    reliability: high

- schema_version: 1
  id: REQ-SEC-002
  title: Symlink components are rejected
  intent: Workspace isolation must not be bypassed through symlink aliases.
  priority: critical
  implemented_by:
    - component:workspace-security
  acceptance:
    - AC-SEC-002
  constraints:
    - CONSTRAINT-SYMLINK-REJECTION
  risk:
    security: critical

- schema_version: 1
  id: REQ-SEC-003
  title: No shell execution
  intent: Model-facing command execution must not interpret shell syntax or invoke a shell as an execution primitive.
