- schema_version: 1
  id: REQ-SEC-001
  title: Workspace root isolation
  intent: Remote models must never escape the configured workspace root through model-facing file operations.
  priority: critical
  implemented_by:
    - component:workspace-security
  acceptance:
    - AC-SEC-001
  constraints:
    - CONSTRAINT-ROOT-ISOLATION
  risk:
    security: critical
    reliability: high

- schema_version: 1
  id: REQ-SEC-002
  title: Symlink components are rejected
  intent: Workspace isolation must not be bypassed through symlink aliases.
  priority: critical
  implemented_by:
    - component:workspace-security
  acceptance:
    - AC-SEC-002
  constraints:
    - CONSTRAINT-SYMLINK-REJECTION
  risk:
    security: critical

- schema_version: 1
  id: REQ-SEC-003
  title: No shell execution
  intent: Model-facing command execution must not interpret shell syntax or invoke a shell as an execution primitive.
  priority: critical
  implemented_by:
    - component:command-execution
  acceptance:
    - AC-SEC-003
  constraints:
    - CONSTRAINT-NO-SHELL
    - CONSTRAINT-BOUNDED-DEV-TOOLS
  risk:
    security: critical
    reliability: high

- schema_version: 1
  id: REQ-SEC-004
  title: SHA edit precondition
  intent: Existing-file edits must reject stale callers so concurrent changes cannot be silently overwritten.
  priority: critical
  implemented_by:
    - component:workspace-security
  acceptance:
    - AC-SEC-004
  constraints:
    - CONSTRAINT-SHA-PRECONDITION
  risk:
    security: high
    reliability: critical

- schema_version: 1
  id: REQ-MCP-001
  title: One MCP runtime across local and remote transports
  intent: Local stdio, preferred Streamable HTTP, and legacy SSE plus POST messages must share one JSON-RPC dispatcher, Harness, Workspace policy, OAuth and Origin boundary; SSE sessions stay bounded and unknown protocol revisions fail closed.
  priority: high
  implemented_by:
    - component:mcp-runtime
  acceptance:
    - AC-MCP-001
  constraints:
    - CONSTRAINT-MCP-COMPATIBILITY
  risk:
    compatibility: critical
    reliability: high

- schema_version: 1
  id: REQ-HARNESS-001
  title: Verification must remain bounded
  intent: Deterministic project verification must use bounded inferred checks, bounded output and controlled concurrency.
