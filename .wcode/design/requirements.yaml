  id: REQ-MCP-002
  title: Complete MCP capability surface
  intent: The shared MCP runtime must expose Tools, Prompts, Resources and durable owner-scoped Tasks, attach wcode Product Scope metadata, and keep optional media Tool Results capability-aware so binary image/audio content is emitted only when the current client request explicitly advertises support while unknown/legacy capability remains metadata-only or fails closed.
  priority: critical
  implemented_by:
    - component:mcp-runtime
    - component:mcp-capabilities
    - component:product-scopes
  acceptance:
    - AC-MCP-002
  constraints:
