schema_version: 1
id: AC-FITNESS-OBSERVATORY-001
title: Fitness scorecards preserve unknown states, bounded denominators and revision provenance
statement: >-
  The protected ProjectObservatory exposes independent benchmark and runtime Fitness views. Runtime data is the last 64 retained milestones, not all tool attempts or model task success; only exact code plus Design observations enter current tool/level groups. Missing revisions stay unbound, duplicate copies count once, conflicting copies and invalid/future observations are excluded with partial coverage, and skipped malformed journal records remain explicit. Outcome ratios count succeeded, partial, blocked and failed records; empty denominators are undefined. p50/p95 and earlier/recent-half deltas are descriptive, not readiness or statistical significance. Trend halves need at least three samples and a strictly increasing split timestamp; incomplete, cached or stale views suppress trends. A complete latest-64 sample is explicitly window_limited rather than falsely unreadable; missing selected records remain partial and cannot establish whole-population coverage.
  Explicit diagnostic and trial runs additionally export typed source-free summaries under target/engineering-fitness with raw counts, fixed budget/phase coverage, corpus/evaluator/binary fingerprints and before/after code/Design observations. Dashboard reads are shallow and bounded to 32 entries; each summary is limited to 64 KiB within the existing Workspace reader, and no report is executed. Malformed, redacted, escaping, symbolic-link, unsupported, future, duplicate or over-capacity inputs cannot imply current success. An invalid report makes selection partial rather than silently certifying an older valid report as latest. Benchmark file content changes invalidate the existing Engineering Observatory signal. Historical reports preserve identity and only claim recorded-configuration comparability, not identical hardware or compilation inputs. Source-stable observations are not verification Evidence.
  The existing EN/ZH Overview renders raw denominators, unavailable/empty/partial/stale states, separate benchmark and tool outcome tables and bounded history without a new top-level workspace or editor. Escaping applies to every identifier. Restored client caches and refresh failures cannot keep confirmed-current labels or directional trends; workspace switches and placeholders clear both surfaces. Worklist counts and green tests are never substituted for benchmark quality, and unmeasured retry, recovery, flakiness, live LSP, readiness and model patch success remain unmeasured.
