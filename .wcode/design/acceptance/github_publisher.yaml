schema_version: 1
id: AC-GITHUB-PUBLISHER-001
title: Installed publisher separates deployment observation from native publication authority
statement: >-
  The built-in github preflight command performs bounded authenticated GET-only repository inspection, preserving explicit incomplete findings for unavailable permissions, malformed or oversized responses, incomplete pagination, ambiguous rulesets and PR drift. It requires exact expected-App required checks and strict base updates; classic protection also enforces administrators, while effective rulesets require matching active identity and visible empty bypass actors. Merge queues remain explicitly unsupported by this PR-head publisher. Aggregate preflight time is bounded, pagination never follows response URLs, and response bodies or credentials are not echoed. The github publish command requires explicit full base/head SHAs, exactly one candidate, a disjoint trusted configuration root and enabled write/exec modes before credentials or network access; it never runs project verification, imports proof JSON, modifies branch rules or merges. A successful configuration check remains separate from actual Check write permission, OS isolation and native Acceptance. Publication rechecks the requested candidate and uses fresh native capture plus existing red-first/recapture/acknowledgement guards. The verify-event command takes at most one MiB of original JSON bytes from piped stdin, verifies the exact sha256 signature in constant time before parsing identity, rejects missing or duplicate routing headers in its shared library contract, and pins repository/installation/open-PR identity and supported action. Its output excludes the raw payload and keeps freshness/replay/native/human authority false. The publish-event command enforces write/exec and disjoint-root guards before input or credentials, then authenticates before reading the API credential and reuses exact-candidate preflight/native recapture; a signed stale event cannot retarget a newer candidate. The raw stdin commands do not themselves provide transport deadlines or durable replay protection. The separately defined GitHub inbox supplies bounded loopback intake, persistence and retries; the trusted deployment still supplies TLS and connection/header deadlines. Local protocol fixtures are not a real remote pilot or deployment-isolation attestation.

  The built-in watch-candidate command has the same pre-credential write/exec, exact SHA, workspace and disjoint-config guards as publish. The foreground controller performs fresh live preflight and native recapture after each completed 30-second poll delay; failures back off to 60/120/240 seconds without overlapping or catch-up bursts. It retains only a privately constructed Check identity from its red creation acknowledgement, even after an unconfirmed success update, and never accepts an imported Check ID. Subsequent rounds re-read exact Check/SHA/name/App ownership; unchanged current native facts and matching remote acknowledgement cause no writes, while changed facts reuse the existing red-first publication and recapture protocol on the same Check. Missing/revoked Policy, changed PR target/protection, failed capture or mismatched metadata cannot return cached green. Errors attempt denial only for the owned original commit and distinguish confirmed denial from unconfirmed remote state. Restored Policy alone cannot reuse old-generation native checks. Shutdown wins over starting new work, drains the active round, and attempts read-back-confirmed denial even if output or signal handling fails. No stopped-success event is emitted on unconfirmed shutdown denial. The controller neither installs itself, runs candidate tests, approves Policy, mutates branch rules, follows a new head, provisions or rotates GitHub App signing keys, edits inbox history nor provides an atomic merge lock. A trusted supervisor must enforce a single publisher per binding, handle new candidates and credential/configuration changes, and verify real deployment isolation. Local HTTP/native fixtures do not establish a remote Pilot.
  Same-root cooperative publication uses a stable private empty lock inode keyed by API origin, numeric repository ID, expected App, Check name and normalized head SHA. PR/base changes, credential rotation and local labels do not split admission. All native and lower-level create/update paths validate an opaque guard; competing watchers, one-shot publishers, trait writes and inbox work fail before remote mutation. Watchers retain admission across polling intervals and release after the shutdown denial attempt even while the controller object remains allocated. Inbox admission precedes attempt/deadline changes and stays held through final state publication; a busy candidate is skipped within the bounded authenticated due set, never completed or consumed. Existing path aliases, nonempty lock files and unsafe permissions are rejected without truncation; Unix also rechecks held and named inode identity and rejects hard links. Guards explicitly unlock on drop, never unlink, expire or take over a live lock. Separate processes, duplicated descriptors and owned subprocess termination are tested. Diagnostics do not acquire publication admission. Deployment must keep the common state root protected and stable, configure Windows ACLs independently, and coordinate distinct roots/hosts or older/external publishers; local process exit does not confirm remote rollback.
  Optional App-key credentials are governed by AC-GITHUB-CREDENTIALS-001. Repository inspection remains GET-only, but preflight explicitly reports credential_renewal_enabled and conservative remote_mutations=true in that mode because authentication can issue an installation token. Existing static-token mode remains unchanged. Neither mode gains native Acceptance authority or bypasses publication admission.
