schema_version: 1
id: AC-CONTRACT-BRIDGE-001
title: Static shared contracts select only proven generated-code consumers
statement: >-
  In a mixed repository, a local OpenAPI inputSpec/outputDir mapping selects its SDK island when the OpenAPI contract changes; a local GraphQL Code Generator schema/generates mapping selects its web island; and a Buf module plus buf.gen output selects its generated Go consumer when a .proto under the declared module changes. Shared contract paths need not belong to any Language Island. Selection provenance distinguishes direct changed-path ownership, contract_bridge evidence and each transitive manifest_dependency hop; an unresolved or truncated snapshot is explicit broad_fallback rather than guessed precision. A contract consumer may propagate onward to its manifest-declared dependents, but changing generated consumer source does not reverse-propagate to unrelated producers or sibling consumers. Remote schema URLs, workspace-escaping input paths and dynamic codegen.ts configuration create no deterministic bridge, and dynamic configuration is surfaced as an explicit not-executed diagnostic. When a proven bridge has existing local generated output, changing its upstream contract/config without changing the output surfaces an info-level generated-artifact-freshness advisory that says it is not proof of staleness; changing any file under the output suppresses the advisory, and a bridge whose output does not yet exist produces none. The advisory never raises risk or blocks verification by itself. VerificationReport retains the complete bounded impact chain while Agent Context receives a compact budget-safe summary. Engineering Observatory reuses the same reviewed changed paths to expose current verification_impact with structural provider/precision, and the protected Web Observatory renders the affected islands and reason chain without another topology implementation. Contract topology remains structural/provenance-bearing and bounded.
