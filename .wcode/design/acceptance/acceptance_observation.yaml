schema_version: 1
id: AC-ACCEPTANCE-OBSERVATION-001
title: Acceptance blockers lead to real inspection and revision-bound verification
statement: >-
  TUI and WebUI expose canonical Acceptance state, all required checks and exact Evidence without inventing readiness. TUI reads bounded SHA-bound file pages and syntax symbols; changed source, protected paths and stale workspace replies fail closed. Changed-file candidates remain distinguishable from exact Evidence links. Web verification requires authenticated operator intent, matching current snapshot and native code/Design/Git identity, execution permission and server-owned Task identity. Polling never reruns verification. Cancellation preserves original effects and results; terminal transport state is not PASS. New commits invalidate old verification even when source bytes match. Legacy or absent Git bindings remain unknown. Result delivery refreshes canonical Acceptance and a lost launch receipt never triggers an automatic duplicate run.
  Retained Jobs discovery scans at most 512 task entries, reads at most 16 MiB and returns at most 32 matching records. Partial, corrupt or unavailable history is not an empty complete process inventory. Exact observation rejects a corrupt latest snapshot instead of reusing old success. Command tails are UTF8-safe, redacted and bounded to 32 KiB per stream. Owner and raw command arguments are not metadata. Only current UI-owned working jobs can be cancelled; an input actor or origin cannot grant authority. Verification recovery filters server-owned records and only reads a selected real ID. Empty or failed discovery cannot clear an uncertain launch or repeat POST. Web workspace epochs, session ownership and bounded polling isolate stale replies. Native HTTP serializer output is consumed by the shipped frontend without deriving Acceptance from command status.
  Jobs offers status and UI/MCP-origin filters over only the returned retained records, with visible matching/retained denominators. Filtering issues no request and cannot start, rerun or cancel work. An empty filtered view is not an empty complete history or successful outcome; truncated coverage stays explicit. Filtering preserves selected task detail and existing cancellation authority. Filter preferences reset with Workspace or session ownership, and callbacks from an obsolete scope cannot change a replacement view. Native labeled selects retain keyboard focus after changing a filter; both English and Chinese labels describe task state rather than verification success.
  Retained command output supports bounded case-sensitive literal search without requests or replay. Each result keeps its stream and fragment-relative line number; matching-line counts and pagination describe only returned text. Truncated and redacted coverage remains explicit even with zero matches. Search state binds exact task, Workspace, owner and epoch; selecting another task withdraws old output before its reply arrives. Invalid or failed observations withdraw results. Same-task updates preserve query, keyboard focus and composition while obsolete controls cannot affect a replacement scope.
  Public Observatory shell and static assets retain their CSP and content types; the script response matches the compiled asset byte for byte. Reading static assets does not authorize API actions.
  All Jobs controls bind the rendered workspace/session scope; exact-task refresh and cancellation also bind the selected task ID. Obsolete callbacks cannot operate on a replacement selection, including A-to-B-to-A scope changes. Identical markup must rebind after scope replacement, not leave current controls inert. A queued poll rechecks its scope, task, observation sequence, visibility, working state and finite budget before issuing a GET. This UI binding supplements rather than replaces server cancellation authorization.
