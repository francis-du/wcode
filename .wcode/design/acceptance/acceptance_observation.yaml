schema_version: 1
id: AC-ACCEPTANCE-OBSERVATION-001
title: Acceptance blockers lead to real inspection and revision-bound verification
statement: >-
  TUI and WebUI expose canonical Acceptance state, all required checks and exact Evidence without inventing readiness. TUI reads bounded SHA-bound file pages and syntax symbols; changed source, protected paths and stale workspace replies fail closed. Changed-file candidates remain distinguishable from exact Evidence links. Web verification requires authenticated operator intent, matching current snapshot and native code/Design/Git identity, execution permission and server-owned Task identity. Polling never reruns verification. Cancellation preserves original effects and results; terminal transport state is not PASS. New commits invalidate old verification even when source bytes match. Legacy or absent Git bindings remain unknown. Result delivery refreshes canonical Acceptance and a lost launch receipt never triggers an automatic duplicate run.
  Retained Jobs discovery scans at most 512 task entries, reads at most 16 MiB and returns at most 32 matching records. Partial, corrupt or unavailable history is not an empty complete process inventory. Exact observation rejects a corrupt latest snapshot instead of reusing old success. Command tails are UTF8-safe, redacted and bounded to 32 KiB per stream. Owner and raw command arguments are not metadata. Only current UI-owned working jobs can be cancelled; an input actor or origin cannot grant authority. Verification recovery filters server-owned records and only reads a selected real ID. Empty or failed discovery cannot clear an uncertain launch or repeat POST. Web workspace epochs, session ownership and bounded polling isolate stale replies. Native HTTP serializer output is consumed by the shipped frontend without deriving Acceptance from command status.
