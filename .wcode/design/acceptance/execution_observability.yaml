  - {kind: test, path: tests/unit/ui/observatory.rs, symbol: engineering_work_queue_prioritizes_open_tasks_without_changing_authority}
  - {kind: test, path: tests/unit/ui/observatory.rs, symbol: observatory_behavior_keeps_refresh_state_and_operator_summary_truthful}
