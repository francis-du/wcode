schema_version: 1
id: AC-CAPABILITY-ROUTING-001
title: Model-visible capabilities are progressively disclosed without hiding mandatory controls
statement: >-
  Agent Context and MCP capability discovery share a deterministic baseline task manifest with a bounded core and
  grouped recommended actions. The complete tools/list catalog remains reachable for static-client compatibility while
  reporting catalog/schema bytes and core/on-demand counts; hosts that support progressive disclosure can preload only
  the core. A concentrated Jev capability-group Choice can only promote additional read/advisory tools; unsupported,
  write, command-execution and unconcentrated choices cannot gain authority. Explicit user-requested, safety,
  authorization, verification and recovery tools remain callable through the normal dispatch and authorization checks,
  including when absent from the bounded recommendation. The complete MCP tools/list stays deterministic and
  task-independent; list-changed notifications are not used as a per-task routing channel. Metadata-first hints and
  serialized catalog/schema byte comparisons do not claim actual Host lazy loading, model token savings or cache hits.
