schema_version: 1
id: AC-CREDENTIAL-TRANSPORT-001
title: Real child processes and raw text cannot inherit the newly supported credential forms
statement: Guarded environment cleanup removes keys containing CREDENTIAL or PRIVATE_KEY in addition to existing secret rules, and explicitly removes the legacy WCODE_GITHUB_APP_KEY_FILE compatibility name. Test-owned real subprocesses show WCODE_TEAM_CREDENTIAL, WCODE_TEAM_CREDENTIAL_FILE, WCODE_GITHUB_APP_PRIVATE_KEY, WCODE_GITHUB_APP_PRIVATE_KEY_FILE and the legacy App-key file variable absent for Git, Node and GitHub CLI profiles while ordinary environment survives. Process-global environment is not modified by the regression. Exact wci_ plus 64 hexadecimal characters is redacted by the shared text path with Unicode and line structure retained; shorter, invalid or embedded identifiers are not erased. The change does not claim an OS sandbox, secret zeroization or override separately authorized unrestricted command behavior.
verification:
  - {kind: test, path: tests/unit/workspace/policy_environment.rs, symbol: team_secret_environment_does_not_reach_child_processes}
  - {kind: test, path: tests/unit/workspace/credential_redaction.rs, symbol: credential_redaction_covers_ci_machine_credentials_without_erasing_identifiers}
  - {kind: check, id: rust-check}
  - {kind: check, id: rust-clippy}
