schema_version: 1
id: AC-CREDENTIAL-TRANSPORT-001
title: Real child processes and raw text cannot inherit the newly supported credential forms
statement: Guarded environment cleanup removes keys containing CREDENTIAL or PRIVATE_KEY in addition to existing secret rules, and explicitly removes the legacy WCODE_GITHUB_APP_KEY_FILE compatibility name. Test-owned real subprocesses show WCODE_TEAM_CREDENTIAL, WCODE_TEAM_CREDENTIAL_FILE, WCODE_GITHUB_APP_PRIVATE_KEY, WCODE_GITHUB_APP_PRIVATE_KEY_FILE and the legacy App-key file variable absent for Git, Node and GitHub CLI profiles while ordinary environment survives. Process-global environment is not modified by the regression. Exact wci_ plus 64 hexadecimal characters is redacted by the shared text path with Unicode and line structure retained; shorter, invalid or embedded identifiers are not erased. The change does not claim an OS sandbox, secret zeroization or override separately authorized unrestricted command behavior. Bounded fetch uses the existing fixed BatchMode SSH transport only for a validated configured remote and one explicit ref. Option-shaped remotes, missing refs, URLs, arbitrary refspecs, extra arguments and injected Git configuration are rejected. Argument hardening, the command-launch credential condition and environment cleanup share the same eligibility check, with the launch condition still requiring non-broad execution. Test-owned subprocesses retain a synthetic SSH_AUTH_SOCK only for an eligible Git operation in a credential-permitted lane; Git SSH/configuration injection variables remain removed. These regressions execute no Git, SSH or network operations and preserve existing push/LFS push behavior.
verification:
  - {kind: test, path: tests/unit/workspace/policy_remote.rs, symbol: bounded_ssh_fetch_hardening_requires_validated_remote_and_ref}
