schema_version: 1
id: AC-EXPERIENCE-001
title: Only verified bounded history can influence retrieval
statement: >-
  Successful stable deterministic verification can persist bounded prompt-free co-change experience and a weak recent selected-context → verified-change trajectory; failed or truncated work cannot teach, context trajectories require a recent successful Agent Context with path overlap, removed paths are ignored, and no prompt/query/reasoning text is stored. Historical relevance stays heuristic and weaker than exact direct targets. Retrieval normalizes pair affinity against path popularity, shrinks low-support edges, discounts broad change sets, decays stale evidence, keeps full verification stronger than quick, gives trajectory edges lower directional weight than verified co-change, and conditions those edges by retrieval intent so cross-intent reuse remains weaker than same-intent reuse. A temporal regression gate never amplifies learned history: cold-start and non-regressing models retain factor 1, at least six evaluable holdout records are required before degradation, repeated multi-metric regression against raw-count-v1 downweights learned history to 0.25, and unavailable evaluation disables the heuristic instead of guessing. Verified learning quality is evaluated by global temporal A/B replay with same-timestamp batch isolation; stale paths are excluded, verified-context-cochange-v3 is compared against raw-count-v1 on identical cases, and Engineering Observatory exposes both model identities, raw denominators, baseline values and percentage-point deltas for coverage, hit-rate, precision@K and recall@K without an opaque self-score.
