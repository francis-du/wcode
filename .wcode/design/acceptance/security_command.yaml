schema_version: 1
id: AC-SEC-003
title: Command policy blocks unbounded project execution by default
statement: >-
  The safe command lane admits only bounded shapes and blocks project code, mutation and helper-based bypasses
  without an explicit trust expansion. Command args must preserve every string including empty arguments;
  explicit invalid args, cwd or timeout values are rejected before execution or authorization instead of
  falling back to defaults. Process-capacity waits have a separate short deadline. A queue timeout must report
  that the command did not start; an admitted command receives its full requested runtime budget from spawn.
  On Windows, only existing fixed npm, pnpm and yarn verification commands may resolve an installed .cmd
  launcher from an absolute PATH directory. Native .exe installations retain precedence; .cmd selection
  preserves PATH order and excludes relative or empty entries, directories, extensionless scripts and other
  script extensions. Unknown programs, path-shaped names, extra arguments and shell syntax never enable
  this fallback. Direct commands, project verification and trusted runtime verification keep the same
  argument, working-directory, authorization, output and exit-status rules when using these launchers.
