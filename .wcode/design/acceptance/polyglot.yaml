schema_version: 1
id: AC-POLYGLOT-001
title: Mixed-language changes verify only their owning project islands
statement: >-
  A repository with root Rust plus nested Node/TypeScript, Python, Java, Swift, Dart, Elixir, OCaml, Ruby and PHP projects is represented as distinct manifest-owned structural islands discovered by a bounded single manifest scan. Each inferred check records its island, languages and cwd; nested checks run from their own roots. A change only under the web island retains workspace-global gates and web checks while excluding unrelated toolchains; simultaneous changes select each affected island in the same phased plan. Explicit Cargo path and package file/link references are structural dependency bridges that propagate verification to dependents without reversing the edge. Go, Java and Swift expose bounded quick analysis/build gates, Dart/Elixir/OCaml use exact native shapes, Ruby uses only exact Bundler RuboCop/RSpec shapes, and declared PHPStan/Psalm/PHP CS Fixer/PHPUnit gates are inferred without admitting arbitrary PHP execution. Quick verification promotes one bounded full fallback when an affected language has no quick gate, while full verification reports a fail-closed requested-level gap when only quick coverage exists. An undeclared PHP island remains a gap only when affected. Workspace-local vendor/bin PHP tools are autonomous only for approved exact shapes and are unavailable when symlinked or hard-linked. Language Quality status scopes nested providers to their owning root with unique provider IDs and explicit execution lanes, and provider execution derives a read-only child workspace without widening trust. Design-declared Rust, Python and Go Acceptance tests may add one same-island phase-one quick check only after the exact test symbol resolves in its declared file; Cargo, pytest and Go focused command shapes reject broad package patterns, path escape, dynamic selectors and extra arguments, while full verification remains unchanged. Full Project Context exposes complete island/dependency metadata while Agent Context uses a compact bounded summary. Ambiguous ownership falls back to the broader plan rather than silently skipping verification.
