schema_version: 1
id: AC-OSS-BOUNDARY-001
title: OSS builds independently and commercial composition preserves engineering truth
statement: >-
  Actual OSS Cargo metadata and all local dependency kinds have no path to commercial packages or sibling private repositories; renamed, optional, workspace-inherited, target, build and dev edges and source inclusion attempts are rejected by architecture tests. Public wcode contains no commercial source files and preserves Apache-2.0. The first physical extraction owns ExecutionGitBinding plus required-check/report facts and authority/intelligence state-root derivation in crates/core-types; Evidence no longer imports Verification for immutable binding/check ownership, Workspace safety no longer discovers authority roots through Evidence/Auth stores, verification::change keeps its established public path, and root/offline packaging consumes the same source owner without duplicating definitions. Neutral report_types/model_tools/telemetry/job-observation contracts remove Intelligence-to-Harness and core-runtime-to-UI-monitor ownership edges while TaskMonitor remains an OSS Product adapter. MCP durable TaskRecord keeps its existing persistence/wire schema and AppState remains host composition; neither is promoted into canonical verification truth. The standalone gate validates both package inventories, safely builds an aggregate commercial-free OSS workspace offline, independently creates and inspects the wcode-core-types Cargo package, and compares repacked source bytes. Team and Enterprise consume the same bounded OSS snapshot evaluator; malformed or partial state fails closed and commercial code cannot upgrade deterministic truth. This proves the current boundary and extraction sequence, not deployment isolation or a remote merge gate.
