schema_version: 1
id: AC-INTELLIGENCE-001
title: Repository intelligence resolves traceability scoped context and release readiness
statement: >-
  Requirement traceability resolves real implementation/test symbols, Product Scope filters narrow software-context source navigation, and one canonical release oracle fails closed when Design, Traceability, Product Scope or required Convention state is incomplete. Adversarial mutants must be rejected independently, repeated PASS → FAIL → PASS evolution replay must not leave sticky gate state, and long-lived Design and Traceability caches are content-revision sensitive: same-size rewrites with replayed mtime must invalidate desired-state parsing and implementation/test symbol resolution rather than preserving stale 100% coverage.
