schema_version: 1
id: AC-OBSERVABILITY-001
title: Engineering Observatory explains the project without an IDE
statement: >-
  The WebUI first exposes one continuous rounded System → Subsystem → Component → Code topology canvas derived from Design State and current implementation ownership. Subsystems expose purpose, membership, source/requirement scale, dependency direction, current changes, strong drift and evidence gaps directly in that architecture-first hierarchy; component indexes and dependency evidence remain secondary drill-down surfaces rather than card walls. Engineering Architecture contains an internal Code Graph mode—not an eighth top-level tab—that searches bounded code roots and shows callers/callees, dependency/reference paths, impact radius, test/requirement/proof context and why-related evidence while preserving provider and precision on every edge. Existing bounded activity telemetry drives a realtime Understand → Change → Prove → Learn → Observe flow, exposes descriptive Agent Context candidate→delivery, cache, saved-context and build-latency facts without treating selection ratio as a quality score, keeps cancelled callers whose started blocking workers still retain real capacity visible as active until release, and the working-tree story maps Files → Components → Requirements → Verification → confirmed Drift. The TUI automatically loads the focused project engineering model; wide terminals put Workspace Activity and a compact Engineering/connection control rail side-by-side, medium/narrow terminals omit the permanent Engineering Pulse so real task rows remain dominant, and Architecture plus Proof/Runtime stays available in a rounded Engineering Console. WebUI, TUI, Setup and OAuth share the canonical wcode Logo/homepage palette and corresponding fluid hierarchy: rounded primary workbenches, frosted/liquid-glass Web depth, small refined controls and subordinate semantic colors. Overview, Architecture/Digital Twin, Task Activity, Verification Evidence, Current Changes, Requirements and Runtime reuse one glanceable visual grammar with project pulse, semantic status beacons, metric/relationship strips, timelines and inspectors; supporting metadata is at least 12px, and stale, unknown, inconclusive, failed or unverified state is visibly distinct from current passing proof. Component/Requirement drill-down keeps responsibilities, implementation, dependencies, Desired vs Actual, Change, revision-exact Proof and Convergence explicit; verification mapping remains distinct from Executed, Passed and Fresh evidence. Resolved implementation mapping, observed dependency coverage and executed checks remain independent; unobserved does not mean unimplemented. Symbol references match qualified names before short names within the same file and never claim unrelated sibling definitions. Direct matches with multiple candidates, truncated graph/scan input or an explicitly unresolved canonical trace retain ambiguous_symbol_reference provenance. A lone component ID supported only by that uncertain source cannot confirm ownership; an explicit File reference or uniquely resolved trace may independently establish it. Resolved symbol traces bind their exact definition, explicit File references may cover the file's nodes, and resolved file traces bind only their File node. Only two unambiguously owned, distinct component endpoints with syntax, semantic, deterministic or runtime precision enter actual dependency pairs; syntax stays syntax and the existing strong-precision blocking threshold is unchanged. Declared, heuristic or mixed precision, ambiguous owners and one-sided ownership remain candidates rather than actual/aligned/blocking facts. Edges with neither endpoint owned are outside this Design-attributed candidate set. Candidates preserve the original edge rather than expanding owner combinations. Each confirmed pair retains at most 8 raw evidence records with evidence_total and evidence_truncated; ProjectArchitectureView retains at most 128 dependency_candidates with dependency_candidates_total and dependency_candidates_truncated. Evidence preserves from/to node IDs, paths and symbols, relation kind, provider, precision, revision, ownership state and at most 16 owners per endpoint with raw owner totals. Owner sources distinguish symbol_reference, ambiguous_symbol_reference, file_reference, trace_symbol and trace_file. Source inspectors expose this provenance and uncertainty, and historical snapshots missing these fields remain readable without fabricated evidence or a claim of complete observation. Missing bounded-syntax relationships remain advisory and runtime activity remains the single control-state source. A shared attention projection keeps independent evidence-policy failures and disagreement visible, never promotes ModelReview to deterministic precision, preserves current revision and partial coverage, ranks risk and structural violations, and uses newest-first current verification history. Native TUI tabs expose Summary, Attention, Tasks and Providers with keyboard selection and scrolling. Web attention and the observation strip lead to existing drilldowns; source tree and largest-file controls read bounded 240-line SHA-bound pages with clipped focus, explicit total ranges and stale-source rejection.
  Requirement implementation and acceptance-test references, component targets and observed changed paths open the existing guarded source inspector. Resolved file/symbol mappings can supply exact observed paths even outside the separately bounded file tree; check IDs and unresolved/unobserved guesses cannot. Extensionless filesystem references retain their exact file identity. Source controls bind rendered selection, Workspace, owner, epoch and code/Design revision; detached controls and late graph/source responses cannot publish into a replacement context. Reading a mapped test neither executes it nor creates evidence.
