schema_version: 1
id: AC-GIT-PROVIDER-ENROLLMENT-001
title: GitHub publisher enrollment is explicit credential-free and fail-closed
statement: Project setup accepts GitHub publisher enrollment only when owner/repository, numeric repository ID and App ID are supplied together; the Check name has a bounded nonblank default. Dry-run reports the planned manifest without writing. Enrollment preflight rejects invalid requested identities, malformed existing manifests and existing identity conflicts before any Host configuration or Design bootstrap write. An existing enrollment parent must pass Workspace path guards even if the manifest is absent; symlinked or non-directory parents fail closed. Valid project setup retains its normal Host and Design behavior and additionally creates the credential-free .wcode/github-publisher.yaml manifest. Repeated identical enrollment is idempotent, conflicting identity is never overwritten, read-only setup cannot write enrollment, and unknown secret fields or symlinked files fail closed. The final enrollment write rechecks current state and remains create-only; this is not a claim of an atomic multi-file setup transaction. The manifest validates through the same GitHubConfig contract used by publication. examples/git_publisher.rs reads the validated Workspace enrollment and obtains its publisher credential separately; enrollment performs no remote GitHub operation and grants no Acceptance or Policy authority.
