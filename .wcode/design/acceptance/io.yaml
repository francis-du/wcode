schema_version: 1
id: AC-CODE-IO-001
title: Batched search and edit acceleration does not sacrifice recall or safety
statement: >-
  Interior-line regex anchors, duplicate queries, rare patterns after common matches, exact-over-fallback priority, Unicode/CRLF/EOF, deterministic pagination, merged context, files-only output, failed reads, oversized files and protected paths have deterministic regressions. Model-facing root list_files uses the same ignore-aware repository walker as source discovery, so gitignored/generated directories such as target, IDE state and log noise cannot flood listings; an explicitly addressed ignored/generated directory remains browsable so deliberate inspection is not lost. Auto search reports one traversal and reads every scanned file once. An MCP search result can directly supply the SHA to a precise edit, while an old SHA is rejected after mutation. Multi-edit assembly preserves original line anchors across generated Unicode/CRLF cases and rejects overlap, missing anchors and excessive output growth. AST result limits and failures explicitly prevent complete-coverage claims. Invalid optional search argument types fail instead of silently changing the request. An explicitly invoked release-profile benchmark compares batched and repeated searches and edit assembly on the same fixtures; its ripgrep comparison asserts path-and-line result equality, not model coding superiority. The benchmark remains separate from required deterministic checks and is not mislabeled as fuzz or mutation evidence.
