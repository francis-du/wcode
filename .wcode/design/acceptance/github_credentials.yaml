schema_version: 1
id: AC-GITHUB-CREDENTIALS-001
title: Scoped renewal preserves safety guards, concurrency bounds and truthful failure
statement: >-
  Static-token constructors retain opaque bounded sensitive authorization headers and do not silently enable renewal. Explicit App mode requires a positive trusted installation identity and exactly one signing-key source. Unix file mode requires a private publisher-owned RSA PEM file and parent outside candidate/inbox paths; relative, aliased, hard-linked, nonprivate, missing, oversized and invalid files fail before network use. Cross-platform in-memory mode accepts only bounded valid RSA PEM bytes supplied by the trusted launcher and never persists them. Non-Unix file mode fails closed rather than pretending to validate ACLs, while in-memory App renewal and external static tokens remain available. CLI publication safety and event authentication precede App-key access. Ambiguous simultaneous sources, invalid IDs or disagreement with trusted event/inbox routing are rejected without choosing another identity or token. Canonical PRIVATE_KEY environment names and the legacy WCODE_GITHUB_APP_KEY_FILE name are stripped from guarded child processes. No secret value, key contents or credential response is included in diagnostics.

  A fresh RS256 JWT uses bounded claims and the expected App ID. Before exchange, live repository installation/App identity and explicit unsuspended state must match. Token requests name exactly the enrolled numeric repository and Checks write plus Pull requests, Contents, Administration and Metadata read; the response must contain that single exact repository, the exact requested permissions and a canonical bounded future UTC expiry. Malformed, oversized, redirected, suspended, foreign, incomplete and overbroad responses cannot reach repository requests. New opaque token formats are not rejected for failing a fixed-length assumption. No App, permission, key file or service is created by the renewal operation.

  Concurrent calls on one provider share one bounded exchange. Both monotonic and wall-clock guards enforce the 120-second renewal margin and reject backward-clock cache reuse. Refresh including waiting is limited to 35 seconds and failures back off from five to at most 300 seconds without an expired-token fallback. Cancellation releases the single-flight mutex while preserving the preinstalled backoff; signing and file reads run outside the async executor. A separate one-slot guard travels with the actual blocking signer, so detached work retains its capacity until it really ends and cancelled waiting callers cannot spawn extra jobs. Operator replacement of the private PEM is read on renewal; removing it does not retroactively revoke an already-issued cached token. A 401 invalidates only its matching token, not a newer replacement, and no request is automatically replayed. Check mutation retains its existing exact-candidate native proof and publication guard; token renewal cannot turn an unavailable capture into Ready or prove remote revocation.

  Repository preflight remains GET-only but App-mode authentication may mint a credential. Its additional fields distinguish credential_renewal_enabled and repository_mutations, with conservative remote_mutations=true in App mode instead of claiming fully read-only remote activity. Local tests use offline-only RSA material, real loopback HTTP and installed CLI processes; they do not attest a live GitHub installation, Windows private-file ACLs, cross-host issuer coordination, remote Pilot or deployed tenant isolation.
