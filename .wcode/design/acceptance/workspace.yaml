schema_version: 1
id: AC-WORKSPACE-001
title: Workspace coding primitives remain transactional and guarded
statement: >-
  Workspace primitives remain transactional; a selected parent can authorize canonical non-symlink child subspaces
  idempotently without relaxing manual overlap rules. Exact executable and repository-operation grants remain
  workspace-bound, argument-bound, and deny-safe by default. An explicit current-runtime Workspace all-command grant
  switches direct run_command execution to an unrestricted lane: executable allowlists, command-shape/argument
  filtering, Git command hardening, command environment scrubbing, read-only command-write classification and startup
  no-exec are bypassed until revoked, while process/resource bounds and guarded file-tool/delete semantics remain
  independent. Cargo commands that would otherwise wait on Cargo registry or Workspace artifact locks enter a bounded
  pre-spawn contention gate before scarce child-process admission. Registry commands serialize globally. In one
  Workspace, build/check/clippy/bench/doc/fix/run/rustc/rustdoc take an exclusive writer permit, while cargo test and
  cargo nextest run take a shared reader permit plus a resource-derived test slot; independent tests may overlap up to
  that slot bound, an exclusive writer cannot start until existing test readers finish, and new readers cannot bypass
  a queued writer. Different Workspaces remain independent. Heavy command admission then acquires a per-Workspace
  child-process quota before the host-wide physical child-process queue; a busy subspace cannot consume another
  subspace's local permits, while aggregate process count remains bounded by the host cap and local waiters cannot
  bypass resource-pressure admission. Git-worktree writer ownership remains a separate mutation-domain constraint.
  Cargo and process-capacity queue waits do not consume the subsequent command execution timeout.
  Direct commands, workspace verification executables and trusted runtime executors start that timeout only at spawn.
  Queue waits remain separately bounded; cancellation while queued launches nothing and releases its reservations. Tool arguments must be objects and an explicitly supplied Workspace must be a non-empty string;
  malformed routing never silently selects the default Workspace. Runtime timeout controls remain visible in the model
  schemas for run_command, command_task and verify_project; search budgets remain adaptive and hidden.
  Sync and task commands default to 600 seconds,
  accept explicit integer timeouts from 1 through 1800, and have no separate sync 60-second ceiling. Ordinary commands
  remain synchronous unless task_mode=true. Modern task-capable clients receive standard Task handles; legacy or
  non-Task clients receive ordinary durable command receipts. command_task create/status/result/cancel uses the same
  TaskRuntime and TaskStore, never a second registry. Start still passes through writer, executable/argv/no-shell,
  command authorization, sandbox, cwd, timeout and resource guards. Status/result/cancel require the transport-derived
  owner and exact selected Workspace, task ID and run_command identity; caller-supplied owner/actor fields are rejected.
  verify_project action=start returns an ordinary durable verification receipt on both modern and legacy transports,
  without requiring the Tasks extension. Omitted action or run preserves existing sync/native-Tasks behavior.
  Status/result/cancel require the exact transport owner, selected Workspace and verify_project task identity,
  reject command-task IDs and stay observable under execution saturation. They reuse the same native verifier,
  TaskRuntime and TaskStore. Invalid/mixed/nested lifecycle arguments are rejected before any sibling mutation.
  Polling retains the native report and cannot rerun checks or mint Evidence; completed results explicitly declare
  current_acceptance=false and recorded_execution_only scope, including after drift or runtime replacement.
  Queued cancellation launches no checks; runtime replacement fails interrupted work rather than replaying it.
  Polling never reruns the command. Terminal/completed is delivery state, not success; the inner isError, command
  success, exit code, error and truncation remain visible and never mint Verification Evidence. A stdio restart changes
  owner, so old-owner tasks cannot be recovered by the new process. A runtime replacement marks an observed working task
  failed instead of replaying it; creation-response loss has no exactly-once guarantee. Optional launch environment
  overrides are limited to five typed non-secret keys, require numeric loopback/unprivileged-port and bounded mode/log
  values, clear inherited values for those managed keys before applying explicit overrides, and keep common runtime/loader
  execution-injection environment variables scrubbed. Cancellation aborts the owned worker and requests supervised
  process-tree termination; cancellation and final persistence serialize so late completion cannot overwrite a saved
  cancellation. This does not roll back prior effects. Both task wire forms expose the same redacted 32 KiB-per-stream
  tail of a separate bounded progress stream, with a 64 KiB pending-line limit and 32-chunk channel. The 8 KiB read
  buffer is only a chunk size. Final results retain a 256 KiB-per-stream prefix capture; capture-truncation and
  dropped-prefix provenance remain distinct, and pipe readers keep draining after final capture saturates. workspace_info may surface bounded read-only launch hints from recognized manifests, but discovery never
  executes them, never exposes package/Python/task-runner script bodies as command arguments, never infers network trust,
  rejects oversized/symlink manifests, and fails closed on ambiguous native entrypoints or competing task-runner manifests.
  Common Just/Make/Task launch names and a unique Dart bin entry may be surfaced only from bounded declarations. A Docker
  Compose launch hint is exposed only for one bounded manifest with no host interpolation, custom top-level project name, build/host-mount/privilege/API-socket/lifecycle-hook/external-resource surface, loopback-only published ports, and an attached `up --no-build --pull never` command requiring exact RiskyExecution authorization. The Compose profile includes a non-automatic bounded status probe that returns only service/state/reported-health/exit-code fields; generic `compose ps` rendering remains blocked so container command text cannot leak through inspection. Reported Health may be empty and must then remain unknown rather than being promoted to healthy. Every discovered profile also reports a bounded bare-program PATH presence preflight without executing it; `false` is a stop rather than permission to guess/substitute a runner, while `true` does not claim plugin/subcommand readiness. Exact launch-only Agent Context requests may route directly to workspace_info then run_command without source indexing; any chosen launch still goes through the existing command policy and supervised task-mode boundary.
