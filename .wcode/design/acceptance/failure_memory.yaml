schema_version: 1
id: AC-FAILURE-MEMORY-001
title: Failure memory survives model changes without becoming authority
statement: Native failures retain only bounded known categories and safe relative paths in the existing 512-record project journal. Legacy events without categories do not infer causes. Canonical payload identities and event deduplication prevent copied observations from inflating recurrence. Agent Context recalls at most two relevant fixed rules, one under a 1000-token budget, while preserving current source SHA. New Harness and Workspace instances recover the same project observations; another project does not, including roots with identical lossy text. UTF8 state remains compatible and non-UTF8 state never imports an ambiguous legacy store. In-process concurrent appends preserve the bound and recurring anchors; bounded old overflow is recovered before append, excessive scans fail closed, and excessive future timestamps remain partial historical data. Removed paths and irrelevant failures are not promoted. Corrupt or truncated history is explicit, advice is not Evidence or approval, and no historical failure or success changes current verification truth. A real native MCP callback matches a configured literal against at most 4096 UTF8 bytes of payload.error, ignoring arguments and output. Error bytes are never persisted, and replayed event IDs are deduplicated. Generic queries in a new Harness recall no-path failures through currently discovered native check IDs; different projects remain isolated and matching IDs alone never establish recovery, proof or approval.
