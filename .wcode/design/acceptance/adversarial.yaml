schema_version: 1
id: AC-ADVERSARIAL-QA-001
title: Adversarial QA challenges change claims without becoming evidence
statement: >-
  The review_changes adversarial mode reuses the same deterministic current change review and generates at most twelve unique falsification questions without a second Git scan. It challenges acceptance, hidden impact, current-revision evidence freshness and negative paths by default; test-overfit, source-without-test, security, dependency/build metadata, deleted tests, generated-output freshness, large changes, untracked files and truncated review signals add targeted questions when present. Every question names the claim being challenged, the counterexample to seek, the current deterministic signal, the evidence needed to close it and suggested wcode tools. Each question also carries a bounded counterexample experiment with an experiment kind, relevant changed targets, a falsifiable hypothesis, the concrete failure condition, execution tools/stages and the evidence class that can close the question. Experiment suggestions are plans only: they never imply a stage executed or an Evidence result exists. A clean tree produces no questions. The packet is labeled challenge-packet-not-evidence, cannot raise semantic precision or clear a deterministic failure, and may only point higher-risk work into the existing Verification Mesh where an independently claimed adversarial reviewer remains a separate Evidence producer.
  Experiment targets are finding-attributed where available, deduplicated and stable under input permutation; target counts describe observed input and truncation propagates. Saturating review counters never panic. Optional AST candidate search inspects at most six distinct changed source files with a 256 KiB admission limit and 32 matching nodes per file, returning at most three security-first deterministic proposals. Real boolean and simple comparison nodes yield source-SHA-bound original/replacement bytes and optional checked integer boundary bindings, never fabricated parameter types, outputs or defect probabilities. Missing, protected, symlink, oversized, unsupported, malformed, redacted and truncated inputs cannot become complete source evidence. Empty AST results retain file-level parse checks. Candidate extraction neither edits source nor executes experiments nor writes Evidence; it keeps executed=false, oracle_required=true and proposed-not-typechecked. Normal review does not scan candidates, malformed opt-in flags fail before review, and opt-in AST work stays inside real tool accounting on blocking workers. An isolated frozen Rust fixture demonstrates a nonempty passing baseline and a killed off-by-one mutant without mutating its source Workspace; this is not a production Mutation stage receipt.
