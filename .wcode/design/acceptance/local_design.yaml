schema_version: 1
id: AC-LOCAL-DESIGN-001
title: Read-only integration facade retains canonical loader restrictions
statement: load_local_design returns the canonical project metadata or explicit invalid-input diagnostics with no project writes. Symlinked inputs are not read through and their targets cannot leak into output. The public facade does not export the private Workspace implementation or any command, write or native approval capability.
verification:
