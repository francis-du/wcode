schema_version: 1
id: AC-GITHUB-INBOX-001
title: Durable intake and retry preserve native authority and remain diagnosable
statement: >-
  inbox-init creates only a new private absolute directory pinned to its root and repository/App/installation/Check binding. Missing, corrupt, foreign or partial state never silently reinitializes. enqueue-event authenticates raw bytes before persistence, retains at most 128 signed deliveries within an 8 MiB snapshot, and acknowledges an unchanged duplicate only after confirming persistence without incrementing generation. A new delivery of the identical raw body, authenticated with the current key, may refresh obsolete saved signature headers only for queued/retry records; it advances generation and explicitly reports reauthenticated=true without changing original bytes, identity, receive time, attempts or shortening backoff. Completed, exhausted and in-flight records cannot be resurrected or modified by this path. Signed-body digests, not unsigned delivery IDs, deduplicate through reopen and completed tombstones are never evicted for capacity. Separate nonblocking process locks serialize brief snapshot mutations and one whole publication attempt; enqueue and lock-free status remain usable while a worker publishes. An RAII guard explicitly unlocks at the end of the operation, including unwinding or cancellation, so a duplicated file descriptor cannot prolong a completed critical section. Five attempts with bounded exponential backoff, retry/exhausted state and interrupted publishing recovery replace expiring-lease takeover. Saved bodies are authenticated again with the current key before every attempt and only fresh preflight/native publication can return a receipt. The bounded scan skips, but never deletes or completes, due entries that cannot authenticate with that key so later valid deliveries cannot be starved by an old-key head. If all due entries fail authentication, processing reports an explicit unavailable error without advancing their attempts or pretending the inbox is idle. Invalid-length worker keys are rejected before recovery writes or locks. Concurrent arrivals survive completion writes. Queue status excludes payloads, signatures, keys and cached green receipts and explicitly has no current Acceptance authority. The installed foreground serve-inbox binds only an explicitly selected loopback socket and exposes only POST /github/webhook. Intake preserves duplicate headers, bounds body size and read/response time, rejects excess concurrent requests, and keeps blocking storage permits until real work ends even after an unconfirmed response timeout. The opt-in foreground work-inbox process automatically polls one due event at a time, waits one second after successful/idle polls and five seconds after unavailable polls without overriding persisted event backoff, never performs interval catch-up or replays completed receipts, and emits sanitized bounded JSON Lines instead of idle log floods. Read-only, no-exec, overlapping candidate/config/inbox roots and an invalid webhook key prevent startup before publication. Ready shutdown wins over new work; SIGINT/SIGTERM handlers are registered before startup on Unix and let the current attempt finish before stopping. Output or signal failures are not reported as successful shutdown. TLS, connection/header limits, service installation/supervision, key rollover, trusted archival/anti-rollback checkpoints, deployment isolation and real remote GitHub Pilot remain separate deployment responsibilities; Windows ACL isolation is not established by Unix permission tests.
  Inbox publication also acquires shared native-state-root admission after delivery authentication but before incrementing its attempts or entering publishing. Local contention leaves that entry's attempts, state and backoff untouched, skips to another authenticated due candidate within the bounded snapshot, and reports explicit unavailability when no due candidate can be admitted. The opaque guard is retained through remote publication and final snapshot acknowledgement, not just passed transiently to the HTTP layer. Read-only status and intake remain independent; interrupted-attempt recovery retains its separate existing rules.
