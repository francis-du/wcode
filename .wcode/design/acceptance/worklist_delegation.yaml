schema_version: 1
id: AC-WORKLIST-DELEGATION-001
title: Scoped child work retains dependency, ownership, revision and proof boundaries
statement: >-
  Claims use Worklist CAS and current repository revision, exclude active duplicate and
  overlapping scopes, reject root/traversal/protected/symlink paths and keep dependency
  ordering. Public status and context contain actor, expiry and reported results but no
  possession token. A failed context handoff neither publishes a claim nor holds the global
  update lock. Concurrent claims yield one owner; expired ownership is reclaimable and old
  tokens fail. Legitimate edits may change the claim base revision, but submit must bind a
  fresh current revision and reject fabricated evidence. Reports never mint Evidence or proof
  readiness. The parallel runnable projection is a pairwise non-overlapping subset. Multi-agent
  intent makes claim/submit discoverable while ordinary identifier names retain normal routing.
  Claim, renewal and submit acknowledgements omit unrelated item history with an explicit
  items_included=false marker, retain the current item or result, revision, counts and runnable
  lanes, and leave the complete retained list available through worklist_status. Handoff
  filtering recomputes serialized bytes and the byte/4 token estimate for the exact delivered
  context; these measurements are not provider billing or verification authority.
