schema_version: 1
id: AC-FITNESS-001
title: Fitness measurements cannot promote missing or stale evidence into success
statement: >-
  A frozen 60-case development corpus covers four language variants, exact/single-target/natural-language retrieval, caller and call-chain context, path and impact queries, path disambiguation, four direct targets, Unicode/CRLF, missing anchors, read-only state, ten distinct removed/changed ownership-guard evidence cases and 640 distractors. Delivery identities are deduplicated by path and qualified symbol. Required source is credited only when original bytes, line ranges, current SHA and redaction status match the authored Gold fragment. Required identities are mandatory task evidence; useful identities are independently authored adjacent evidence such as a direct caller/callee counterpart or behavior-specific regression test. Unrelated module/re-export filler remains Non-Gold, and regression tests must prevent useful annotation from absorbing true noise. Empty precision-like denominators are undefined, not perfect. Scorer controls reject wrong paths, stale or missing SHAs, redaction, invented source and incomplete delivery. Real controls exercise four syntax call graphs plus stale edits, cache invalidation, read-only access, same-SHA concurrent writes, workspace boundaries and explicit graph truncation. The 1000/2000/4000-budget cold/warm matrix records every attempt including rejected requests; successful outputs must stay within the independently requested experiment budget and report that exact limit. Contract v3 includes failed answerable queries in NDCG denominators and renders undefined percentages as N/A. Separate counterexamples preserve nine real callers, reject disconnected high-degree filler, retain unanchored exploration, test graph membership under reordered inputs, and check per-Gold cold/warm body preservation without changing the frozen corpus. Opt-in trials retain seven samples per cell, separately record warmups, and create versioned JSON/Markdown reports. Failures reduce recall instead of disappearing from denominators. Timing is descriptive and cannot block CI; model success, live LSP, network latency and unobserved resource costs remain unmeasured.
  Additive delivery diagnostics distinguish final missing identities, absent complete bodies, current SHA and write conditions without claiming internal retrieval failure. Language/category/target-count partitions reuse failure-inclusive aggregation. Full verified Gold bytes use per-file interval unions, original UTF-8 and current SHA; duplicate/nested spans cannot inflate density. Source-only byte lower bounds can prove overflow but never prove feasibility. Independent 1K counterexamples preserve short multi-file bodies and SHA, explicit modules, source/test name distinctions and escaped-query caps while marking long source truncated.
  Delivery v2 partitions required identities into complete, absent, verified partial-original and unusable body states; failed queries remain separately unobserved. Partial source requires current SHA, original bytes, correct bounds, overlap and explicit non-redaction, and cannot earn complete-body credit. Independent module-name collisions and four-language three-stage chains test multi-target delivery outside the frozen corpus. Matrix, noise and decision-calibration unit assertions reuse one process-local collect(1) Report snapshot instead of rerunning the identical full corpus; this reuse must preserve every assertion and report fingerprint/cold-warm semantic, while the seven-sample report-emitting Fitness trial remains ignored unless explicitly requested.
