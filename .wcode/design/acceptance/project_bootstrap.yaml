schema_version: 1
id: AC-PROJECT-BOOTSTRAP-001
title: Project setup initializes only missing neutral Design State
statement: Project setup needs no explicit Workspace argument when run in the repository. Missing Design State gets a bounded directory-derived project name, empty description, no Acceptance Policy and an empty Design directory; no Product vision, Component, Requirement, verification receipt or approval is fabricated. Dry-run performs no writes. Existing valid, partial and invalid Design inputs remain byte-identical. Read-only and path alias denials fail closed through existing Workspace operations. Plain read-only discovery and global host setup do not initialize projects. Subsequent mappings remain distinct from executed and passing current-revision Evidence.
verification:
