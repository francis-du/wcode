  - {kind: test, path: tests/unit/app/setup_design.rs, symbol: setup_design_preview_and_existing_state_are_non_destructive}
  - {kind: test, path: tests/unit/app/setup_design.rs, symbol: setup_design_rejects_readonly_and_aliases}
  - {kind: test, path: tests/cli.rs, symbol: setup_project_bootstraps_design_without_workspace_argument}
  - {kind: test, path: tests/cli.rs, symbol: setup_project_readonly_does_not_bootstrap_design}
