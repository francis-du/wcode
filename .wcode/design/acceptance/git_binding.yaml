schema_version: 1
id: AC-EXECUTION-GIT-001
title: Native verification observes execution Git identity
statement: Native Git probes retain exact full HEAD/tree/root/index/dirty facts or fail closed. Real commit changes with identical tracked bytes must not reuse the old execution receipt; observed HEAD/index drift during a real check must reject publication. Legacy receipts remain readable with unknown Git identity and cannot be promoted to commit acceptance. This contract does not claim OS snapshots, authenticated remote approvals or an installed merge gate.
