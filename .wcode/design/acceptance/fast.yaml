schema_version: 1
id: AC-FAST-CONTEXT-001
title: Direct edit context is complete when it fits and remains source-faithful
statement: >-
  A bounded fast context path prioritizes up to four explicitly named direct symbols ahead of recall-only seeds and related bodies. Four short direct bodies and their matching file SHA preconditions fit the tested adaptive and fixed budgets without follow-up body reads. A requested caller/callee expansion cannot replace another explicit target or an already selected ranked body. At the minimum 1000-token budget, bounded preparation may include two ranked bodies and one unseen related body; the final serialized cap decides delivery rather than a preparation threshold. Relationship expansion skips already delivered bodies before choosing an unseen candidate. Under budget pressure, redundant signature and call-summary metadata across all bodies yields before source or file SHA preconditions; identity, source bytes, provenance and redaction remain intact. Hot Source shares the normal symbol freshness and Workspace checks but does not construct related bodies or rebuild an evicted AST that its consumer would discard. Any abbreviated code is an original UTF-8 prefix, with the actual returned line range and sticky truncation metadata instead of invented ellipses. Graph symbol budgets reserve explicit targets across all files before their callers and unrelated fillers; a large early file or many earlier callers cannot starve a later exact definition while budget is available. Bulk graph construction retains final validation, and supplemental merging deduplicates full-provenance edges without repeated full-list scans or mixing conflicting source revisions. Tiny budgets remain hard caps and preserve path, symbol identity, source precision, SHA, line bounds and redaction state. Diagnostic anchors recognize explicit CJK punctuation boundaries without granting path authority; their snippets obey the same original-prefix contract. Structured diagnostics resolve Python File/line, compiler path(line,column), and on-line markers on the same physical line. Quoted paths preserve spaces and Unicode without decoding URLs or shell syntax; duplicate frames are removed before the four-location cap. Recognized invalid coordinates remain invalid rather than silently reading line one. Quoted traversal, external absolute paths and symlinks retain the existing Workspace checks. Unredacted file reads preserve interior LF/CRLF/mixed separators and the existing omitted-final-terminator convention. A diagnostic snippet can directly drive a guarded edit, while reusing its old SHA after mutation is rejected. Unrelated, stale, empty or redacted source cannot alone mark a direct target edit-ready; incomplete target coverage remains advisory rather than a claim of full delivery. Benchmarks report local Harness invocations, body coverage, response bytes and observed latency separately; they are not model-accuracy rankings or fuzz/mutation evidence.
  Compaction preserves file SHA and readonly entries for retained bodies. Duplicate signatures may yield only to same-ID, same-file-revision complete source. Reconstructible lane targets and fallback explanations yield before evidence; query echoes removed from output are excluded with a downward-rounded allowance while preserving the original delivered byte cap.
  Bounded candidate slots reserve one definition per explicit literal before duplicate name matches. Implementation requests prefer definitions over same-named module wrappers; explicit module requests preserve the module. Source-backed target summaries may inherit matching provenance defaults and omit redundant ranges only when a complete same-ID/current-SHA body retains them. If that body is removed or shortened, original coordinates are restored for follow-up reads; stale/redacted/partial evidence cannot justify compaction.
