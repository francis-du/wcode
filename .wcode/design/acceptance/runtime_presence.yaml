schema_version: 1
id: AC-RUNTIME-PRESENCE-001
title: Menu bar status shares native runtime truth without becoming authority
statement: >-
  The local HTTP/MCP runtime and MCP stdio publish bounded heartbeat records under the protected WCode authority state root. Records are identity-bound regular files, reject symlink/hard-link aliases, accept only loopback root URLs, retain bounded Workspace IDs and status counters, and contain no UI/OAuth token, owner, command arguments, source path or raw diagnostic. Observation scans are bounded; stale, excessive, malformed or corrupt records never count as active and make coverage partial or unknown when appropriate. wcode menu-bar --json exposes the same portable read-only projection. On macOS, wcode menu-bar runs as an accessory process, creates its TrayIcon only after the main-thread event loop is active, and displays HTTP/stdio runtime counts, version, Workspace IDs, recent MCP activity, active/queued tasks, current verify_project activity, and durable run_command job activity from that projection. New sub-activity counters are optional in the schema so a legacy runtime is shown as unknown rather than as zero; partial observation likewise suppresses those counters. Verification activity is execution state only and never means PASS. The menu bar does not execute arbitrary commands, cancel jobs, approve authorization, claim verification PASS or establish Acceptance. Runtime publisher failure does not replace or weaken the existing MCP/TUI authority path.
