schema_version: 1
id: AC-MULTI-AGENT-001
title: Parallel agents never race writes in one Workspace
statement: >-
  Independent read-only investigation and Review claims may run concurrently. At most one Design/Implementation
  writer task may be claimed in one Reconciliation execution, and runtime ownership is bound automatically to the
  authenticated MCP owner; no lease token is exposed to or supplied by the model. A different MCP owner is rejected
  while the writer is active. Workspace subspaces inside the same Git worktree resolve to the same mutation domain;
  distinct registered linked-worktree roots resolve to distinct domains and keep independent Execution,
  Reconciliation and Evidence state. Writer submit/failure releases runtime ownership, and process restart never
  treats a durable claimed writer with a missing runtime lease as permission to write. Convergence still requires
  normal review, Reconciliation and Verification.
verification:
  - {kind: test, path: tests/unit/reconciliation/mod.rs, symbol: execution_allows_parallel_reviews_but_only_one_writer_claim}
  - {kind: test, path: tests/unit/integrations/mcp/writer.rs, symbol: writer_runtime_binds_ownership_to_mcp_owner_without_model_token}
  - {kind: test, path: tests/unit/integrations/mcp/writer.rs, symbol: writer_restart_with_durable_claim_fails_closed_without_runtime_lease}
  - {kind: test, path: tests/unit/integrations/mcp/writer.rs, symbol: mutation_domain_groups_subspaces_and_separates_linked_worktrees}
  - {kind: test, path: tests/unit/integrations/mcp/writer.rs, symbol: active_writer_lease_gates_file_and_mutating_command_tools}
