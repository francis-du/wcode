schema_version: 1
id: AC-CHANGE-INSPECTION-001
title: Read-only change drilldown preserves scope, snapshot identity and unknown states
statement: >-
  change_view accepts one bounded explicit Workspace path and only working, staged or unstaged comparison layers. Existing protected-path, symlink, root identity, no-exec and hardened no-helper Git execution controls remain in force. Literal pathspecs prevent glob expansion; no shell, textconv, external diff helper or resource mutation is added. Reads require an existing Git HEAD and accessible parent directory; unavailable, unmerged and unsupported entries are not fabricated as source. HEAD, selected index/status and file SHA are observed before and after the patch read; different observations or an expected snapshot mismatch reject with no patch. This observation is not an atomic repository transaction, historical source store or verification Evidence. Unified patches are limited to 64 KiB; untracked previews additionally retain the existing 1000-line source window. The server derives bounded typed before/after changed-line ranges from only the returned patch lines, excludes context rows, merges adjacent changed lines, and marks range coverage partial whenever patch/range truncation occurs; untracked source maps only its visible returned lines. The browser keeps these coordinates typed across change ranges, mapped symbol start/end lines and impact relation line/character fields: valid coordinates must be JSON integers, and numeric strings or other coercible values invalidate the payload instead of being converted into source navigation. Redaction and truncation remain explicit; empty output applies only to the selected comparison layer. Rename detection is disabled so this first slice shows path-local add/delete rather than claiming semantic rename correspondence.
  The change-detail HTTP endpoint resolves and authorizes the workspace before inspecting data, uses a bounded deadline and no-store, and returns sanitized errors without source on failure. For a non-redacted after-state, returned after-line ranges may be mapped only against a byte-identity-bound Tree-sitter snapshot. Working/unstaged mapping requires the current worktree and a syntax outline SHA equal to the captured worktree SHA. Staged mapping resolves the validated captured stage-0 regular-file object ID and parses that exact index blob through bounded helper-free Git inspection without exposing its source bytes; redacted, truncated, lossy/non-text or unavailable blob output yields an explicit unavailable state and never falls back to newer worktree definitions. `after_source_matches_worktree=false` remains visible identity metadata rather than permission to misattribute staged lines. Mapping is capped at 128 symbols; outline/change truncation, parse failure, deleted source and unavailable syntax remain explicit partial/unavailable states. If the outline symbol list is missing, or a declared definition cannot provide a valid positive range or Tree-sitter syntax identity, the unusable row is omitted but the mapping must stay `partial=true` so the surviving definitions are never presented as complete coverage. Redacted changes expose no symbol metadata. When the selected layer has a baseline at the same path, the server also reads the exact captured baseline source (HEAD for working/staged, index for unstaged), parses it as a separate bounded Tree-sitter snapshot and maps only returned before-line ranges to before-state definitions. Before and after mappings keep independent source identities; an absent baseline stays explicit and no rename correspondence is inferred. If a pure addition or deletion inside a surviving definition leaves only one side with changed-line overlap, the exact opposite snapshot may supply a counterpart only when Tree-sitter finds exactly one definition with the same non-empty qualified name and kind; that counterpart is marked `counterpart_only` and carries no changed ranges. Ambiguous or missing matches stay absent. Every mapped symbol must carry `counterpart_only` as a boolean; the browser rejects missing or malformed values, and a `true` row is visibly labeled as a paired counterpart with no changed-line overlap rather than rendered as an ordinary directly overlapped definition. Browser validation independently recomputes each symbol's exact intersections against the captured changed-line ranges for that same before/after side: a direct symbol must carry the same non-empty intersection ranges, while a counterpart-only symbol must have no intersection and no changed ranges. Missing, extra, out-of-symbol, reordered, or contradictory ranges invalidate the payload instead of promoting file-level change into function-level change. Counterpart-only after rows remain display-only: they expose neither changed-symbol Code Graph navigation nor impact requests, and those APIs fail closed if called with such a node. The impact handler rechecks the remapped after-symbol itself and requires `counterpart_only=false` before semantic navigation; node-id equality alone is not changed-symbol membership. The mapped definitions also carry the Tree-sitter signature plus its redaction flag; only a unique same-qualified-name + kind before/after pair with both signatures non-redacted may be labeled signature changed/unchanged. When both exact outlines are complete, each overlapped definition is additionally classified by that same syntax identity: exactly one opposite-side definition means modified, zero means path-local added or removed, and ambiguous/incomplete identity stays unknown. Signature comparison and definition classification are syntax-only—not semantic signature, API compatibility, impact or rename proof. Symbols parsed from an exact staged/index snapshot whose bytes differ from the current worktree remain display-only and are not linked into the current-worktree Code Graph. The existing EN/ZH change table opens a readonly inspector with before/after line gutters, explicit comparison-layer labels, captured identity, syntax-overlap links where snapshot identity permits navigation, and manual reload. All text and identifiers are escaped. Close, project refresh/failure, cache restore and workspace-generation changes clear or invalidate source; late A-to-B-to-A and older requests cannot restore it. Browser preview rows are bounded and scrolling is keyboard accessible. Directly overlapped before/after symbol rows with returned changed ranges may reveal the first visible line from their own range in the currently rendered captured diff; before scrolling/focusing, the browser revalidates the same path/snapshot, requested side, node membership and line containment. Counterpart-only rows carry no changed range and expose no reveal action. This is local navigation within the captured patch, not historical-source retrieval, graph authority or semantic proof. No edit, approval, semantic precision, global clean-state or current validation claim is derived from viewing a patch.
  Raw semantic-navigation provenance is accepted only with the runtime route `cross_file_semantic`, which the impact boundary canonicalizes to public/browser `routing=lsp`; a raw `lsp` route is not accepted as runtime semantic provenance. Before publishing any relation, server normalization requires the raw semantic-navigation path to be present and exactly equal the selected changed path, then requires the selector revision to match the captured worktree source SHA, the selector start line to equal the selected changed-symbol line, and the selector name to exactly match the selected changed-symbol selector. Live semantic output must additionally carry the provider query line and character, both exactly matching the returned selector position; a provider response from another path, queried or resolved at another position, resolved to another name, or with incomplete query/selector identity is unavailable rather than being rebound to the requested symbol. For a changed after-state definition whose exact bytes are the current worktree, the UI may request on-demand impact for that changed Tree-sitter node and the same captured change snapshot only. Before issuing that request, the browser requires the mapping path and snapshot id to match the rendered change-detail view, the mapping source SHA to equal the captured worktree SHA, and the node to remain a directly overlapped after symbol. The changed-symbol Code Graph, impact-request and degraded syntax-caller action boundaries rerun the full symbol-mapping validator, including exact changed-range intersections, immediately before navigation/request; later-mutated, stale, cross-file or mismatched-source mappings fail closed without a network request or graph navigation. After an impact request returns, the browser reruns those direct-symbol mapping checks against the still-current change-detail path, snapshot and worktree bytes before accepting relation data; if the mapping changed while the request was in flight, the response is rejected and cannot repopulate relation state. The server revalidates the snapshot, worktree SHA and changed-symbol membership before routing to semantic navigation. It also requires the exact repository code + Design revision captured with change-detail, rejects a different starting revision, and rechecks that whole-repository revision after cross-file semantic/search work before returning any relations. A live language server may return semantic incoming calls, references and implementations; when it is unavailable, fallback is explicitly `precision=syntax`, `provider=tree-sitter+search`, keeps bounded Tree-sitter incoming-call candidates separate from bounded exact text matches, and never fabricates references or implementations. Exact text matches carry the scanned source SHA and excerpt, remain display-only text mentions, and are never labeled as callers, references, semantic proof or Verification Evidence. A degraded Tree-sitter caller may retain its concrete syntax graph node id; only a node still present in the accepted syntax incoming-call payload for the same selected symbol, snapshot and source revision becomes clickable and reuses the captured code + Design revision to continue into the revision-bound Code Graph and protected source preview. The browser validates caller navigation against that relation payload rather than requiring the caller node to be a member of the changed file's own after-symbol mapping. Clickable syntax callers are explicitly labeled `Open in Code Graph · syntax node`; semantic-only relation rows remain display-only and cannot acquire that syntax navigation affordance. That node id is navigation provenance, not additional semantic authority. Live semantic incoming/reference/implementation rows must not carry Tree-sitter graph node ids: server normalization rejects such contradictory semantic-navigation output before publishing impact, and the browser independently rejects any semantic payload that still contains it. Each relation/search class is capped at 24 results; dropped malformed relation/search rows or a reached relation cap force `partial=true`. A present incoming-call, reference, implementation or exact-search collection with a non-array shape is malformed and also forces `partial=true` instead of being accepted as an empty complete class. Semantic impact also stays `partial=true` if any required semantic relation collection is absent, if the raw `queried` coverage does not contain exactly the Impact query classes `references`, `implementations` and `calls`, or if the live provider omits or malforms the required `unsupported`/`failures` outcome arrays or reports any unsupported or failed Impact subquery; an empty semantic relation array is complete only when its query is explicitly covered and both outcome arrays are present and confirm that it did not fail or declare unsupported. If a provider advertises call-hierarchy support, `prepareCallHierarchy` must yield exactly one structurally valid item before runtime can claim queryable `calls` coverage. Zero items or multiple prepared candidates record failed/ambiguous `calls` coverage rather than arbitrarily selecting the first target. The unique queryable item must carry the required name, kind, URI, range and selectionRange shape; both ranges must contain ordered integer start/end line and character coordinates with start less than or equal to end, and selectionRange must be fully contained by range. Before either incoming/outgoing call request is issued, that item must also use the exact requested document URI, its selectionRange must contain the original query position under LSP half-open range semantics (`start <= position < end`), so a query exactly at the exclusive end is outside the symbol, and both range endpoints must decode exactly within that source under the negotiated LSP position encoding. A structurally valid item for another document/symbol, or one whose coordinates do not map to the requested source, records failed `calls` coverage. Absent, empty-range, reversed-range, disjoint/out-of-range selectionRange or otherwise malformed prepared items therefore keep an empty incoming-call result partial instead of being presented as complete no-callers. Provider relation locations must also carry valid ordered range structure for the target source: every present `selectionRange`, `range`, `targetSelectionRange` or `targetRange` must have integer start/end coordinates with start less than or equal to end, and both endpoints must resolve exactly in the declared LSP position encoding. Location and LocationLink identity must be unambiguous: exactly one of `uri` or `targetUri` is accepted; target-link results require both `targetRange` and `targetSelectionRange` with the selection fully contained by the target range, while direct locations cannot also carry target-range fields. Mixed or contradictory identity is dropped and keeps coverage incomplete. Returned call-hierarchy relations additionally require each `from`/`to` item to satisfy the complete CallHierarchyItem shape (name, kind, URI, range and selectionRange), with selectionRange fully contained by range; malformed items are dropped and force incomplete coverage. Every relation must also contain a non-empty `fromRanges` array; each call-site range must be ordered, stay inside the actual caller symbol range (the returned `from` item for incoming calls, the prepared source item for outgoing calls), and decode exactly in that caller source under the negotiated position encoding. Missing, malformed, out-of-caller or out-of-source call-site ranges drop the relation and keep coverage incomplete. Out-of-line UTF-8/UTF-16/UTF-32 positions and offsets that split a UTF-8 or UTF-16 code point are invalid, are not clamped to a nearby byte column, and force incomplete coverage when discarded. CRLF source is decoded against the logical line without its trailing carriage return, so the `\r` terminator cannot be targeted as an LSP character in any negotiated encoding. On the degraded route, absent/null/malformed `syntax_calls.incoming_calls` or absent/non-array `keyword_matches` likewise force `partial=true`; loss of a fallback relation class is not equivalent to a complete empty result. Present non-boolean `truncated`, `syntax_calls.truncated`, `syntax_calls.graph_truncated`, `syntax_calls.scan_truncated` or exact-search `text_truncated` metadata also conservatively forces partial coverage; malformed exact-search `redacted` metadata drops that row and forces partial rather than treating an unknown redaction state as visible source. Degraded exact-search rows with an empty path, non-positive line or invalid scanned-source SHA are malformed and therefore make coverage partial rather than disappearing silently. A degraded syntax caller that supplies a non-null `node_id` which is not a valid Tree-sitter syntax-node identity loses that unusable navigation identity and likewise forces `partial=true`. Valid impact line/character coordinates are 1-based integers, and partial/truncated coverage stays explicit, staged/index symbols whose bytes differ from the worktree cannot request this impact view, and neither semantic nor syntax relations are verification Evidence or correctness proof. The impact panel names the selected changed symbol and keeps incoming callers, references, implementations and degraded exact text matches as distinct classes instead of merging their meanings. Server normalization requires any present `degraded` field to be boolean, and accepts the runtime's raw degraded route `degraded_syntax_and_keyword_search` only with matching syntax provenance and canonically exposes it as public `routing=syntax-degraded`; degraded payloads that carry semantic references or implementations fail closed rather than being silently discarded. Browser validation rejects contradictory precision metadata: syntax results must be the explicit `provider=tree-sitter+search`, `routing=syntax-degraded`, `degraded_from=lsp` fallback without semantic references/implementations, while semantic results must use `routing=lsp` plus the runtime LSP provider identity `provider=lsp:<provider-id>`; arbitrary non-LSP provider names and the reserved syntax fallback provider `tree-sitter+search` are rejected, and semantic results cannot also claim degradation, carry degraded search matches, or inject Tree-sitter node ids; live semantic output is labeled as relations rather than Verification Evidence.
  Change-detail captures the authoritative whole-repository code + Design revision around the file/symbol inspection. If that revision changes before the response is completed, the endpoint fails closed instead of pairing a file snapshot with proof from different repository bytes. The browser records this captured repository revision and renders project-level Verification Evidence only when the loaded proof has the exact same code and Design revision. Mismatched, missing or malformed proof stays explicitly unavailable; historical passes and mapped tests are never promoted to current proof. Even at the matching repository revision, the browser validates proof self-consistency before rendering it: effective pass/fail/inconclusive/disagree counts must sum to the declared total, the bounded effective item count and truncation flag must agree with the 24-item server contract, current evidence result counts must sum to current evidence, ready plus blocked verification plans must equal the current plan total, acceptance total/mapped/executed/passed/fresh must be non-negative integers with mapped and executed no greater than total and passed/fresh no greater than executed, and each effective item must use a known result state; the panel exposes those acceptance coverage counts while treating freshness as exact-revision currency rather than a passing verdict; contradictions fail closed and also withhold matched project risk. Project Observatory and RiskStatus each carry the repository code + Design revision used to compute them. Observatory capture performs a final repository revision check before cache/publication, and standalone risk assessment also rechecks after computation; drift fails closed rather than publishing mixed-version context. The inspector renders bounded project risk only when captured change revision, Project Observatory revision, proof revision and RiskStatus revision all match exactly. Stale/mismatched project, proof or risk revisions withhold that risk; heuristic bug-pattern matches remain labeled heuristic, and partial/truncated risk remains explicit. Evidence counts, plan readiness and risk context remain clearly project-level and do not prove that an individual changed symbol is correct or incorrect.
  Collection-valued semantic-navigation responses remain protocol-shaped: references accept only an array or null; definition and implementation may additionally normalize one singleton direct Location, but an ordinary direct Location must be exactly the `uri` + `range` wire shape and cannot also carry `selectionRange`; CallHierarchyItem `selectionRange` remains separately validated. Shape violations force incomplete coverage instead of publishing a fabricated relation.
  Code Graph source drilldown resolves path and line range from the selected stored graph node, never from a client-supplied filesystem path. A worktree changed-symbol drilldown first requires the requested Tree-sitter node to remain a member of the current change-detail symbol mapping for the same snapshot/worktree SHA with `source_state=worktree`; staged, stale or non-mapped nodes fail closed before navigation. It additionally carries the exact code + Design repository revision captured by change-detail. The focus endpoint checks that revision before graph construction, rebuilds the current Software Graph rather than silently reusing an older stored graph, and rechecks the revision after graph construction; mismatch or concurrent drift returns conflict without a navigable graph. It requires the graph snapshot id and a source SHA carried by that node (source_sha256, file sha256, or syntax-node sha256 provenance), then reads through the protected Workspace reader. A current SHA mismatch returns conflict without source. The preview is read-only, redacted, no-store and bounded to 240 lines with explicit focus range/truncation; rendered line gutters never extend beyond the server-returned start/end range, including files ending with a newline. Browser validation rejects source payloads whose declared line interval, focus range or content row count disagree instead of silently showing partial code. Graph relationship provider/precision remain visible and are not promoted into semantic proof. Workspace changes abort in-flight source reads and late responses must not restore prior source.
  Explicit source editing uses the selected graph snapshot and resolved path with the original file SHA and exact bounded old-text window. POST updates only up to 240 original lines and 128 KiB of replacement text through the existing guarded MCP writer and reconciliation policy; clients cannot supply paths. Read-only, redacted and mixed-newline windows fail closed. Original CRLF/LF and unchanged terminal newlines are preserved, including empty-file identity. Stale source or old-window mismatch rejects without replay. Browser drafts are memory-bounded and workspace/range-owned, escaped, retained on conflict or unconfirmed save, and never automatically retried. Late A-to-B-to-A saves cannot reload a newer view. A successful save reloads current source and change observation without claiming verification Evidence.
