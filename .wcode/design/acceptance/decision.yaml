  - {kind: test, path: tests/unit/intelligence/decision.rs, symbol: risk_can_only_raise_or_preserve_verification_work}
  - {kind: test, path: tests/unit/intelligence/decision.rs, symbol: brier_metric_is_bounded_and_rewards_calibrated_outcomes}
  - {kind: test, path: tests/unit/runtime/harness/fast_context.rs, symbol: fast_context_exposes_advisory_decision_plane_when_budget_allows}
