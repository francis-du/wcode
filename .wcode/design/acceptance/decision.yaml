schema_version: 1
id: AC-DECISION-001
title: Agent Context exposes bounded advisory decisions without weakening safety
statement: >-
  agent_context emits a bounded deterministic decision_plane whose provider-neutral signals include probability, choice and score primitives, explicit confidence and evidence codes, and a policy declaring advisory-only authority. Missing context can recommend more retrieval, semantic navigation is recommended only when relationship evidence is necessary before a safe edit, unknown action states abstain to other_review instead of claiming edit readiness, ready context can recommend editing, and risk can recommend escalation; no decision may reduce deterministic verification floors or safety gates. The model-free Engineering Fitness evaluator scores context_sufficient against independently authored Gold edit readiness, persists calibration coverage and mean Brier, and distinguishes dangerous false stops from wasteful false continues without treating evaluator completion as perfect quality. Provider comparison evaluates baseline and candidate batches on the same request and detects numeric/choice/shape/safety disagreement. When Jev is dynamically available, Agent Context may expose only increase-only guidance derived from its typed signals: extra retrieval, semantic navigation or verification are allowed, low-concentration choices become abstain-and-collect-evidence guidance, while edit_then_verify or any other more permissive edit action is suppressed unless the deterministic baseline already selected it. Missing or failing Jev falls back to the deterministic plane.
