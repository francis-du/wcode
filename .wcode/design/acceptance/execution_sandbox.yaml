schema_version: 1
id: AC-EXECUTION-SANDBOX-001
title: The OS sandbox is opt-in per call and falls back to direct execution
statement: >-
  Command execution is direct by default for every command shape, under both ordinary permissive execution and
  explicit Workspace all-command / Full Access overrides. The OS sandbox is selected only when the caller asks for
  it on that call (the MCP run_command `sandbox` argument or the run_command_sandboxed embedder API). When selected,
  the sandbox keeps the selected Workspace read-only when writes are disabled
  and no all-command override exists; ordinary writes or an explicit override enable Workspace writes only within
  that sandbox boundary. It keeps the host filesystem read-only outside sandbox scratch/Workspace, masks or denies
  protected credential/repository-control paths at any depth within the selected Workspace and actual configured
  authority-state roots, denies external network access, preserves cwd/process/resource limits, and applies
  sensitive/injection-capable environment scrubbing with explicit provider credential allowances.
  Repository-control metadata such as .git/.hg/.svn is inaccessible to sandboxed shell/policy-bypass commands; bounded
  policy-approved Git operations retain the hardened direct lane and intentional repository-control access.
  Commands valid under bounded profiles, including supported syntax-only shell checks, stay direct unless the caller
  opts in. macOS selects Seatbelt; Linux selects bubblewrap when available. When no backend exists, or sandbox
  preparation fails, the requested sandboxed command runs directly instead of being refused. Ordinary enabled
  commands need no second command approval, and explicit revocation is recorded without blocking the permissive
  default. A session override is informational under the permissive default; no command grant
  disables the sandbox or authorizes a separate HumanApproval decision. Command lifecycle tests run in fresh child processes with private authority and
  intelligence roots initialized before launch; no test depends on parallel store creation or modifies the
  parent environment. Backend presence is not a waiver for missing protected roots, whose negative tests
  retain fail-closed behavior. Exact child-test execution and successful completion must be observed.
