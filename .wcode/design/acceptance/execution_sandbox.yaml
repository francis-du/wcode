schema_version: 1
id: AC-EXECUTION-SANDBOX-001
title: Future broad shell execution keeps sandbox and approval independent
statement: >-
  A command admitted only because Workspace all-command / Full Access bypasses the bounded command profile is marked
  broad and must receive a platform sandbox launch plan before process spawn. The sandbox exposes the selected
  Workspace read/write, keeps the host filesystem read-only outside sandbox scratch/Workspace, masks or denies
  protected credential/repository-control paths at any depth within the selected Workspace, denies external network
  access, preserves cwd and process resource limits, and never receives unsanitized credential environment variables.
  Repository-control metadata such as .git/.hg/.svn is inaccessible to broad shell/policy-bypass commands; bounded
  policy-approved Git operations remain on the existing direct execution lane and therefore keep their intentional
  repository-control access. Commands already valid under the bounded command profile do not pay this sandbox cost. macOS selects Seatbelt; Linux selects bubblewrap
  when available; unsupported or unavailable providers reject broad execution with sandbox_unavailable and never
  fall back to a raw child process. Human command authorization remains a separate prerequisite and cannot disable
  the sandbox.
