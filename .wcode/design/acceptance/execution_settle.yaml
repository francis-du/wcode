schema_version: 1
id: AC-EXECUTION-SETTLEMENT-001
title: Terminal Execution state is proof-settled
statement: >-
  A model completion or blocker claim is stored as a proposal at most. Completed becomes durable only when
  authoritative Worklist and any Execution-bound Reconciliation state are terminal/converged and all required
  current-revision deterministic, reviewer, stage and HumanApproval gates are satisfied; stale, failed, missing or
  inconclusive proof remains visible as blockers. Once an Execution binds a Reconciliation Plan, expected code
  revision changes produced by that approved plan must not silently drop the binding; the same plan remains part of
  completion settlement until it converges or requires replanning. Verification recovery must not depend on a
  truncated recent-history window or interpret random plan IDs as creation time. New plans persist creation order;
  a unique matching legacy plan may be recovered, but ambiguous legacy same-revision plans cannot supply authority.
  Missing plans may trigger exact-revision lookup; foreign-workspace plans and other status errors must fail closed.
  Completion projections retain an explicit allowed flag, unfinished count and required action through budget
  compaction and scoped handoff. A passing phase with unfinished work cannot permit an overall completion claim.
  Completed Execution remains visible in context instead of being filtered out as absent. A damaged or unreadable latest snapshot must not resurrect an older completion; bounded snapshot discovery fails closed. Context and handoff retain allowed=false with unknown unfinished count and an explicit restore_execution_state action, without leaking damaged state bytes.
  This exposes authoritative runtime state; arbitrary MCP Hosts still own their model-turn lifecycle.
