schema_version: 1
id: product:wcode
name: wcode Engineering Control Plane
vision: Coding agents operate through an observable engineering control plane where software continuously converges toward intended design with verifiable evidence.
principles:
  - Design State is the desired software state.
  - Models are replaceable executors, not the source of truth.
  - Deterministic evidence outranks model consensus.
  - Software graph precision and provenance must remain explicit.
  - wcode dogfoods its own engineering control plane and repository-intelligence substrate.
  - Maintained documentation has one canonical WIKI and one hosted HTML surface.
