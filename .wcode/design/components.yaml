      path: src/semantics/provider/mod.rs
      symbol: status
    - kind: symbol
      path: src/semantics/provider/mod.rs
      symbol: refresh
    - kind: symbol
      path: src/semantics/provider/auto.rs
      symbol: state
    - kind: symbol
      path: src/runtime/semantic.rs
      symbol: spawn
    - kind: symbol
      path: src/semantics/provider/session.rs
      symbol: SemanticSessionPool
    - kind: symbol
