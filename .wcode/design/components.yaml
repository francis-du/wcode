- schema_version: 1
  id: component:semantic-providers
  name: Semantic Provider Runtime
  responsibilities:
    - maintain exactly one tested canonical LSP launch profile for every indexed language, with only real bounded alternates and provider-specific executable aliases/arguments
    - automatically maintain bounded semantic state for explicitly hardened providers on the most specific project Workspaces while avoiding duplicate parent/subspace indexing
    - reuse bounded Workspace/provider language-server sessions, synchronize source revisions according to server-advertised Full/Incremental/None textDocumentSync and negotiated position encoding, periodically prune idle unleased sessions, refuse capacity eviction of leased slots, and delay provider-identity replacement until the active slot is released
    - ingest real Document Symbol Call Hierarchy and Implementation facts through the global concurrency boundary
    - discover provider binaries from trusted PATH plus bounded language-native install locations where defined, and expose discovery source, actionable authorization/install/init state, launch readiness, live session validation and runnable semantic precision as distinct provider states so executable presence cannot masquerade as an initialized LSP or a raw OS error
    - expose symbol-first semantic navigation for definition, hover, references, incoming/outgoing calls and implementations while keeping simple localization on Tree-sitter/search, trying an installed alternate when the canonical provider fails initialization, falling back honestly when no trusted provider exists, and reporting unsupported capabilities separately from failed LSP subrequests
    - reject Workspace-local provider executables, scrub execution-injection environment state, and retain explicit trust for providers without an automatic safety profile
    - reject stale semantic revisions from composite graph use
  constraints:
    - CONSTRAINT-EXPLICIT-PRECISION
    - CONSTRAINT-EVIDENCE-PROVENANCE
    - CONSTRAINT-EXPLICIT-EXECUTION-TRUST
  implementation:
