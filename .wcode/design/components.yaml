- schema_version: 1
  id: component:verification-harness
  name: Verification Harness
  responsibilities:
    - infer bounded verification checks
    - run deterministic verification through the approved command lane
    - persist versioned deterministic check timing facts, normalize exact-command history to the latest observation per revision so retries cannot inflate sample confidence, and select a bounded fail-fast frontier of at most two sentinels without removing any required checks
    - admit a second cost sentinel only from shared revision evidence where the first sentinel did not fail but the second did, with sufficient marginal samples, marginal failures and positive incremental time savings after charging its own runtime; correlated failures remain in the parallel remainder
    - temporally replay the learned cost frontier against the canonical phased baseline and fail back to the static plan after four evaluable holdout revisions unless net time savings are positive with zero outcome mismatches; cold-start exploration remains explicit
    - prioritize at most one direct Design-owned and syntax-resolved Rust, Python or Go Acceptance test during quick verification through an exact same-island runner shape, after static checks and without removing or narrowing the full verification plan
    - reuse only short-lived allowlisted static verification passes when code revision, Design revision, exact check shape, execution policy, environment and executable identity all match; behavioral tests, failures, stale/partial revisions and changed inputs always execute again, reuse stays explicit in reports, and reused checks never mint duplicate Evidence
  constraints:
    - CONSTRAINT-BOUNDED-VERIFICATION
  implementation:
    - kind: symbol
      path: src/runtime/harness/quality/verification_run.rs
      symbol: ToolHarness::verify_project
    - kind: symbol
      path: src/runtime/harness/cost.rs
      symbol: apply_historical_cost_model
    - kind: symbol
      path: src/runtime/harness/test_focus.rs
      symbol: focused_quick_test
    - kind: symbol
      path: src/runtime/harness/verification_cache.rs
      symbol: ToolHarness::cached_verification_check

