- schema_version: 1
  id: component:agent-context
  name: Agent Context Compiler
  responsibilities:
    - compile one task-specific edit-ready context pack instead of requiring a broad startup sequence
    - prioritize relevant Design State, symbol signatures, exact file SHA preconditions, verification references, graph evidence, risks and quality gates
    - rank a compact repository map from task relevance plus dependency centrality so direct matches include likely callers, callees and canonical helpers, with explicit caller/callee/dependency reasons and provider precision
    - include a bounded hot-source body for the strongest direct match when the pack budget permits, while deferring additional source bodies to progressive disclosure
    - enforce a serialized token budget across structure and hot source
    - expose explicit edit, verification, graph-precision and truncation readiness signals plus deterministic next tool actions instead of hiding context quality behind a score
    - enrich only direct edit targets with fail-soft working-tree state from a parallel bounded Git status probe, warn on existing staged/unstaged/untracked changes and block direct-edit guidance for unmerged targets
    - expose pack build timing alongside serialized token and context-savings telemetry so retrieval speed, context cost and task quality can be evaluated separately
    - aggregate Agent Context calls, average model-visible tokens, context bytes avoided and repo-map cache hits in the existing operator Monitor instead of creating a parallel metrics subsystem
    - batch multiple symbol query terms into one source-root traversal and one per-file indexing pass instead of repeating repository discovery for each query token
    - reuse the already loaded Design State for traceability calculation inside one software_context request instead of reparsing the same design documents
    - keep traceability and provider precision relevant to the requested behavior rather than truncating unrelated project state
  constraints:
    - CONSTRAINT-CONTEXT-BUDGET
    - CONSTRAINT-AGENT-CONTEXT-ENFORCEMENT
    - CONSTRAINT-EXPLICIT-PRECISION
  depends_on:
    - component:traceability-drift
    - component:software-graph
    - component:workspace-operations
    - component:verification-harness
  implementation:
    - kind: symbol
      path: src/runtime/harness/agent_context.rs
      symbol: ToolHarness::agent_context
    - kind: symbol
      path: src/runtime/harness/repo_map.rs
      symbol: ToolHarness::ranked_repo_map
    - kind: symbol
      path: src/intelligence/runtime/reconcile.rs
      symbol: SoftwareIntelligenceRuntime::software_context

