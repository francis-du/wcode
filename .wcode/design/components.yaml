- schema_version: 1
  id: component:managed-tunnel
  name: Managed Public Tunnel Runtime
  responsibilities:
    - run every instance-verified provider as a concurrent active MCP endpoint with independent health and recovery, without primary or standby promotion
    - use compact instance-matched health probes with a 15-second request budget, a three-second healthy interval, a one-second recovery interval and independent single-flight workers
    - preserve live processes and URLs through a bounded recovery window, restore health after two successes, and bind completions and trust withdrawal to endpoint ownership epochs
    - keep stable aliases on their existing bounded lease after process exit, supervise retained URLs independently and never restore trust from historical OAuth resources
    - own subprocess groups from spawn through cancellation and shutdown; respect provider startup deadlines and a five-minute cooldown for explicit Cloudflare provisioning limits
    - expose all active URLs and individual health, retry and circuit state in TaskMonitor, health, Setup and Observatory; keep a convenience copy URL without assigning exclusive routing
    - preserve OAuth, Origin, Workspace and instance-health authorization boundaries across every provider
  depends_on:
