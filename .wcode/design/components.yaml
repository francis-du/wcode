- schema_version: 1
  id: component:intelligence-ui
  name: Engineering Observatory
  responsibilities:
    - expose live design traceability risk evidence graph and reconciliation state in the TUI
    - provide a bilingual progressive Setup Hub with local and remote paths, safe copy controls, command-only preset previews, compact connection polling and no operator credentials
    - expose a protected Engineering Observatory whose default System → Subsystem → Component → Code blueprint explains architecture, purpose, ownership, dependency direction, current changes and Design-vs-Actual drift before the raw dependency graph
    - serve bounded per-Workspace cached project snapshots immediately on first paint or Workspace switch, then revalidate revision and Git-heavy project state asynchronously without blanking an available view
    - project existing bounded task activity into a realtime Understand → Change → Prove → Learn → Observe engineering flow and explain each Vibe Coding change through Files → Components → Requirements → Verification → confirmed Drift without creating a second mutable control-state source
    - use revision-exact Evidence for current Proof and expose explicit stable/changing/needs_convergence/incomplete requirement states with blockers
    - compare the complete declared component architecture with code-derived dependency edges, distinguish strong observed drift from evidence gaps, and retain code statistics, mapped Git changes and structural revision history without reverting to an undifferentiated node-ball graph
    - keep English as the default UI language and expose explicit manual English / Simplified Chinese switching in both TUI and WebUI without locale auto-detection
    - keep Observatory, Setup Hub, OAuth and TUI on the canonical Logo/homepage brand palette; use rounded frosted/liquid-glass primary workbenches, 20–28px outer curvature, softer nested radii, compact controls, touch-safe narrow layouts and progressive disclosure, while keeping the architecture canvas continuous and preventing square card/panel stacks from becoming the primary visual structure
    - keep the TUI visually compact, automatically load the focused Workspace engineering model, show an Engineering Pulse on roomy terminals without displacing real task rows on constrained terminals, expose a grouped Engineering Console for Architecture and Proof/Runtime drill-down, retain the pairing code after connection, expose the complete supported-command catalog, distinguish LSP available / launch-ready / live-validated state alongside real warm semantic-session/document/start/query telemetry, and centrally claim terminal output while ratatui owns the alternate screen so background runtime diagnostics cannot punch through the dashboard
    - expose W as the discoverable TUI shortcut for the protected Engineering Observatory and provide TUI/WebUI controls for selectable pending authorization requests plus protected WebUI project and command-access management while keeping executable access distinct from exact repository-operation approval
    - derive a bounded project file tree and largest-file list from the same Software Graph snapshot, expose the 1000-line repository limit, and report truncation instead of starting an unbounded WebUI filesystem scan
    - expose prompt-free Verified Experience evaluation with explicit temporal-holdout method, heuristic precision, raw denominators, cold-start/unavailable distinction and independent coverage, hit-rate, precision@K and recall@K metrics rather than an opaque self-score
  constraints:
    - CONSTRAINT-BRAND-PALETTE
    - CONSTRAINT-ARCHITECTURE-FIRST-OBSERVABILITY
    - CONSTRAINT-EXPLICIT-PRECISION
