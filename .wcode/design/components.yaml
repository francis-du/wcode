- schema_version: 1
  id: component:experience-graph
  name: Verified Experience Graph
  responsibilities:
    - persist bounded prompt-free per-Workspace co-change facts only after successful stable deterministic verification
    - turn verified historical co-change into an explicit heuristic retrieval signal without outranking exact, Design, semantic, deterministic or runtime evidence
    - normalize co-change affinity against per-path popularity, shrink low-support relationships, discount broad change sets, decay stale evidence with a bounded half-life, and keep full verification stronger than quick while capping the final repository-map boost below direct lexical evidence
    - ignore failed or unverified work, incomplete revisions, truncated snapshots, missing paths and overly broad change sets so experience cannot silently become a new source of truth
    - never persist user prompts, model reasoning or chain-of-thought as repository experience
    - evaluate verified co-change memory with global temporal A/B holdout so equal-timestamp records cannot leak into one another, stale paths are ignored, the normalized candidate is compared against raw-count-v1 on identical cases, and coverage/hit-rate/precision@K/recall@K retain raw denominators plus percentage-point deltas
