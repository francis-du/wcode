    - apply the same Workspace, OAuth, Origin, client-owner and human-authorization boundaries to every transport
    - bridge pending authorization through modern input_required MRTR or capability-negotiated legacy stdio elicitation without exposing a model-callable approval tool
    - bound and clean up legacy SSE sessions while rejecting unknown protocol revisions
  constraints:
