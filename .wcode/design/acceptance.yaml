- schema_version: 1
  id: AC-TUNNEL-001
  title: Managed tunnel selection supports free provider fallback
  statement: Every candidate tunnel is instance-health-verified, provider parsing rejects control hosts, OAuth metadata plus existing sessions follow only verified aliases owned by the running wcode process, an unhealthy last tunnel cannot produce an empty-set index panic, all-down state resets public health to pending/local recovery, verified reconnect clears provider death history, and managed tunnel/provider dependency paths never write directly to stdout/stderr or inherit child terminal output; diagnostics flow through TaskMonitor so an active alternate-screen TUI cannot be corrupted.
