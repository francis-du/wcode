  title: Operator surfaces remain usable across terminal layouts
  statement: >-
    The TUI, protected Engineering Observatory, public Setup Hub and OAuth pages share the canonical wcode Logo/homepage palette: dark foundations #0b0812/#120d1c/#151020, primary accents #8b7cff/#665cff, secondary accent #f05aa6, and Logo gradient #665cff → #9b4dff → #f43f8f, with semantic success/warning/error colors remaining subordinate. Web surfaces render the real repository Logo instead of a text/initial substitute, use open/free Inter + Noto Sans SC/Noto Sans for interface copy and JetBrains Mono + Noto Sans Mono for technical text, exclude proprietary platform font names from product CSS, and keep readable light/dark text contrast. Desktop controls are compact while narrow/touch layouts retain at least 44px interaction targets. The TUI keeps a compact connection/status hierarchy with rounded terminal borders, actively loads the focused project, keeps the pairing code visible after connection, shows the complete supported-command catalog, distinguishes installed LSP availability from launch-ready trust and live-validated sessions, exposes real warm LSP session/document/start/query telemetry, and claims terminal output while ratatui owns the alternate screen. The WebUI uses rounded frosted/liquid-glass shell layers with roughly 20–28px primary curvature, smaller secondary radii and one continuous System → Subsystem topology canvas with visible dependency edges and Design-vs-Actual state before component detail surfaces; a floating/drill-down inspector, component index and raw component dependency graph stay secondary. First load may return a bounded pending shell immediately while heavy snapshot construction continues; usable snapshots are cached per workspace and served stale-while-revalidate, revision/activity fetches run asynchronously with generation guards, and switching to a cached project preserves the rendered view instead of blanking it before refresh. It must not use square geometry or decorative card/panel stacking as the primary architecture or pa