- schema_version: 1
  id: AC-VERIFY-001
  title: Verification readiness aggregates required evidence fail closed
  statement: Stage readiness keeps the latest result per producer and required verification target, a producer failure cannot be masked by another producer pass, equal-timestamp conflicting evidence from one producer keeps the less favorable verdict, and one changed language's pass cannot clear another changed language's target. HumanApproval uses only the newest decision timestamp and fails closed when decisions at that timestamp conflict, while a strictly newer human decision may resolve the conflict. Verification Plans bind the exact active code and Design State revision plus fixed risk-relevant behavioral changed-language stage targets so stale or under-scoped evidence cannot clear readiness. High/Critical targeting prefers deterministically risk-attributed changed source when available; presentation-only CSS/HTML stays out of language target cross-products unless an explicit advanced executor opts it in, and required stages remain global blockers rather than falling back to unrelated detected languages when no behavioral target applies. Project and language-quality checks capture revisions before execution and reject changed or incomplete code or Design State revisions before persisting report evidence; stable results retain the captured revision. MCP command and verification error flags reflect actual failures and zero-check verification rather than mere successful report serialization. Correctness reviewers receive a contract-first counterexample rubric, and risk reporting exposes required stage/target pairs that lack runnable local executors while keeping explicitly target-attested external stage evidence admissible.
