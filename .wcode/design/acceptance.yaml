- schema_version: 1
  id: AC-TUNNEL-001
  title: Managed tunnel selection supports free provider fallback
  statement: >-
    Every candidate tunnel is instance-health-verified, provider parsing rejects control hosts, and OAuth metadata plus existing sessions follow only verified aliases owned by the running wcode process. Primary health has one hysteretic source of truth: isolated or paired failures keep the endpoint live, the third consecutive failure permits failover, recovery requires two consecutive successes, and suspect/recovery probes run faster. Standbys keep independent bounded health leases; two failed lease probes revoke eligibility, stale leases expire, and failover selects only a current verified lease with deterministic freshness/uptime ordering. Standby probe completions are lease-epoch-bound and managed-primary health completions are current-primary-URL-bound, so delayed results from recycled or demoted tunnels cannot mutate replacement state. Startup retries are deterministically staggered, runtime reconnect uses one half-open attempt per due retry, repeated deaths open a bounded circuit-breaker cooldown, reconnect history resets only after sustained stability, and shutdown aborts in-flight health work rather than waiting for the network timeout. TaskMonitor and /healthz expose bounded role/state, lease age, failure/death counts, circuit/retry and uptime evidence; retrying providers without a live URL remain observable but are excluded from setup link selection, and Web/TUI surface this state without driving lifecycle decisions. An unhealthy last tunnel cannot produce an empty-set index panic, and provider paths never write directly to stdout/stderr or inherit child terminal output.
  verification:
    - {kind: test, path: tests/unit/runtime/tunnel/mod.rs, symbol: tunnel_runtime_never_writes_directly_to_the_terminal}
    - {kind: test, path: tests/unit/ui/monitor_health.rs, symbol: public_url_health_requires_three_failures_and_two_successes_to_recover}
    - {kind: test, path: tests/unit/runtime/tunnel/mod.rs, symbol: primary_health_uses_fast_confirmation_after_any_failure_streak}
