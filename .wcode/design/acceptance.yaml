- schema_version: 1
  id: AC-AUTH-001
  title: Human approval remains operation client and challenge bound
  statement: "Exact destructive file authorization remains operation-fingerprinted and one-shot. The bounded Git/GitHub and local developer lifecycle stays autonomous by default, with risky command shapes otherwise using explicit authorization. Modern MCP authorization remains owner/challenge-bound and legacy stdio uses the same AuthorizationManager. TUI, protected WebUI and form-capable stdio expose a current-runtime Workspace all-command authorization that can be enabled or revoked. Once explicitly enabled, it is authoritative for direct command execution: WCode does not reject a command because of executable family, shell usage, argument/path shape, credential/API/publish/destructive command policy, read-only command classification, or startup no-exec, and it does not inject Git policy overrides or scrub command environment. Full Access enables the same unrestricted command lane and may add current-user Home. Resource/process/timeout/output controls remain bounded, while protected-path/symlink/hard-link/SHA/file-delete rules for WCode file primitives remain separate."
