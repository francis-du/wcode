    - kind: test
      path: src/integrations/mcp.rs
      symbol: tests::product_scope_status_flows_through_mcp

- schema_version: 1
  id: AC-WORKSPACE-001
  title: Workspace coding primitives remain transactional and guarded
  statement: Text/media inspection and create edit batch move/delete primitives preserve workspace isolation, observed-revision preconditions and bounded behavior; runtime Workspace additions and command authorization remain no-shell and root-scoped, while only validated exact git add/commit and explicit remote+ref non-force-push shapes may cross the risky-operation gate after explicit human approval and permanently blocked mutation shapes remain blocked.
  verification:
    - kind: test
      path: src/workspace/mod.rs
      symbol: tests::coding_primitives_create_write_edit_move_and_batch_safely
    - kind: test
      path: src/workspace/mod.rs
      symbol: tests::workspace_command_allowlist_supports_defaults_and_operator_authorized_programs
    - kind: test
      path: src/workspace/mod.rs
      symbol: tests::revoked_catalog_command_becomes_selectively_authorizable
    - kind: test
      path: src/workspace/command_policy.rs
      symbol: tests::git_mutations_require_exact_risky_authorization_and_keep_hard_boundaries
    - kind: test
      path: src/workspace/media.rs
      symbol: tests::detects_png_dimensions_without_decoder_dependency

- schema_version: 1
  id: AC-SCHEDULER-001
  title: Scheduler orders conflicts and coalesces only safe edits
  statement: Resource dependencies order move delete and directory creation conflicts while same-file same-SHA edits coalesce only when safe.
  verification:
    - kind: test
      path: src/workspace/scheduler.rs
      symbol: tests::move_delete_and_directory_creation_dependencies_are_ordered
    - kind: test
      path: src/workspace/scheduler.rs
      symbol: tests::same_file_same_sha_coalesces_and_conflicts_are_rejected

- schema_version: 1
  id: AC-AUTH-001
  title: Destructive approval is operation-bound and one-shot
  statement: A destructive authorization applies only to the approved operation fingerprint and its one-shot grant cannot be reused.
  verification:
    - kind: test
      path: src/workspace/authorization.rs
      symbol: tests::destructive_approval_is_exact_and_consumed_once

- schema_version: 1
  id: AC-MCP-002
  title: MCP exposes portable capabilities and durable tasks
  statement: Tools Prompts Resources and durable owner-scoped Tasks flow through the shared MCP runtime, the tool catalog exposes Product Scope metadata, and optional image/audio Tool Result content is returned only when the current request explicitly advertises the wcode media extension; capability absence fails closed without binary payloads.
  verification:
    - kind: test
      path: src/integrations/mcp.rs
      symbol: tests::prompt_and_resource_catalog_flow_through_modern_mcp
    - kind: test
      path: src/integrations/mcp.rs
      symbol: tests::task_augmented_tool_is_durable_pollable_and_owner_scoped
    - kind: test
      path: src/integrations/mcp.rs
      symbol: tests::tool_list_exposes_bulk_index_and_positive_harness_tools
    - kind: test
      path: src/integrations/mcp_dispatch.rs
      symbol: media_capability_tests::media_content_is_fail_closed_without_explicit_client_extension
    - kind: test
      path: src/integrations/mcp_dispatch.rs
      symbol: media_capability_tests::media_content_requires_matching_kind_and_optional_mime_filter

- schema_version: 1
  id: AC-MCP-003
  title: OAuth discovery and registration remain resource-bound
  statement: Protected-resource metadata identifies the MCP resource and supported modern web/native registration profiles preserve the intended OAuth interoperability boundary.
  verification:
    - kind: test
      path: src/integrations/auth.rs
      symbol: tests::protected_resource_metadata_matches_mcp_resource_identifier
    - kind: test
      path: src/integrations/auth.rs
      symbol: tests::modern_mcp_registration_profiles_cover_web_and_native_agents

- schema_version: 1
  id: AC-GRAPH-001
  title: Composite graph history distinguishes structure from provenance churn
  statement: Persisted Software Graph revisions retain explicit precision and diff real structural changes separately from provider revision churn.
  verification:
    - kind: test
      path: src/graph/graph_store.rs
      symbol: tests::graph_diff_separates_structural_changes_from_revision_churn
    - kind: test
      path: src/graph/code_index.rs
