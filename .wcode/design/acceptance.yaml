- schema_version: 1
  id: AC-MCP-003
  title: OAuth discovery and registration remain resource-bound
  statement: OAuth metadata and redirects use the verified Host that received the request. DCR clients and resource-bound tokens survive a fresh runtime load for the same configured Workspace roots without clock expiry; a verified replacement tunnel can continue the session, while malformed or symlinked state, unknown Hosts, stale historical Hosts and different Workspace scopes remain outside the boundary. MCP GET/POST, legacy SSE and protected WebUI share active-alias Origin validation without skipping authentication or trusting arbitrary client origins; malformed, duplicate and credential-bearing headers fail closed, historical token resources do not authorize browser origins, and diagnostics distinguish untrusted_host from untrusted_origin without exposing credentials.
