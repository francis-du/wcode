- schema_version: 1
  id: AC-SEMANTIC-001
  title: Semantic providers and scoped registry cover indexed languages
  statement: Every indexed language has an explicit semantic provider candidate, scoped semantic queries filter scoped facts while preserving global facts, and semantic provider status/refresh uses the same explicit execution-trust boundary so a session-approved refresh can produce fresh semantic graph evidence without silently running language servers.
  verification:
    - kind: test
      path: src/semantics/provider.rs
      symbol: tests::every_indexed_language_has_a_semantic_provider_candidate
    - kind: test
      path: src/semantics/mod.rs
      symbol: tests::scoped_queries_filter_scoped_facts_but_keep_global_facts

- schema_version: 1
  id: AC-ACTUAL-001
  title: Actual State review remains bounded and source-derived
  statement: Git review parsing classifies current changes, metrics and risk signals without requiring unbounded diff bodies.
  verification:
    - kind: test
      path: src/runtime/harness_tests.rs
      symbol: change_review_parsers_classify_status_metrics_and_risk

- schema_version: 1
  id: AC-INTELLIGENCE-001
  title: Software Intelligence resolves traceability scoped context and release readiness
  statement: Requirement traceability resolves real implementation/test symbols, Product Scope filters narrow software-context source navigation, and the CLI check fails closed when Design Traceability Scope or required Convention state is incomplete.
  verification:
