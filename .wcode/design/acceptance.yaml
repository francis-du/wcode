    - kind: test
      path: src/main.rs
      symbol: tests::intelligence_check_requires_valid_complete_scoped_state

- schema_version: 1
  id: AC-VERIFY-001
  title: Verification readiness aggregates required evidence fail closed
  statement: Stage readiness keeps the latest result per producer and a producer failure cannot be masked by another producer pass.
  verification:
    - kind: test
      path: src/intelligence/tests.rs
      symbol: stage_readiness_aggregates_latest_result_per_producer_fail_closed
    - kind: check
      id: rust-test

