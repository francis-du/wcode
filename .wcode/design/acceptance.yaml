- schema_version: 1
  id: AC-CLI-001
  title: CLI exposes a compact stable catalog one-command setup and verified self-update
  statement: Default help presents the explicit runtime command contract with setup/update/mcp-stdio/intelligence/verification and the discoverable help-all reference entry, omits the redundant generated help command and low-frequency advanced flags, keeps only agent-plugin as a hidden advanced export control, rejects removed restart/stop commands, and exposes update without requiring Workspace initialization. Foreground lifecycle is Ctrl-C/SIGTERM owned and stdio lifecycle is MCP-Host owned with no separate runtime-control route/state file. Setup provides the safe Global-first / Current-project Agent host installer while local MCP configuration remains path-free and current-directory scoped. Self-update targets the running installation unless explicitly overridden and preserves checksum, staged smoke-test and replace-after-success behavior on Unix and Windows. Performance presets preserve default budgets and explicit override precedence; configuration previews have no startup or authorization side effects, common flags work after subcommands, contradictory restrictions fail before startup and setup never silently ignores extra roots. Setup validates overrides before writes, saves the selected performance and restrictive runtime arguments consistently across supported Host formats, reports the planned launch, and applies the reviewed global plan with its original SHA preconditions.
