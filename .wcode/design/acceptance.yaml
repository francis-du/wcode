- schema_version: 1
  id: AC-AGENT-CONTEXT-001
  title: Coding agents receive a bounded edit-ready context pack
  statement: >-
    agent_context is exposed through MCP and compiles repository guidance, relevant Design State, ranked syntax-level symbol signatures, exact file SHA preconditions, related verification references, graph evidence, risks and Harness checks into a serialized result that stays within an explicit requested token budget or a bounded adaptive budget when the caller omits one; adaptive sizing uses task ambiguity, symbol/Requirement/Design breadth, graph truncation, risks and requested scopes instead of one fixed default. Repository-map routing identifies unambiguous requirement-trace-to-code, code-to-test, review-comment-to-context, reproduced-failure-trace-to-code and edit-to-ripple requests with explicit heuristic provenance, abstains to balanced context when signals conflict, keeps exact literal/qualified targets above recall-oriented retrieval seeds, and never lets routing metadata displace direct SHA targets, verification references, the strongest repo-map item or diagnostic Hot Source under tight budgets. Readiness classifies ordinary single-target work as minimal_patch and exposes a zero-growth complexity budget for new production files, abstractions, config knobs and public API changes, while broader localized or architecture work requires correspondingly stronger current-task evidence. A revision-guarded per-Workspace Worklist persists unfinished multi-step work across reconnects/model switches, is surfaced by Agent Context, rejects stale concurrent updates, preserves blocked items as unfinished, and prevents a new list from silently replacing unfinished user tasks. Exact task targets cannot be displaced by high-degree helpers; bounded top-K selection uses canonical identity tie-breaks and must match a full-sort prefix under the same precedence. No-op graph supplementation borrows the fresh snapshot rather than copying it. Its repository map uses task relevance plus bounded dependency centrality, keeps localized symbol lookup in the smallest common source directory while relationship, test, trace and ambiguous task requests retain bounded cross-directory discovery on both cold and warm paths; identifier substrings do not trigger task intent, surrounding Chinese/English instructions and sentence punctuation remain recognizable, and changed source invalidates obsolete call edges; warm exact seeds skip ordinary discovery only when all explicit literal targets have fresh exact coverage, keeps Tree-sitter as the cacheable syntax backbone, and bridges fresh source-revision-matching semantic/runtime/deterministic provider nodes onto canonical `(path, qualified_name/name)` symbol identities so stronger caller/callee/implementation evidence outranks syntax-only relationships without duplicating symbols; it enriches only the ranked symbols through a targeted CodeIndex metadata lookup instead of materializing whole-file outlines, and surfaces direct matches and likely callers/callees/helpers with explicit relationship reasons and precision, and literal and qualified symbol names outrank partial helper matches after merging bounded scope candidates, and the strongest direct match may include a bounded hot-source body so common edits can begin without another context round trip while additional bodies remain progressively disclosed; the pack exposes explicit edit/verification readiness that respects Workspace/file writeability, graph precision covered by every direct target rather than the strongest relationship of only one target, truncation and advisory signals plus deterministic next tool actions rather than an opaque quality score; MCP enrichment concurrently performs one bounded read-only Git status probe when repository execution is available, includes working-tree state only for direct targets, warns on existing staged/unstaged/untracked changes and changes edit readiness to `worktree_conflict` for unmerged targets without making Git availability a prerequisite. Explicit supported file and line anchors prioritize the smallest containing syntax definition and diagnostic-line-first original excerpts with matching SHA; non-code files use deterministic file targets, invalid/missing/protected/escaping anchors cannot promote unrelated symbols, and normal symbol queries retain their existing path. Exact anchors seed the canonical context builder before lexical discovery; simple unscoped locations defer repository-map expansion explicitly, while scoped, relationship, architecture, explicit review-comment and strong reproduced-failure-trace requests retain graph expansion. In review-comment or failure-trace mode the anchored reviewed/frame file remains the exact target/Hot Source/SHA seed but is excluded from RepoMap additional-context ranking so the bounded result is spent on cross-file context rather than rediscovering already-given input; generic failure wording without a strong trace marker does not activate this route. Repository guidance is extractively task-selected: one concise agent-instruction baseline may remain, while README/development/contribution text enters the coding pack only when query, target symbols/paths, Design items or requested scopes match it; selected guidance keeps original text around the strongest matching lines rather than generating a summary, and mandatory policy remains enforced independently by deterministic core constraints. Adaptive sizing does not grant a large budget merely because symbol discovery returned no direct target; unresolved retrieval receives only a small exploration allowance while Requirement/Design breadth, graph truncation, known risk, multi-scope work and query complexity earn incremental budget. Final MCP result metadata reports model-token versus selected-budget utilization outside model-visible structured content, and Observatory/TUI expose this only as descriptive efficiency telemetry rather than a quality score. The full query remains available to internal routing/readiness while building the pack but is not echoed into final model-visible Agent Context because the tool-call arguments already contain it. Model-facing tool schemas omit routine context-budget tuning knobs so adaptive sizing is the normal coding-agent path while explicit protocol callers can still provide a fixed budget when intentionally required. When no explicit workspace argument is supplied, agent_context prefers the most specific discovered subspace whose id or final path segment appears as a bounded token in the query so multi-project parents do not inject unrelated noise; explicit workspace arguments always win and other tools retain default selection. Design, verification mappings, SHA and ordinary symbol search remain intact.
