- schema_version: 1
  id: AC-OBSERVABILITY-001
  title: Project observatory is architecture-first and code-derived
  statement: The WebUI first exposes the complete component architecture with Design / Implementation / Overlay graph modes, clickable component drill-down, visible graph provider/precision, an observed-drift percentage based only on strong positive undeclared Actual dependencies, evidence coverage for declared dependencies, and implementation coverage for components. Requirement detail then exposes Desired State, current Actual State, active Change, revision-exact Proof and Convergence with real blockers, verification, mapped Git changes, code statistics and graph revision history. A declared dependency not observed in bounded syntax evidence remains non-blocking advisory; the generic undifferentiated ball graph is absent from the primary page.
  verification:
    - kind: test
      path: src/runtime/harness_tests.rs
      symbol: project_observatory_builds_requirement_architecture_from_current_code
    - kind: test
      path: src/ui/intelligence_web.rs
