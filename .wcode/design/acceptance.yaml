- schema_version: 1
  id: AC-AUTH-001
  title: Human approval remains operation client and challenge bound
  statement: A destructive authorization applies only to the approved operation fingerprint and its one-shot grant cannot be reused. Modern MCP authorization returns input_required only to clients that advertise form elicitation, rejects a retry from a different MCP owner or invalid challenge, and executes only after an accepted human response. Legacy stdio drives elicitation/create only for clients that negotiated compatible form elicitation and then retries the original tool call through the same AuthorizationManager. Explicit Full Access may add the current user Home and otherwise-authorizable runtime capabilities, but filesystem-root exposure remains disabled and protected-path/symlink/hard-link/no-shell boundaries remain enforced. The transition validates capacity and every root before committing the registry and flag together; failure leaves previous permissions untouched, existing file locks and command revocations stay shared, and concurrent workspace additions observe the same committed policy.
  verification:
    - kind: test
      path: tests/unit/workspace/authorization.rs
      symbol: destructive_approval_is_exact_and_consumed_once
    - kind: test
      path: tests/unit/integrations/mcp/protocol.rs
