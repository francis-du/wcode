- schema_version: 1
  id: AC-INDEX-001
  title: Software graph exposes syntax precision and revision provenance
  statement: Tree-sitter graph nodes and edges retain syntax precision and revision provenance. Graph budgets select emitted nodes but must not erase known homonyms or reattribute calls from omitted inner functions to retained enclosing definitions; unambiguous explicit paths and genuinely unique calls remain available. Symbol bodies, ranges, signatures and relations must share a SHA or fail explicitly. Cached syntax facts must be invalidated by source-content changes even when file size and mtime are replayed; Unix uses change identity in the source stamp while other platforms retain a content-SHA fallback. Concurrent same-file cache misses share a bounded build flight across search and outline entry points; other files remain independent, invalidation rejects late publication, and failed builds do not permanently block later queries.
