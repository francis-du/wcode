- schema_version: 1
  id: AC-AUTH-001
  title: Human approval remains operation client and challenge bound
  statement: A destructive authorization applies only to the approved operation fingerprint and its one-shot grant cannot be reused. The bounded Git publication lifecycle (add, commit with explicit message, branch/switch/tag, staged restore, and ordinary non-force push) and bounded local developer toolchains (test/check/lint/build/format plus lockfile/dependency sync and named verification scripts) run without human approval so autonomous verified iteration can complete. Force/delete/history-rewriting variants, arbitrary interpreter execution, remote publish/authentication, host-wide configuration and infrastructure mutation remain blocked or explicitly authorized. Modern MCP authorization returns input_required only to clients that advertise form elicitation, rejects a retry from a different MCP owner or invalid challenge, and executes only after an accepted human response. Legacy stdio uses the same AuthorizationManager. Full Access may add the current user Home and otherwise-authorizable runtime capabilities, but filesystem-root exposure and protected-path/symlink/hard-link/no-shell boundaries remain enforced; failed transitions leave previous permissions untouched.
