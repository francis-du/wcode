- schema_version: 1
  id: AC-SEC-003
  title: Command policy blocks unbounded project execution by default
  statement: The safe command lane admits only bounded shapes and blocks project code, mutation and helper-based bypasses without an explicit trust expansion. Command args must preserve every string including empty arguments; explicit invalid args, cwd or timeout values are rejected before execution or authorization instead of falling back to defaults.
