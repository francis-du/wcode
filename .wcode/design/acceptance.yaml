- schema_version: 1
  id: AC-SCHEDULER-001
  title: Scheduler orders conflicts and coalesces only safe edits
  statement: Resource dependencies order move delete and directory creation conflicts while same-file same-SHA edits coalesce only when safe. Successors become ready on their own predecessor completion, physical parent/subspace aliases conflict, failed dependencies skip successors, queued children remain owned by the parent, and coalescing preserves intervening dependent operations and the 128-edit limit. Partial bulk failures preserve per-item results, fail the batch and block dependent successors without stopping independent work. Started blocking workers retain their real semaphore permit until completion or panic even when their async caller is cancelled; the monitor keeps that retained work active until the worker actually releases capacity. Outer tool-slot admission is bounded and returns an explicit capacity-busy error before transport/client deadlines instead of waiting indefinitely. Optional strict-boolean dry_run returns the same bounded dependency and coalescing graph without dispatching child tasks, acquiring execution slots, echoing payloads or creating authorization requests; numeric task indices and explicit unchecked authorization/file-precondition flags prevent the preview from masquerading as an execution or permission grant.
