- schema_version: 1
  id: AC-SEC-001
  title: Parent traversal and stale-root escapes are rejected
  statement: Workspace path resolution rejects traversal outside the selected root and stale writes do not silently overwrite changed files.
  verification:
    - kind: test
      path: src/workspace/mod.rs
      symbol: tests::blocks_path_traversal_and_stale_writes

- schema_version: 1
  id: AC-SEC-002
  title: Symlink and hard-link aliases cannot bypass write safety
  statement: Symlink paths are rejected and unsafe aliasing cannot bypass the workspace write boundary.
  verification:
    - kind: test
      path: src/workspace/mod.rs
      symbol: tests::blocks_symlink_and_hardlink_aliases

- schema_version: 1
  id: AC-SEC-003
  title: Command policy blocks unbounded project execution by default
  statement: The safe command lane admits only bounded shapes and blocks project code, mutation and helper-based bypasses without an explicit trust expansion.
  verification:
    - kind: test
      path: src/workspace/mod.rs
      symbol: tests::command_policy_allows_standard_cargo_verification_but_blocks_arbitrary_execution

- schema_version: 1
  id: AC-SEC-004
  title: Existing-file edits enforce the observed SHA
  statement: A replacement made with a stale SHA-256 precondition fails instead of overwriting the newer file.
  verification:
    - kind: test
      path: src/workspace/mod.rs
      symbol: tests::blocks_path_traversal_and_stale_writes

- schema_version: 1
  id: AC-MCP-001
  title: Supported MCP revisions are detected explicitly
  statement: Modern and legacy supported clients are detected through the intended protocol negotiation path.
  verification:
    - kind: test
      path: src/integrations/mcp.rs
      symbol: tests::protocol_detection_supports_modern_and_legacy_clients

- schema_version: 1
  id: AC-HARNESS-001
  title: Verification passes through the bounded Harness lane
  statement: The repository test suite and Harness verification rules remain executable through approved bounded shapes.
  verification:
    - kind: test
      path: src/workspace/mod.rs
      symbol: tests::bounded_direct_and_harness_checks_run_without_risky_exec
    - kind: check
      id: rust-test

- schema_version: 1
  id: AC-INDEX-001
  title: Software graph exposes syntax precision and revision provenance
