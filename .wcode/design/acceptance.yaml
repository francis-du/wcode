- schema_version: 1
  id: AC-HARNESS-001
  title: Verification passes through the bounded Harness lane
  statement: >-
    The repository test suite and Harness verification rules remain executable through approved bounded shapes. Rust
    full verification and the language-quality Clippy provider cover all targets including tests; locked and unlocked
    profiles retain this coverage on cache hits, the locked command matches CI, and fixed check-only policy shapes
    continue to reject automatic fixes and configuration redirects. Verification accounts for the complete
    mixed-language plan up to 32 checks and rejects larger plans before dispatch instead of silently accepting a
    truncated prefix. Exact deterministic check Evidence stores versioned elapsed-time facts; retries are normalized
    to one latest observation per exact-command revision, equal-timestamp conflicts remain fail-closed, and fail-fast
    execution may isolate a bounded frontier of at most two phase-zero sentinels only from independent revision
    evidence. Temporal holdout replay permits explicit cold-start exploration but, after four evaluable revisions,
    blocks the learned frontier unless net time savings are positive with zero outcome mismatches. Correlated failures,
    cold-start low-signal, unreadable history, proven replay regression and diagnostic execution preserve the canonical
    phased-parallel remainder, and every required check remains in the plan. Quick verification may add at most one
    phase-one Rust, Python or Go focused test only from a direct changed implementation path through valid Design
    ownership to an Acceptance test in the same language island, with a simple declared symbol resolved in that exact
    test file; Cargo filters, including the exact `--lib` selector followed by one simple Rust symbol filter, pytest node IDs and Go package/-run filters remain exact workspace-bounded
    verification-safe shapes, stale, escaping or unsupported mappings add nothing, and full verification keeps its
    original broad tests unchanged. Successful allowlisted static checks may be reused only inside a bounded in-process
    exact-revision cache whose key includes code and Design revisions, verification/check shape, execution policy,
    environment and executable identity. Behavioral tests, arbitrary scripts, failures and partial/stale revisions are
    never reused; reused checks are visibly marked, do not consume an execution phase, and do not create duplicate
    individual, aggregate or Acceptance Evidence merely by being cited again. Concurrent verify_project calls for the
    same Workspace and exact revision/configuration coalesce into one in-flight verification run so compiler/test
    processes are not duplicated; a changed revision starts independently, followers receive the leader report without
    recording a second proof, and a cancelled leader wakes followers with an explicit error. Cargo admission uses an
    explicit reader/writer contention model. Registry commands remain globally exclusive, workspace
    build/check/clippy/doc/fix/run/rustc/rustdoc commands require an exclusive workspace permit, and verification-safe
    cargo test commands may run concurrently as shared readers only up to the resource governor child-process capacity.
    Exclusive commands wait for active test readers, new test readers wait behind an acquired exclusive command, and
    all lanes retain bounded queue waits, hardened arguments, child CPU/thread limits and unchanged verification
    semantics. Foreground CPU/process capacity remains hardware- and memory-bounded but no longer hard-caps all profiles
    at eight CPU burst lanes. 1 GiB+ profiles can scale toward sixteen CPU burst lanes and eight heavy children on
    capable hosts while the 512 MiB balanced profile remains bounded by its memory budget.
  verification:
