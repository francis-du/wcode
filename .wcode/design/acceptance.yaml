- schema_version: 1
  id: AC-TUNNEL-001
  title: Managed tunnels are concurrent independent verified endpoints
  statement: >-
    All instance-verified tunnel URLs are concurrent active MCP endpoints, never primary or standby. Each endpoint has its own identity-bound single-flight health lease and independent recovery worker. Healthy probes run every three seconds and suspect/recovery probes every second; the scheduler ticks every 250 ms without waiting on network requests. Probes use the compact /healthz/probe response, allow ten seconds for a cold connection and fifteen seconds total, and require ok=true plus the current instance_id. Two failed probes quarantine health; the existing URL and Host trust survive a bounded 30-second in-place recovery window and two consecutive successes restore verified health. A convenience URL for local copying does not grant exclusive routing or health authority. Previously verified stable aliases preserve only their existing bounded lease across child exit and continue independent probes; historical OAuth resources never restore Host trust. Registration epochs protect same-URL replacements from stale cleanup. Provider subprocess groups are owned from spawn, including startup cancellation and shutdown, with no global orphan scan. Provider-specific startup deadlines are not truncated by auto mode. Explicit Cloudflare HTTP 429 / error 1015 receives a five-minute cooldown in both startup and reconnect; ordinary failures retain bounded staggered retries. Initial failures remain observable without publishing unverified links. Every active URL is usable in Setup, TUI and Observatory. OAuth, Origin and Workspace authorization remain enforced on every endpoint.
