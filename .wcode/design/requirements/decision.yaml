schema_version: 1
id: REQ-DECISION-001
title: Calibrated advisory Decision Plane
intent: >-
  wcode must expose a provider-neutral structured Decision Plane with probability, choice and score primitives for bounded Agent strategy. Decision quality must be measurable against independent task truth rather than self-labeled state: Engineering Fitness grades context_sufficient against authored Gold edit inputs and reports Brier, false-stop and false-continue outcomes by budget and cold/warm phase. Multiple providers must be comparable on the exact same DecisionRequest, including signal overlap, probability/score deltas, choice disagreements, shape mismatches and safety-policy violations. The deterministic provider remains authority for any work-reducing transition. An explicitly integrated external Jev provider may be promoted only to increase-only assist, where it can request additional retrieval, semantic navigation, verification, or reasoning but cannot authorize editing, lower verification, weaken authorization, bypass SHA/evidence requirements, or otherwise reduce deterministic work. Jev is the first optional provider and is discovered dynamically per Agent Context call from process or literal user-shell configuration, failing soft to deterministic behavior when unavailable. Decision outputs must carry explicit confidence and evidence codes, remain bounded enough to fit Agent Context budgets, and support provider-neutral calibration without claiming hidden reasoning quality.
priority: high
implemented_by:
  - component:decision-plane
acceptance:
  - AC-DECISION-001
constraints:
  - CONSTRAINT-BOUNDED-VERIFICATION
  - CONSTRAINT-CONTEXT-BUDGET
risk:
  reliability: high
  performance: medium
