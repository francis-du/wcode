schema_version: 1
id: REQ-GITHUB-CREDENTIALS-001
title: Renew explicitly provisioned GitHub installation credentials without replaying publication
intent: >-
  A dedicated trusted publisher can opt in to App-key installation-token renewal while preserving existing static-token operation. Unix hosts may use a strictly validated private PEM file; any supported host may instead receive bounded PEM bytes directly from a protected service environment without wcode persisting them. The installed publisher, watcher and inbox worker share one bounded credential source per provider, pin repository/App/installation and requested permissions, and treat unavailable renewal as unavailable authority rather than reusing stale tokens or replaying ambiguous writes. The receiver, read-only local queue operations and event verification do not read the App signing key. Private-key custody is a stronger trusted-host boundary than holding a scoped token; no new native proof, remote App registration, automatic key provisioning or tenant-isolation claim follows from authentication.
priority: high
implemented_by:
  - component:change-acceptance
acceptance:
  - AC-GITHUB-CREDENTIALS-001
constraints:
  - CONSTRAINT-ROOT-ISOLATION
  - CONSTRAINT-NO-SHELL
  - CONSTRAINT-FAIL-CLOSED-VERIFICATION
  - CONSTRAINT-EVIDENCE-PROVENANCE
risk:
  security: high
  reliability: high
