schema_version: 1
id: REQ-CREDENTIAL-TRANSPORT-001
title: Guarded execution and text views cover Team and installation credential forms
intent: The existing guarded command environment scrubber must remove credential values and credential/private-key file locations as well as tokens and secrets. Recognizable Team and CI opaque bearer values in raw source/output must be redacted without altering row identity or unrelated identifiers. These defensive transport rules do not replace OS process isolation or override explicitly authorized unrestricted execution semantics. Existing SSH push and LFS push behavior stays unchanged. A fetch with one non-option configured-remote name and one explicit ref may share the fixed noninteractive SSH transport only after complete bounded command validation; its inherited SSH_AUTH_SOCK is retained only when the calling execution lane permits credentials. Broad execution remains network-denied, and arbitrary Git SSH/configuration injection is not admitted.
priority: critical
implemented_by: [component:credential-transport]
acceptance: [AC-CREDENTIAL-TRANSPORT-001]
constraints: [CONSTRAINT-ROOT-ISOLATION, CONSTRAINT-EVIDENCE-PROVENANCE]
