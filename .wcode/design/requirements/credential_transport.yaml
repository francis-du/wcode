schema_version: 1
id: REQ-CREDENTIAL-TRANSPORT-001
title: Guarded execution and text views cover Team and installation credential forms
intent: The existing guarded command environment scrubber must remove credential values and credential/private-key file locations as well as tokens and secrets. Recognizable Team and CI opaque bearer values in raw source/output must be redacted without altering row identity or unrelated identifiers. These defensive transport rules do not replace OS process isolation or override explicitly authorized unrestricted execution semantics.
priority: critical
implemented_by: [component:credential-transport]
acceptance: [AC-CREDENTIAL-TRANSPORT-001]
constraints: [CONSTRAINT-ROOT-ISOLATION, CONSTRAINT-EVIDENCE-PROVENANCE]
