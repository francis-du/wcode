schema_version: 1
id: REQ-FITNESS-001
title: Model-free Engineering Fitness measures observable repository assistance
intent: >-
  Engineering Fitness must evaluate frozen synthetic source tasks without model calls. It separates path-qualified retrieval, ranking/noise, complete source delivery, fresh SHA/edit inputs, mutation-specific bug-relevant evidence, syntax relationships, boundary controls and descriptive costs. Failed queries remain explicit and contribute zero hits to quality denominators; a successful evaluator test never implies perfect tool quality. The experiment owns the requested budget; a response cannot raise that limit. Ranking averages include failed answerable attempts as zero, and undefined metrics remain unavailable in human reports. Independent counterexamples must challenge optimizations that reduce output counts by dropping real relationships, and warm-cache reuse cannot omit task-qualified evidence found cold. Gold data stays outside evaluated workspaces. Reports retain corpus/evaluator/binary fingerprints, observed source stability, budgets, cache definitions, samples and unavailable dimensions. Default unit verification must not recompute an identical full-corpus collect(1) snapshot for independent matrix/noise/decision-calibration assertions: those assertions share one model-free snapshot per test binary, while the seven-sample report-emitting Fitness trial remains explicit opt-in/ignored. Syntax graph fixtures never claim live LSP accuracy or autonomous bug finding, and edit input coverage never claims executed verification or a correct generated patch.
priority: high
implemented_by:
  - component:engineering-fitness
acceptance:
  - AC-FITNESS-001
constraints:
  - CONSTRAINT-BOUNDED-VERIFICATION
  - CONSTRAINT-EXPLICIT-PRECISION
  - CONSTRAINT-CONTEXT-BUDGET
