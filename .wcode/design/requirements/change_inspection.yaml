schema_version: 1
id: REQ-CHANGE-INSPECTION-001
title: Inspect real source changes without opening an IDE
intent: >-
  The existing protected Changes workspace must let an operator open a changed path and inspect a read-only unified diff for HEAD versus working tree, HEAD versus index, or index versus working tree. The Workspace owns fixed Git inspection and filesystem protection; the HTTP adapter cannot accept arbitrary commands or revision expressions. Before/after HEAD, selected index entry, status and current file SHA observations bind the file snapshot. Layer switches reject stale snapshots instead of silently mixing versions. Untracked source, selected-layer empty output, binary/unavailable, partial and redacted views remain distinct. Returned change observations include bounded typed before/after changed-line ranges derived from visible changed lines rather than hunk context, with partial coverage explicit. When a non-redacted comparison after-state is the captured worktree bytes and still matches the captured worktree SHA, returned after-line ranges may be mapped to bounded current Tree-sitter definition ranges and drilled into Code Graph by exact syntax node id; staged views with newer unstaged worktree bytes must withhold that mapping rather than attach staged ranges to the wrong source. For tracked paths with a baseline at the same path, the exact captured HEAD/index baseline is parsed separately and before-line ranges are mapped to before-state Tree-sitter definitions, while after-state mapping keeps its own snapshot identity. The paired view identifies syntax definitions overlapped by removed/added lines. When both exact Tree-sitter outlines are complete, a same qualified-name + kind identity appearing exactly once on the opposite side is labeled modified, while an overlapped identity with no opposite-side match is labeled path-local added or removed; ambiguous identities stay unknown. Every mapped symbol exposes `counterpart_only` as a required boolean; the browser rejects missing or malformed values and labels `true` rows as paired counterparts with no changed-line overlap so they cannot be mistaken for directly overlapped definitions. The browser does not trust that flag alone: each symbol's `changed_ranges` must exactly equal the intersections of that symbol's Tree-sitter line range with the captured changed-line ranges on the same side. Direct symbols require at least one exact intersection, while counterpart-only symbols require no intersection and an empty `changed_ranges`; contradictions fail closed so a file-level change cannot be promoted into a function-body change. Counterpart-only after rows remain display-only and cannot open Code Graph or request impact as if they were directly changed symbols. The impact endpoint independently enforces the same boundary after remapping the exact snapshot: a matching Tree-sitter node id is insufficient unless that current after-symbol explicitly has `counterpart_only=false`. A directly overlapped before/after definition with returned `changed_ranges` may reveal the corresponding visible before/after line inside the same captured diff; the browser revalidates path, snapshot, side/node membership and range containment before scrolling, while counterpart-only rows have no reveal action. This is local navigation inside the captured patch, not historical-source retrieval or semantic proof. The view may compare exact non-redacted Tree-sitter signatures as changed/unchanged syntax text. These are syntax-only observations and do not infer semantic impact, API compatibility or rename correspondence. The existing theme, bilingual labels and keyboard-accessible scrolling are retained without an IDE editor or a new top-level workspace. Code Graph navigation may drill from a stored node to a bounded source window only when the current Workspace bytes still match that node's source SHA; path/range come from the stored graph snapshot, not browser parameters, and syntax/runtime/semantic relationship precision remains separately labeled. When that drilldown originates from a changed worktree symbol, the browser first requires the requested Tree-sitter node to still belong to the current change-detail mapping, with the same captured snapshot/worktree SHA and `source_state=worktree`; staged, stale or non-mapped syntax nodes fail closed before graph navigation. The browser then carries the code + Design revision captured by change-detail; the focus endpoint verifies it before graph construction, rebuilds the current graph for that matching revision, rechecks the repository revision after construction, and rejects concurrent drift instead of navigating into a newer repository state. Before an on-demand impact request leaves the browser, the current symbol mapping path and snapshot id must still match the rendered change-detail view, its mapped source SHA must still equal the captured worktree SHA, and the requested node must still be a directly overlapped after symbol. Changed-symbol graph, impact and syntax-caller actions rerun the full symbol-mapping validator at action time, including exact changed-range intersections, so later-mutated or stale in-memory mapping state cannot promote a file-level change into function-level navigation; invalid mappings fail closed without issuing a request or opening a graph. An in-flight impact response must rerun the same direct-symbol mapping checks against the still-current change-detail state before it can populate relations, so a mapping that becomes stale or contradictory after request dispatch cannot attach cross-file relationships to a symbol that no longer qualifies as directly changed. On-demand impact explanation may expose live semantic incoming calls/references/implementations for the exact worktree revision or explicitly degraded syntax callers plus separately labeled exact text matches; a degraded syntax caller that retains a concrete Tree-sitter graph node identity may continue into the same revision-bound Code Graph and protected source preview only when that node is still present in the currently accepted incoming-call relation payload for the same snapshot/revision. Caller navigation is validated against the relation result rather than incorrectly requiring the caller to be one of the changed file's own symbols, while that navigation identity remains syntax context rather than semantic proof. The browser labels that actionable row explicitly as syntax-node Code Graph navigation so semantic-only relation rows remain visually distinct and non-navigable by syntax identity. Live semantic relation rows never inherit or accept Tree-sitter graph node identities, so semantic-provider output cannot inject syntax navigation provenance into semantic relationships. Server normalization first validates raw semantic-navigation provenance: a present `degraded` field must be boolean rather than defaulting malformed metadata to semantic mode; the runtime fallback route `degraded_syntax_and_keyword_search` is the only degraded route accepted and is canonically exposed to the browser as `syntax-degraded`; semantic rows that carry Tree-sitter node ids, or degraded payloads that carry semantic references/implementations, are rejected instead of being silently sanitized. The live semantic runtime route `cross_file_semantic` is the only accepted raw semantic route and is canonically exposed as public `routing=lsp`; raw `lsp` is not accepted as runtime provenance. The raw semantic-navigation path must be present and exactly equal the selected changed path, so a provider result from another file cannot be relabeled onto the requested change. The semantic-navigation selector itself must remain bound to the selected changed definition: its revision must equal the captured worktree source SHA, its resolved start line must equal the selected changed-symbol line, and its resolved name must exactly match the selected changed-symbol selector. For live semantic results, the provider's emitted query line and character must also be present and exactly match the selector line and character; a different provider query position, different resolved name, or any other contradictory or incomplete query/selector identity fails closed instead of attaching relationships to a different resolved definition. Browser validation also binds relation precision to provenance: syntax fallback is accepted only as `provider=tree-sitter+search`, `routing=syntax-degraded`, `degraded_from=lsp`, while semantic results require `routing=lsp`, a non-degraded shape, and the runtime LSP provider identity `provider=lsp:<provider-id>`; arbitrary non-LSP provider names and the reserved syntax fallback identity `tree-sitter+search` fail closed instead of being relabeled. Text matches remain source-revision-bound mentions rather than call relations, references, semantic proof or Verification Evidence. Impact requests also carry the exact repository code + Design revision captured by change-detail; the server rejects a different starting revision and rechecks it after cross-file semantic/search work so relations from another repository state cannot be attached to the selected snapshot. The change-detail response also captures an authoritative repository code + Design revision before and after inspection; if that repository revision changes during the request, the response fails closed. The browser may show project-level Verification Evidence only when the loaded proof revision exactly matches that captured code + Design revision, and must withhold historical or mismatched proof rather than treating mapped tests or old passes as current evidence. Matching revision is necessary but not sufficient: contradictory proof totals, effective item/truncation shape, current evidence category counts, verification ready/blocked plan counts, or unknown evidence result states fail closed rather than being rendered as trustworthy proof. The Project Observatory and its RiskStatus carry the exact repository code + Design revision used to assemble them, and the Observatory capture rechecks that revision before publishing or caching the snapshot. The browser may show bounded project risk only when the captured change revision, Project Observatory revision, proof revision and RiskStatus revision all match exactly; repository drift during Observatory or standalone risk assessment fails closed. Heuristic bug candidates remain explicitly heuristic, and risk is never Verification Evidence or symbol-level proof. Arbitrary commit comparisons and rename pairing remain separate work.
  Matching-version project proof is still fail-closed when its acceptance summary is malformed or contradictory: total, mapped, executed, passed and fresh are non-negative integer counts; mapped and executed cannot exceed total; passed and fresh cannot exceed executed. The inspector may expose those acceptance coverage counts, but fresh means exact-revision currency rather than a passing verdict. Browser consumers preserve line-coordinate types across change ranges, mapped symbols and impact relations: line and character coordinates must be JSON integers in their valid domain, impact line/character coordinates are 1-based, and numeric strings, zero coordinates or other coercible values fail closed rather than becoming navigable source identity. Bounded impact normalization must mark relation coverage partial when provider rows are dropped as malformed or the 24-row relation cap is reached, including degraded exact-search rows with an empty path, non-positive line or invalid source SHA, or a degraded syntax caller whose present `node_id` is not a valid Tree-sitter syntax node, instead of silently presenting the surviving subset as complete. A present incoming-call, reference, implementation or exact-search collection that is not an array is itself malformed and likewise forces partial coverage rather than being interpreted as an empty complete result. Semantic impact also remains partial when any required semantic relation collection is missing, when raw `queried` coverage does not contain exactly the Impact query classes `references`, `implementations` and `calls`, or when the live provider omits or malforms the required `unsupported`/`failures` outcome arrays or reports any unsupported or failed Impact subquery; an empty semantic relation array is complete only when the corresponding query is explicitly covered and both outcome arrays are present and confirm that it did not fail or declare itself unsupported. A call-hierarchy provider that advertises the capability must return exactly one structurally valid prepared item before WCode treats `calls` coverage as queryable. Zero items or multiple prepared candidates are failed/ambiguous `calls` coverage, so WCode never arbitrarily selects the first target. That unique item must carry the required call-hierarchy name, kind, URI, range and selectionRange shape before it can be queried, both ranges must contain ordered integer start/end line and character coordinates with start less than or equal to end, and the selectionRange must be fully contained by the enclosing range. Before WCode issues a call-hierarchy query, the prepared item must also use the exact requested document URI, its selectionRange must contain the originally queried LSP position under LSP half-open range semantics (`start <= position < end`), so a query exactly at the exclusive end is outside the symbol, and both range endpoints must resolve exactly inside that source under the negotiated position encoding; a structurally valid item for another document/symbol or with out-of-source coordinates is failed `calls` coverage. Empty or incomplete range objects are malformed, so an empty incoming-call array stays partial rather than masquerading as a complete absence of callers. Any LSP relation location must carry structurally valid ordered ranges for the target source: every present `selectionRange`, `range`, `targetSelectionRange` or `targetRange` must have integer start/end coordinates with start less than or equal to end, and both endpoints must resolve to source positions exactly representable in the provider's declared position encoding. Location and LocationLink wire identities must not be mixed: exactly one of `uri` or `targetUri` is accepted; a `targetUri` LocationLink must include both `targetRange` and `targetSelectionRange`, with targetSelectionRange fully contained by targetRange, while a direct `uri` location must not also carry target-range fields. Contradictory or mixed location identity is discarded and forces incomplete coverage. Collection-valued navigation responses also remain protocol-shaped: references accept only an array or null, while definition and implementation may additionally normalize one singleton direct Location; a direct Location is exactly the `uri` + `range` shape at this boundary, so a direct object that also carries `selectionRange` is neither a Location nor a LocationLink and is rejected. A singleton object in a collection-only response, or a singleton LocationLink where the protocol requires a link array, is rejected and forces incomplete coverage. Call-hierarchy relation entries are stricter: each returned `from`/`to` item must itself be a structurally valid CallHierarchyItem with name, kind, URI, range and selectionRange, and selectionRange must be fully contained by range; malformed items are discarded and force incomplete coverage. Each relation must also carry a non-empty `fromRanges` array; every call-site range must be ordered, fully contained by the caller symbol range, and decode exactly inside the caller source under the negotiated position encoding. Missing, malformed, out-of-caller or out-of-source call-site ranges discard that relation and force incomplete coverage. UTF-8 offsets cannot split a code point or exceed the logical line, UTF-16 offsets cannot split a code point or exceed the logical line, and UTF-32 character indices cannot exceed the logical line. For CRLF source, the carriage-return byte is line-ending syntax rather than an addressable LSP character, so relation endpoints at or beyond that `\r` are rejected instead of being accepted as in-line source. Malformed or out-of-source relation ranges are discarded and force incomplete coverage instead of being clamped, rounded or partially trusted. For the degraded route, an unavailable or malformed `syntax_calls.incoming_calls` collection, or an unavailable/non-array `keyword_matches` collection, also forces `partial=true` because missing fallback classes cannot be presented as complete empty impact. Completeness/redaction flags are typed metadata: a present non-boolean top-level or syntax-call truncation flag must conservatively keep the impact partial, while a malformed exact-search redaction flag drops that row and keeps coverage partial instead of exposing it as an ordinary match. Changed-symbol mapping likewise marks coverage partial when a syntax outline is structurally incomplete or a declared definition has malformed/missing range or syntax identity, rather than silently treating the remaining mapped definitions as complete.
priority: high
implemented_by:
