<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">wcode Repository Intelligence stack</title>
  <desc id="desc">Layered diagram of repository inputs, graph and semantics, decision surfaces, guarded execution, proof, convergence, and operator surfaces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0810"/><stop offset="1" stop-color="#181120"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9d83ff"/><stop offset=".52" stop-color="#d68bff"/><stop offset="1" stop-color="#ff79b7"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8d7aaa"/></marker>
    <style>
      .title{font:700 52px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f7f2ff;letter-spacing:-1px}
      .sub{font:400 21px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#afa6ba}
      .k{font:700 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#ccbfff;letter-spacing:2px}
      .h{font:700 23px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}
      .t{font:500 16px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#c5bdcc}
      .mono{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e7ddf3}
      .small{font:500 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#92899d}
    </style>
  </defs>
  <rect width="1600" height="960" rx="36" fill="url(#bg)"/>
  <circle cx="1500" cy="30" r="300" fill="#9e77ff" opacity=".07"/>
  <text x="80" y="86" class="k">REPOSITORY INTELLIGENCE · CURRENT SYSTEM MODEL</text>
  <text x="80" y="146" class="title">One repository model, many engineering decisions.</text>
  <text x="80" y="184" class="sub">Desired state, source structure, semantic relationships, Git changes, and proof converge into one provenance-bearing stack.</text>

  <g>
    <text x="80" y="244" class="k">01 · INPUTS</text>
    <rect x="80" y="264" width="272" height="96" rx="20" fill="#17121f" stroke="#382d47"/><text x="104" y="300" class="h">Design State</text><text x="104" y="329" class="t">requirements · components</text><text x="104" y="350" class="small">constraints · acceptance</text>
    <rect x="370" y="264" width="272" height="96" rx="20" fill="#17121f" stroke="#382d47"/><text x="394" y="300" class="h">Git Actual State</text><text x="394" y="329" class="t">worktree · revision</text><text x="394" y="350" class="small">current change set</text>
    <rect x="660" y="264" width="272" height="96" rx="20" fill="#17121f" stroke="#382d47"/><text x="684" y="300" class="h">Tree-sitter</text><text x="684" y="329" class="t">22-language syntax</text><text x="684" y="350" class="small">fast localization</text>
    <rect x="950" y="264" width="272" height="96" rx="20" fill="#17121f" stroke="#382d47"/><text x="974" y="300" class="h">Warm LSP</text><text x="974" y="329" class="t">references · callers</text><text x="974" y="350" class="small">implementations · hover</text>
    <rect x="1240" y="264" width="280" height="96" rx="20" fill="#17121f" stroke="#382d47"/><text x="1264" y="300" class="h">External Providers</text><text x="1264" y="329" class="t">SCIP · compiler · runtime</text><text x="1264" y="350" class="small">provider + precision + revision</text>
  </g>

  <path d="M216 370V405M506 370V405M796 370V405M1086 370V405M1380 370V405" stroke="#756486" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="80" y="414" width="1440" height="134" rx="26" fill="#1b1426" stroke="#4b3a61"/>
    <rect x="80" y="414" width="1440" height="5" rx="3" fill="url(#bar)"/>
    <text x="112" y="454" class="k">02 · NORMALIZED INTELLIGENCE</text>
    <text x="112" y="494" class="h">Software Graph + Semantic Registry + Traceability</text>
    <text x="112" y="524" class="t">Stable nodes and edges retain provider, precision, freshness, source revision, design ownership, and verification relationships.</text>
    <rect x="1118" y="452" width="168" height="32" rx="16" fill="#2b2140"/><text x="1202" y="473" text-anchor="middle" class="mono">graph_history</text>
    <rect x="1298" y="452" width="186" height="32" rx="16" fill="#2b2140"/><text x="1391" y="473" text-anchor="middle" class="mono">semantic_query</text>
    <rect x="1118" y="493" width="168" height="32" rx="16" fill="#2b2140"/><text x="1202" y="514" text-anchor="middle" class="mono">traceability</text>
    <rect x="1298" y="493" width="186" height="32" rx="16" fill="#2b2140"/><text x="1391" y="514" text-anchor="middle" class="mono">graph_query</text>
  </g>

  <path d="M800 558V598" stroke="#756486" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g>
    <text x="80" y="620" class="k">03 · DECIDE</text>
    <rect x="80" y="642" width="270" height="112" rx="22" fill="#17121f" stroke="#382d47"/><text x="106" y="680" class="h">agent_context</text><text x="106" y="709" class="t">task-ready context</text><text x="106" y="733" class="small">readiness · next actions</text>
    <rect x="370" y="642" width="270" height="112" rx="22" fill="#17121f" stroke="#382d47"/><text x="396" y="680" class="h">Impact</text><text x="396" y="709" class="t">changed paths → callers</text><text x="396" y="733" class="small">API · security · scopes</text>
    <rect x="660" y="642" width="270" height="112" rx="22" fill="#17121f" stroke="#382d47"/><text x="686" y="680" class="h">Drift</text><text x="686" y="709" class="t">desired ↔ actual</text><text x="686" y="733" class="small">implementation + design gaps</text>
    <rect x="950" y="642" width="270" height="112" rx="22" fill="#17121f" stroke="#382d47"/><text x="976" y="680" class="h">Risk</text><text x="976" y="709" class="t">adaptive verification depth</text><text x="976" y="733" class="small">multi-dimensional evidence</text>
    <rect x="1240" y="642" width="280" height="112" rx="22" fill="#17121f" stroke="#382d47"/><text x="1266" y="680" class="h">Reconciliation</text><text x="1266" y="709" class="t">dependency-aware tasks</text><text x="1266" y="733" class="small">convergence plan</text>
  </g>

  <path d="M215 764V802M505 764V802M795 764V802M1085 764V802M1380 764V802" stroke="#756486" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="80" y="810" width="454" height="92" rx="22" fill="#1a1522" stroke="#3a3045"/><text x="106" y="845" class="k">04 · EXECUTE</text><text x="106" y="878" class="h">Guarded Workspace + quality providers</text>
    <rect x="573" y="810" width="454" height="92" rx="22" fill="#1a1522" stroke="#3a3045"/><text x="599" y="845" class="k">05 · PROVE</text><text x="599" y="878" class="h">Verification Plan + durable Evidence</text>
    <rect x="1066" y="810" width="454" height="92" rx="22" fill="#1a1522" stroke="#3a3045"/><text x="1092" y="845" class="k">06 · SURFACE</text><text x="1092" y="878" class="h">MCP · TUI · Engineering Observatory</text>
  </g>

  <text x="80" y="934" class="small">Fresh semantic/runtime facts strengthen decisions; stale or unavailable providers fall back explicitly instead of being presented as compiler-level truth.</text>
</svg>