<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">How coding agents read a repository with and without wcode</title>
  <desc id="desc">A side-by-side comparison between text-search repository discovery and wcode's task-aware syntax and semantic repository reading path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0810"/><stop offset="1" stop-color="#181120"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9d83ff"/><stop offset="1" stop-color="#ff79b7"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8f80aa"/></marker>
    <style>
      .eyebrow{font:700 15px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cdbfff;letter-spacing:2px}
      .title{font:750 48px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#faf7ff;letter-spacing:-1px}
      .sub{font:400 21px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#b5acbf}
      .lane{font:700 24px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}
      .node{font:700 20px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}
      .copy{font:400 16px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#c8c0d0}
      .small{font:500 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#9f96aa}
      .chip{font:650 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e9e1f3}
    </style>
  </defs>
  <rect width="1600" height="960" rx="36" fill="url(#bg)"/>
  <circle cx="1480" cy="60" r="280" fill="#9e77ff" opacity=".07"/>
  <text x="80" y="82" class="eyebrow">HOW THE MODEL READS THE REPOSITORY</text>
  <text x="80" y="142" class="title">Search is useful. Reconstructing the system from snippets is the expensive part.</text>
  <text x="80" y="181" class="sub">wcode keeps cheap text discovery, then adds structure and semantics only when the question needs them.</text>

  <rect x="70" y="230" width="700" height="620" rx="28" fill="#15111c" stroke="#352c40"/>
  <rect x="830" y="230" width="700" height="620" rx="28" fill="#191326" stroke="#574269"/>
  <rect x="830" y="230" width="700" height="6" rx="3" fill="url(#accent)"/>

  <text x="110" y="278" class="eyebrow">COMMON TEXT-DISCOVERY LOOP</text>
  <text x="110" y="318" class="lane">Fast localization, then the model rebuilds relationships</text>
  <rect x="110" y="360" width="620" height="84" rx="18" fill="#201927" stroke="#3d3248"/>
  <text x="138" y="394" class="node">1 · Task</text><text x="138" y="420" class="copy">“Who calls this?” · “What breaks if I rename it?”</text>
  <path d="M420 448V478" stroke="#776a84" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="110" y="486" width="620" height="98" rx="18" fill="#201927" stroke="#3d3248"/>
  <text x="138" y="520" class="node">2 · grep / ripgrep / file slices</text><text x="138" y="547" class="copy">Great at finding text, filenames, obvious symbols</text><text x="138" y="570" class="small">Result: matching snippets, not guaranteed program relationships</text>
  <path d="M420 588V618" stroke="#776a84" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="110" y="626" width="620" height="112" rx="18" fill="#201927" stroke="#3d3248"/>
  <text x="138" y="660" class="node">3 · Model reconstructs the codebase</text><text x="138" y="688" class="copy">definition? caller? implementation? affected test?</text><text x="138" y="714" class="copy">same name or same symbol? text match or real relationship?</text>
  <rect x="110" y="766" width="620" height="52" rx="16" fill="#261d2c"/><text x="138" y="798" class="small">The larger the repository, the more reconstruction competes for context.</text>

  <text x="870" y="278" class="eyebrow">WCODE REPOSITORY-READING PATH</text>
  <text x="870" y="318" class="lane">Use the cheapest precise source, then upgrade only when needed</text>
  <rect x="870" y="360" width="620" height="84" rx="18" fill="#241a31" stroke="#59446d"/>
  <text x="898" y="394" class="node">1 · Task-aware localization</text><text x="898" y="420" class="copy">Search stays the default for simple “where is X?” questions</text>
  <path d="M1180 448V478" stroke="#9b83bc" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="870" y="486" width="620" height="112" rx="18" fill="#241a31" stroke="#59446d"/>
  <text x="898" y="520" class="node">2 · Structure + semantic relationships when needed</text><text x="898" y="548" class="copy">Tree-sitter: symbols, ranges, syntax structure</text><text x="898" y="574" class="copy">Warm LSP: references, callers, implementations, hover</text>
  <path d="M1180 602V632" stroke="#9b83bc" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="870" y="640" width="620" height="118" rx="18" fill="#241a31" stroke="#59446d"/>
  <text x="898" y="674" class="node">3 · Task-ready repository evidence</text><text x="898" y="702" class="copy">code + tests + Git change + Design State + graph relationships</text><text x="898" y="728" class="copy">each fact keeps provider · precision · freshness · revision</text>
  <rect x="870" y="782" width="196" height="34" rx="17" fill="#322442"/><text x="968" y="804" text-anchor="middle" class="chip">agent_context</text>
  <rect x="1078" y="782" width="196" height="34" rx="17" fill="#322442"/><text x="1176" y="804" text-anchor="middle" class="chip">semantic_navigation</text>
  <rect x="1286" y="782" width="204" height="34" rx="17" fill="#322442"/><text x="1388" y="804" text-anchor="middle" class="chip">impact / verification</text>

  <text x="80" y="900" class="small">wcode does not replace grep. It makes the precision boundary explicit: text for localization, syntax for structure, semantic providers for relationships, verification for proof.</text>
</svg>