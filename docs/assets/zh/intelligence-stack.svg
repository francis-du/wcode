<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">没有 wcode 与使用 wcode 时，Coding Agent 如何读取仓库</title>
  <desc id="desc">对比以文本搜索为主的仓库发现链路与 wcode 面向任务、按需使用语法和语义关系的仓库读取链路。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0810"/><stop offset="1" stop-color="#181120"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9d83ff"/><stop offset="1" stop-color="#ff79b7"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8f80aa"/></marker>
    <style>
      .eyebrow{font:700 15px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#cdbfff;letter-spacing:1.5px}
      .title{font:750 46px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#faf7ff}
      .sub{font:400 21px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#b5acbf}
      .lane{font:700 24px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}
      .node{font:700 20px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}
      .copy{font:400 16px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#c8c0d0}
      .small{font:500 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#9f96aa}
      .chip{font:650 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e9e1f3}
    </style>
  </defs>
  <rect width="1600" height="960" rx="36" fill="url(#bg)"/>
  <circle cx="1480" cy="60" r="280" fill="#9e77ff" opacity=".07"/>
  <text x="80" y="82" class="eyebrow">模型到底怎么读代码仓库</text>
  <text x="80" y="142" class="title">搜索很有用。真正昂贵的是让模型从碎片里重建整个系统。</text>
  <text x="80" y="181" class="sub">wcode 保留便宜的文本定位，只在问题真的需要时增加结构和语义分析。</text>

  <rect x="70" y="230" width="700" height="620" rx="28" fill="#15111c" stroke="#352c40"/>
  <rect x="830" y="230" width="700" height="620" rx="28" fill="#191326" stroke="#574269"/>
  <rect x="830" y="230" width="700" height="6" rx="3" fill="url(#accent)"/>

  <text x="110" y="278" class="eyebrow">常见文本发现链路</text>
  <text x="110" y="318" class="lane">先快速定位，再让模型自己拼关系</text>
  <rect x="110" y="360" width="620" height="84" rx="18" fill="#201927" stroke="#3d3248"/>
  <text x="138" y="394" class="node">1 · 任务</text><text x="138" y="420" class="copy">“谁在调用它？” · “改名会影响哪里？”</text>
  <path d="M420 448V478" stroke="#776a84" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="110" y="486" width="620" height="98" rx="18" fill="#201927" stroke="#3d3248"/>
  <text x="138" y="520" class="node">2 · grep / ripgrep / 文件切片</text><text x="138" y="547" class="copy">找文本、文件名、明显符号非常高效</text><text x="138" y="570" class="small">返回的是命中片段，不保证就是完整程序关系</text>
  <path d="M420 588V618" stroke="#776a84" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="110" y="626" width="620" height="112" rx="18" fill="#201927" stroke="#3d3248"/>
  <text x="138" y="660" class="node">3 · 模型自己重建代码关系</text><text x="138" y="688" class="copy">定义？调用者？实现？受影响测试？</text><text x="138" y="714" class="copy">只是同名，还是同一个符号？只是文本像，还是事实关系？</text>
  <rect x="110" y="766" width="620" height="52" rx="16" fill="#261d2c"/><text x="138" y="798" class="small">仓库越大，越多 Context 被消耗在“重新理解仓库”这件事上。</text>

  <text x="870" y="278" class="eyebrow">WCODE 仓库读取链路</text>
  <text x="870" y="318" class="lane">先用最便宜的准确手段，需要时再升级</text>
  <rect x="870" y="360" width="620" height="84" rx="18" fill="#241a31" stroke="#59446d"/>
  <text x="898" y="394" class="node">1 · 面向任务定位</text><text x="898" y="420" class="copy">普通“X 在哪”继续默认用 Search</text>
  <path d="M1180 448V478" stroke="#9b83bc" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="870" y="486" width="620" height="112" rx="18" fill="#241a31" stroke="#59446d"/>
  <text x="898" y="520" class="node">2 · 需要时再补结构与语义关系</text><text x="898" y="548" class="copy">Tree-sitter：符号、范围、语法结构</text><text x="898" y="574" class="copy">Warm LSP：Reference、Caller、Implementation、Hover</text>
  <path d="M1180 602V632" stroke="#9b83bc" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="870" y="640" width="620" height="118" rx="18" fill="#241a31" stroke="#59446d"/>
  <text x="898" y="674" class="node">3 · 面向任务整理仓库证据</text><text x="898" y="702" class="copy">代码 + 测试 + Git 变更 + Design State + 图关系</text><text x="898" y="728" class="copy">每条事实保留 Provider · Precision · Freshness · Revision</text>
  <rect x="870" y="782" width="196" height="34" rx="17" fill="#322442"/><text x="968" y="804" text-anchor="middle" class="chip">agent_context</text>
  <rect x="1078" y="782" width="196" height="34" rx="17" fill="#322442"/><text x="1176" y="804" text-anchor="middle" class="chip">semantic_navigation</text>
  <rect x="1286" y="782" width="204" height="34" rx="17" fill="#322442"/><text x="1388" y="804" text-anchor="middle" class="chip">impact / verification</text>

  <text x="80" y="900" class="small">wcode 不替代 grep：文本负责定位，语法负责结构，语义 Provider 负责关系，Verification 负责证明；精度边界始终明确。</text>
</svg>