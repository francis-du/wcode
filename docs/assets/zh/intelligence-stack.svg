<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc"><title id="title">wcode 仓库智能栈</title><desc id="desc">分层展示仓库输入、图谱与语义、决策面、受保护执行、验证证据、收敛流程和操作者界面。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0810"/><stop offset="1" stop-color="#181120"/></linearGradient><linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9d83ff"/><stop offset=".52" stop-color="#d68bff"/><stop offset="1" stop-color="#ff79b7"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8d7aaa"/></marker><style>.title{font:700 52px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#f7f2ff}.sub{font:400 20px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#afa6ba}.k{font:700 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#ccbfff;letter-spacing:1.4px}.h{font:700 23px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}.t{font:500 16px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#c5bdcc}.mono{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e7ddf3}.small{font:500 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#92899d}</style></defs><rect width="1600" height="960" rx="36" fill="url(#bg)"/><circle cx="1500" cy="30" r="300" fill="#9e77ff" opacity=".07"/><text x="80" y="86" class="k">仓库智能 · 当前系统模型</text><text x="80" y="146" class="title">一套仓库模型，支撑多种工程决策。</text><text x="80" y="184" class="sub">目标状态、源码结构、语义关系、Git 变更与验证证据收敛到一套保留来源信息的工程栈。</text><g><text x="80" y="244" class="k">01 · 输入</text><rect x="80" y="264" width="272" height="96" rx="20" fill="#17121f" stroke="#382d47"/><text x="104" y="300" class="h">设计状态</text><text x="104" y="329" class="t">需求 · 组件</text><text x="104" y="350" class="small">约束 · 验收条件</text><rect x="370" y="264" width="272" height="96" rx="20" fill="#17121f" stroke="#382d47"/><text x="394" y="300" class="h">Git 实际状态</text><text x="394" y="329" class="t">工作树 · 版本</text><text x="394" y="350" class="small">当前变更集</text><rect x="660" y="264" width="272" height="96" rx="20" fill="#17121f" stroke="#382d47"/><text x="684" y="300" class="h">Tree-sitter</text><text x="684" y="329" class="t">22 种语言语法</text><text x="684" y="350" class="small">快速定位</text><rect x="950" y="264" width="272" height="96" rx="20" fill="#17121f" stroke="#382d47"/><text x="974" y="300" class="h">Warm LSP</text><text x="974" y="329" class="t">引用 · 调用者</text><text x="974" y="350" class="small">实现 · Hover</text><rect x="1240" y="264" width="280" height="96" rx="20" fill="#17121f" stroke="#382d47"/><text x="1264" y="300" class="h">外部提供方</text><text x="1264" y="329" class="t">SCIP · 编译器 · 运行时</text><text x="1264" y="350" class="small">来源 + 精度 + 版本</text></g><path d="M216 370V405M506 370V405M796 370V405M1086 370V405M1380 370V405" stroke="#756486" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="80" y="414" width="1440" height="134" rx="26" fill="#1b1426" stroke="#4b3a61"/><rect x="80" y="414" width="1440" height="5" rx="3" fill="url(#bar)"/><text x="112" y="454" class="k">02 · 规范化智能层</text><text x="112" y="494" class="h">软件图谱 + 语义注册表 + 可追溯关系</text><text x="112" y="524" class="t">稳定节点与边保留提供方、精度、新鲜度、源码版本、设计归属和验证关系。</text><rect x="1118" y="452" width="168" height="32" rx="16" fill="#2b2140"/><text x="1202" y="473" text-anchor="middle" class="mono">graph_history</text><rect x="1298" y="452" width="186" height="32" rx="16" fill="#2b2140"/><text x="1391" y="473" text-anchor="middle" class="mono">semantic_query</text><rect x="1118" y="493" width="168" height="32" rx="16" fill="#2b2140"/><text x="1202" y="514" text-anchor="middle" class="mono">traceability</text><rect x="1298" y="493" width="186" height="32" rx="16" fill="#2b2140"/><text x="1391" y="514" text-anchor="middle" class="mono">graph_query</text></g><path d="M800 558V598" stroke="#756486" stroke-width="2.5" marker-end="url(#arrow)"/><g><text x="80" y="620" class="k">03 · 决策</text><rect x="80" y="642" width="270" height="112" rx="22" fill="#17121f" stroke="#382d47"/><text x="106" y="680" class="h">agent_context</text><text x="106" y="709" class="t">面向任务的上下文</text><text x="106" y="733" class="small">就绪度 · 下一步</text><rect x="370" y="642" width="270" height="112" rx="22" fill="#17121f" stroke="#382d47"/><text x="396" y="680" class="h">影响分析</text><text x="396" y="709" class="t">变更路径 → 调用者</text><text x="396" y="733" class="small">API · 安全 · 产品范围</text><rect x="660" y="642" width="270" height="112" rx="22" fill="#17121f" stroke="#382d47"/><text x="686" y="680" class="h">偏离</text><text x="686" y="709" class="t">目标 ↔ 实际</text><text x="686" y="733" class="small">实现 + 设计缺口</text><rect x="950" y="642" width="270" height="112" rx="22" fill="#17121f" stroke="#382d47"/><text x="976" y="680" class="h">风险</text><text x="976" y="709" class="t">自适应验证深度</text><text x="976" y="733" class="small">多维证据</text><rect x="1240" y="642" width="280" height="112" rx="22" fill="#17121f" stroke="#382d47"/><text x="1266" y="680" class="h">收敛计划</text><text x="1266" y="709" class="t">依赖感知任务</text><text x="1266" y="733" class="small">持续收敛</text></g><path d="M215 764V802M505 764V802M795 764V802M1085 764V802M1380 764V802" stroke="#756486" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="80" y="810" width="454" height="92" rx="22" fill="#1a1522" stroke="#3a3045"/><text x="106" y="845" class="k">04 · 执行</text><text x="106" y="878" class="h">受保护工作区 + 质量提供方</text><rect x="573" y="810" width="454" height="92" rx="22" fill="#1a1522" stroke="#3a3045"/><text x="599" y="845" class="k">05 · 证明</text><text x="599" y="878" class="h">验证计划 + 持久化证据</text><rect x="1066" y="810" width="454" height="92" rx="22" fill="#1a1522" stroke="#3a3045"/><text x="1092" y="845" class="k">06 · 展示</text><text x="1092" y="878" class="h">MCP · TUI · 工程观测台</text></g><text x="80" y="934" class="small">新鲜的语义/运行时事实会增强决策；过期或不可用的提供方会明确降级，而不会伪装成编译器级真相。</text></svg>