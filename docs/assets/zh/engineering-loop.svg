<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">wcode 工程控制平面闭环</title><desc id="desc">展示 wcode 如何帮助编码 Agent 理解仓库、受控修改、验证结果、沉淀可信状态并持续观测与收敛。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0812"/><stop offset="1" stop-color="#171021"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a88cff"/><stop offset="1" stop-color="#ff79b8"/></linearGradient><linearGradient id="soft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#21192f"/><stop offset="1" stop-color="#17131f"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".26"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9a83d4"/></marker><style>.title{font:700 54px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#f7f3ff}.sub{font:400 22px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#aea5bd}.eyebrow{font:700 15px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#cfbfff;letter-spacing:1.4px}.stage{font:700 24px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}.copy{font:400 16px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#c7bfce}.chip{font:600 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#e8ddff}.center{font:800 34px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.center2{font:500 16px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#ddd4e7}.small{font:500 15px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#9f95ad}</style></defs><rect width="1600" height="900" rx="36" fill="url(#bg)"/><circle cx="1380" cy="100" r="260" fill="#8d62ff" opacity=".08"/><circle cx="190" cy="790" r="260" fill="#ff67ae" opacity=".06"/><text x="80" y="92" class="eyebrow">WCODE · 工程控制平面</text><text x="80" y="154" class="title">先理解，少改动，再证明。</text><text x="80" y="194" class="sub">模型始终可替换；仓库状态、策略、证据与可观测性持续保留。</text><path d="M310 350 C410 252 525 245 625 310" fill="none" stroke="#6f5a99" stroke-width="3" marker-end="url(#arrow)"/><path d="M742 286 C865 238 994 264 1075 356" fill="none" stroke="#6f5a99" stroke-width="3" marker-end="url(#arrow)"/><path d="M1132 466 C1160 580 1090 675 980 707" fill="none" stroke="#6f5a99" stroke-width="3" marker-end="url(#arrow)"/><path d="M855 735 C714 792 580 766 490 678" fill="none" stroke="#6f5a99" stroke-width="3" marker-end="url(#arrow)"/><path d="M398 592 C330 550 289 503 276 451" fill="none" stroke="#6f5a99" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="80" y="272" width="380" height="196" rx="28" fill="url(#soft)" stroke="#3a2d4d"/><rect x="80" y="272" width="8" height="196" rx="4" fill="#a88cff"/><text x="112" y="312" class="eyebrow">01 · 理解</text><text x="112" y="349" class="stage">构建面向任务的仓库地图</text><text x="112" y="381" class="copy">agent_context · Design State · Tree-sitter</text><text x="112" y="408" class="copy">Warm LSP · 软件图谱 · 语义注册表</text><rect x="112" y="429" width="130" height="24" rx="12" fill="#2b2140"/><text x="127" y="446" class="chip">精确目标</text><rect x="252" y="429" width="168" height="24" rx="12" fill="#2b2140"/><text x="267" y="446" class="chip">明确精度</text><rect x="610" y="226" width="380" height="196" rx="28" fill="url(#soft)" stroke="#3a2d4d"/><rect x="610" y="226" width="8" height="196" rx="4" fill="#c985ff"/><text x="642" y="266" class="eyebrow">02 · 修改</text><text x="642" y="303" class="stage">在护栏内执行修改</text><text x="642" y="335" class="copy">工作区根 · SHA-256 前置条件</text><text x="642" y="362" class="copy">原子编辑 · 精确 / 会话全授权</text><rect x="642" y="383" width="122" height="24" rx="12" fill="#2b2140"/><text x="657" y="400" class="chip">无 shell</text><rect x="774" y="383" width="174" height="24" rx="12" fill="#2b2140"/><text x="789" y="400" class="chip">有界写入</text><rect x="1070" y="316" width="450" height="208" rx="28" fill="url(#soft)" stroke="#3a2d4d"/><rect x="1070" y="316" width="8" height="208" rx="4" fill="#ff79b8"/><text x="1102" y="356" class="eyebrow">03 · 验证</text><text x="1102" y="393" class="stage">让证明精确绑定版本</text><text x="1102" y="425" class="copy">review_changes · verify_project · 质量门禁</text><text x="1102" y="452" class="copy">Property · Mutation · Fuzz · Runtime · 独立审查</text><rect x="1102" y="475" width="167" height="24" rx="12" fill="#392236"/><text x="1117" y="492" class="chip">失败关闭</text><rect x="1279" y="475" width="197" height="24" rx="12" fill="#392236"/><text x="1294" y="492" class="chip">当前版本</text><rect x="798" y="626" width="432" height="176" rx="28" fill="url(#soft)" stroke="#3a2d4d"/><rect x="798" y="626" width="8" height="176" rx="4" fill="#f2a2d1"/><text x="830" y="666" class="eyebrow">04 · 学习</text><text x="830" y="703" class="stage">只持久化可信状态</text><text x="830" y="735" class="copy">证据 · 图谱历史 · 已确认语义</text><text x="830" y="762" class="copy">经验证经验可跨模型与会话保留</text><rect x="206" y="576" width="470" height="206" rx="28" fill="url(#soft)" stroke="#3a2d4d"/><rect x="206" y="576" width="8" height="206" rx="4" fill="#8ed6c6"/><text x="238" y="616" class="eyebrow">05 · 观察与收敛</text><text x="238" y="653" class="stage">把项目视为工程状态</text><text x="238" y="685" class="copy">工程观测台 · 影响 · 偏离 · 风险</text><text x="238" y="712" class="copy">收敛计划将差距转为依赖感知工作</text><rect x="238" y="735" width="154" height="24" rx="12" fill="#18322f"/><text x="253" y="752" class="chip">数字孪生</text><rect x="402" y="735" width="220" height="24" rx="12" fill="#18322f"/><text x="417" y="752" class="chip">收敛闭环</text></g><g filter="url(#shadow)"><circle cx="790" cy="500" r="118" fill="#130f1b" stroke="url(#accent)" stroke-width="3"/><circle cx="790" cy="500" r="96" fill="url(#accent)" opacity=".12"/><text x="790" y="490" text-anchor="middle" class="center">wcode</text><text x="790" y="520" text-anchor="middle" class="center2">模型中立控制平面</text><text x="790" y="548" text-anchor="middle" class="small">状态 · 策略 · 证据</text></g><text x="80" y="850" class="small">每条关系都保留明确来源与边界；更强的模型提升执行质量，但不会成为策略事实的唯一来源。</text></svg>