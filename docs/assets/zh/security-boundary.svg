<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc"><title id="title">wcode 安全与授权边界</title><desc id="desc">展示本地与远程 MCP 客户端在执行受保护仓库操作前需要经过协议、OAuth、Harness、授权与 Workspace 边界。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0810"/><stop offset="1" stop-color="#18111f"/></linearGradient><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#715aff"/><stop offset="1" stop-color="#d477ce"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8b789f"/></marker><style>.title{font:700 52px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#f7f3ff}.sub{font:400 20px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#ada4b8}.k{font:700 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#cfbfff;letter-spacing:1.4px}.h{font:700 22px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}.t{font:500 16px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#c4bbcc}.small{font:500 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#958b9f}.mono{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#ebe2f5}</style></defs><rect width="1600" height="920" rx="36" fill="url(#bg)"/><circle cx="1450" cy="85" r="280" fill="#9d7bff" opacity=".07"/><text x="80" y="88" class="k">安全模型 · 连接模型 ≠ 暴露整台机器</text><text x="80" y="148" class="title">每一次操作都必须穿过明确边界。</text><text x="80" y="186" class="sub">远程可达性、模型请求、命令信任和文件系统权限是四个彼此独立的决定。</text><g><text x="80" y="254" class="k">客户端</text><rect x="80" y="278" width="284" height="120" rx="24" fill="#17121f" stroke="#3b2f49"/><text x="108" y="316" class="h">本地编码 Agent</text><text x="108" y="346" class="t">stdio · Host 工作目录</text><text x="108" y="374" class="small">无需网络认证跳转</text><rect x="80" y="430" width="284" height="140" rx="24" fill="#17121f" stroke="#3b2f49"/><text x="108" y="468" class="h">远程客户端</text><text x="108" y="498" class="t">Streamable HTTP /mcp</text><text x="108" y="526" class="t">兼容 Legacy SSE</text><text x="108" y="554" class="small">网络路径始终需要认证</text></g><path d="M364 338H454" stroke="#86739a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M364 500H418V412H454" fill="none" stroke="#86739a" stroke-width="2.5" marker-end="url(#arrow)"/><g><rect x="464" y="274" width="286" height="300" rx="30" fill="#191321" stroke="#4a395a"/><text x="494" y="314" class="k">传输与身份</text><rect x="494" y="338" width="226" height="72" rx="18" fill="#251a31"/><text x="516" y="368" class="h">MCP 协议核心</text><text x="516" y="392" class="small">所有传输共享同一分发逻辑</text><rect x="494" y="426" width="226" height="104" rx="18" fill="#2b1d33"/><text x="516" y="458" class="h">OAuth 边界</text><text x="516" y="484" class="t">PKCE · 资源绑定</text><text x="516" y="510" class="small">Host + Origin 校验</text><text x="494" y="552" class="small">OAuth 只作用于网络传输。</text></g><path d="M750 424H836" stroke="#86739a" stroke-width="2.5" marker-end="url(#arrow)"/><g><rect x="846" y="248" width="330" height="352" rx="32" fill="url(#core)" opacity=".92"/><text x="878" y="290" class="k">WCODE HARNESS</text><text x="878" y="332" class="h">执行之前先过策略</text><rect x="878" y="356" width="266" height="52" rx="16" fill="#170f24" opacity=".62"/><text x="900" y="389" class="mono">Workspace 边界</text><rect x="878" y="422" width="266" height="52" rx="16" fill="#170f24" opacity=".62"/><text x="900" y="455" class="mono">路径 + SHA 护栏</text><rect x="878" y="488" width="266" height="52" rx="16" fill="#170f24" opacity=".62"/><text x="900" y="521" class="mono">命令策略 · 无 shell</text><text x="878" y="568" class="small">全局 Semaphore + 资源调度器保证</text><text x="878" y="588" class="small">并发工作始终位于同一信任边界内。</text></g><path d="M1176 424H1260" stroke="#86739a" stroke-width="2.5" marker-end="url(#arrow)"/><g><rect x="1270" y="274" width="250" height="300" rx="30" fill="#17121f" stroke="#3b2f49"/><text x="1298" y="314" class="k">工作区</text><text x="1298" y="350" class="h">受保护操作</text><text x="1298" y="385" class="t">读取 / 搜索</text><text x="1298" y="413" class="t">原子编辑 / 创建</text><text x="1298" y="441" class="t">有界验证</text><text x="1298" y="469" class="t">已批准命令形态</text><rect x="1298" y="500" width="194" height="38" rx="19" fill="#21322d"/><text x="1395" y="524" text-anchor="middle" class="mono">仅 canonical roots</text></g><g><rect x="464" y="652" width="712" height="150" rx="28" fill="#17121f" stroke="#4b3a5a"/><text x="494" y="692" class="k">本地人工授权</text><text x="494" y="730" class="h">模型可以请求信任，但不能授予信任。</text><text x="494" y="760" class="t">TUI / WebUI / stdio → 精确请求或 Workspace 级会话全授权</text><rect x="948" y="686" width="198" height="34" rx="17" fill="#2b2140"/><text x="1047" y="708" text-anchor="middle" class="mono">批准 / 拒绝</text><path d="M1010 652V608" stroke="#87749d" stroke-width="2" marker-end="url(#arrow)"/></g><g><rect x="80" y="652" width="330" height="150" rx="28" fill="#1e141b" stroke="#5b3345"/><text x="108" y="692" class="k">永久拒绝 / 失败关闭边界</text><text x="108" y="730" class="t">Workspace 逃逸 · Shell 注入</text><text x="108" y="758" class="t">受保护凭据 / VCS 路径</text><text x="108" y="786" class="t">递归 / 破坏性不安全操作</text></g><text x="80" y="862" class="small">批准永远不会关闭 Workspace 隔离。隧道只提供可达性，不提供授权；已有文件写入在授权后仍保留 SHA 护栏。</text></svg>