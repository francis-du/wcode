<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">wcode Verification Mesh</title>
  <desc id="desc">Risk-adaptive verification plan with deterministic checks, language quality, advanced stages, blind reviewers, human approval, evidence, and readiness.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0811"/><stop offset="1" stop-color="#18111f"/></linearGradient>
    <linearGradient id="plan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7d63ff"/><stop offset="1" stop-color="#d777d7"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8d79a6"/></marker>
    <style>
      .title{font:700 52px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8f4ff;letter-spacing:-1px}
      .sub{font:400 21px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#aca3b7}
      .k{font:700 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cfbfff;letter-spacing:2px}
      .h{font:700 22px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}
      .t{font:500 16px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#c3bacb}
      .small{font:500 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#948a9f}
      .mono{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e9e0f3}
    </style>
  </defs>
  <rect width="1600" height="940" rx="36" fill="url(#bg)"/>
  <circle cx="1450" cy="60" r="290" fill="#ff6fb5" opacity=".06"/>
  <text x="80" y="88" class="k">VERIFICATION MESH · REVISION-BOUND PROOF</text>
  <text x="80" y="148" class="title">Verification depth follows risk, not confidence.</text>
  <text x="80" y="186" class="sub">No single model verdict can erase a deterministic failure, stale revision, missing stage, or required human approval.</text>

  <g>
    <rect x="80" y="242" width="300" height="116" rx="24" fill="#17121f" stroke="#3b2f49"/>
    <text x="108" y="278" class="k">INPUT A</text><text x="108" y="314" class="h">Current change</text><text x="108" y="340" class="t">code + Design revision</text>
    <rect x="420" y="242" width="300" height="116" rx="24" fill="#17121f" stroke="#3b2f49"/>
    <text x="448" y="278" class="k">INPUT B</text><text x="448" y="314" class="h">Impact + risk</text><text x="448" y="340" class="t">scope · API · security · drift</text>
    <path d="M380 300H414" stroke="#87749d" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M720 300H776" stroke="#87749d" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="786" y="230" width="380" height="140" rx="28" fill="url(#plan)" opacity=".92"/>
    <text x="818" y="272" class="k" fill="#fff">RISK-ADAPTIVE PLAN</text><text x="818" y="310" class="h">verification_plan</text><text x="818" y="338" class="t" fill="#fff">required stages · reviewers · approval</text>
    <path d="M1166 300H1230" stroke="#87749d" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="1240" y="242" width="280" height="116" rx="24" fill="#17121f" stroke="#3b2f49"/>
    <text x="1268" y="278" class="k">OUTPUT CONTRACT</text><text x="1268" y="314" class="h">Explicit blockers</text><text x="1268" y="340" class="t">nothing silently skipped</text>
  </g>

  <text x="80" y="430" class="k">PARALLEL EVIDENCE LANES</text>
  <g>
    <rect x="80" y="454" width="340" height="220" rx="26" fill="#17121f" stroke="#3d304c"/>
    <rect x="80" y="454" width="340" height="5" rx="3" fill="#9b83ff"/>
    <text x="108" y="497" class="h">Deterministic gate</text>
    <text x="108" y="528" class="t">review_changes</text><text x="108" y="556" class="t">verify_project quick / full</text><text x="108" y="584" class="t">language_quality_run</text>
    <rect x="108" y="616" width="192" height="30" rx="15" fill="#2b2140"/><text x="204" y="636" text-anchor="middle" class="mono">exact command result</text>

    <rect x="446" y="454" width="340" height="220" rx="26" fill="#17121f" stroke="#3d304c"/>
    <rect x="446" y="454" width="340" height="5" rx="3" fill="#c187ff"/>
    <text x="474" y="497" class="h">Advanced stages</text>
    <text x="474" y="528" class="t">Property</text><text x="474" y="556" class="t">Mutation · Fuzz</text><text x="474" y="584" class="t">Runtime / Canary</text>
    <rect x="474" y="616" width="226" height="30" rx="15" fill="#2b2140"/><text x="587" y="636" text-anchor="middle" class="mono">producer-scoped evidence</text>

    <rect x="812" y="454" width="340" height="220" rx="26" fill="#17121f" stroke="#3d304c"/>
    <rect x="812" y="454" width="340" height="5" rx="3" fill="#ed80ca"/>
    <text x="840" y="497" class="h">Blind independent review</text>
    <text x="840" y="528" class="t">correctness · security</text><text x="840" y="556" class="t">architecture · maintainability</text><text x="840" y="584" class="t">disagreement remains visible</text>
    <rect x="840" y="616" width="196" height="30" rx="15" fill="#392236"/><text x="938" y="636" text-anchor="middle" class="mono">model provenance</text>

    <rect x="1178" y="454" width="342" height="220" rx="26" fill="#17121f" stroke="#3d304c"/>
    <rect x="1178" y="454" width="342" height="5" rx="3" fill="#8ed6c6"/>
    <text x="1206" y="497" class="h">Human approval</text>
    <text x="1206" y="528" class="t">only when plan requires it</text><text x="1206" y="556" class="t">explicit attestation</text><text x="1206" y="584" class="t">models cannot self-approve</text>
    <rect x="1206" y="616" width="194" height="30" rx="15" fill="#18322f"/><text x="1303" y="636" text-anchor="middle" class="mono">human evidence</text>
  </g>

  <path d="M250 684V724M616 684V724M982 684V724M1349 684V724" stroke="#87749d" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="200" y="732" width="1200" height="92" rx="28" fill="#1d1628" stroke="#58416c"/>
    <text x="232" y="768" class="k">DURABLE EVIDENCE</text>
    <text x="232" y="800" class="h">producer + model + target set + policy + code revision + Design revision + verdict</text>
    <rect x="1184" y="758" width="180" height="34" rx="17" fill="#2d2340"/><text x="1274" y="780" text-anchor="middle" class="mono">evidence_status</text>
  </g>
  <path d="M800 824V854" stroke="#87749d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="410" y="860" width="780" height="54" rx="27" fill="#17121f" stroke="#4a385b"/>
    <text x="800" y="894" text-anchor="middle" class="h">Readiness → current-revision proof → reconciliation / convergence</text>
  </g>
  <text x="80" y="920" class="small">Historical green evidence remains history. Readiness is evaluated against the current code + Design revision and fails closed on required missing/failed producers.</text>
</svg>