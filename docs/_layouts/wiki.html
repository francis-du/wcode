<!doctype html>
<html lang="{{ page.lang | default: 'en' }}" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="color-scheme" content="dark light">
  <title>{{ page.title | escape }} · wcode WIKI</title>
  <link rel="icon" href="{{ '/assets/wcode-icon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/wiki.css' | relative_url }}">
  <script defer src="{{ '/assets/site.js' | relative_url }}"></script>
</head>
<body>
  <header class="site-header wiki-nav" id="top">
    <div class="nav-shell">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="wcode home">
        <img class="brand-mark" src="{{ '/assets/wcode-icon.svg' | relative_url }}" alt="">
        <span>code</span>
      </a>
      <nav class="nav-links" aria-label="WIKI navigation">
        <a href="{{ '/wiki/' | relative_url }}">WIKI</a>
        <a href="{{ '/wiki/code-agent-integrations/' | relative_url }}">Code Agents</a>
        <a href="{{ '/wiki/software-intelligence/' | relative_url }}">Intelligence</a>
        <a href="{{ '/wiki/development/' | relative_url }}">Development</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-button" id="themeToggle" type="button" aria-label="Switch color theme" title="Switch color theme"><span aria-hidden="true">◐</span></button>
        <a class="button button-ghost button-small" href="https://github.com/francis-du/wcode">GitHub ↗</a>
      </div>
    </div>
  </header>
  <main class="wiki-shell">
    <aside class="wiki-sidebar" aria-label="WIKI sections">
      <strong>WIKI</strong>
      <a href="{{ '/wiki/' | relative_url }}">Overview</a>
      <a href="{{ '/wiki/code-agent-integrations/' | relative_url }}">Code Agent integrations</a>
      <a href="{{ '/wiki/software-intelligence/' | relative_url }}">Software Intelligence</a>
      <a href="{{ '/wiki/software-intelligence-zh-cn/' | relative_url }}">软件智能中文指南</a>
      <a href="{{ '/wiki/agentic-engineering/' | relative_url }}">Agentic Engineering</a>
      <a href="{{ '/wiki/product-scopes/' | relative_url }}">Product Scopes</a>
      <a href="{{ '/wiki/language-quality/' | relative_url }}">Language Quality</a>
      <a href="{{ '/wiki/maintainability-review/' | relative_url }}">Maintainability Review</a>
      <a href="{{ '/wiki/development/' | relative_url }}">Development</a>
      <a href="{{ '/wiki/releases/v0.3.0/' | relative_url }}">v0.3.0</a>
    </aside>
    <article class="wiki-content">
      {{ content }}
    </article>
  </main>
  <footer class="site-footer"><div class="section-shell footer-inner"><div class="brand"><img class="brand-mark" src="{{ '/assets/wcode-icon.svg' | relative_url }}" alt=""><span>code</span></div><p>Apache-2.0 · WIKI</p></div></footer>
</body>
</html>
