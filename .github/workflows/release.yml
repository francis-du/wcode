name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to build and publish
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: wcode-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.release_tag == '' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
      candidate_version: ${{ steps.candidate.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}

      - name: Record validated candidate identity
        id: candidate
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import tomllib

          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          assert re.fullmatch(r"[0-9a-f]{40}", sha), "Invalid checkout identity"
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?", version), "Invalid version"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"sha={sha}\nversion={version}\n")
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Check
        run: cargo check --locked

      - name: Audit Rust dependencies
        uses: actions-rust-lang/audit@v1
        with:
          createIssues: false

      - name: Validate Design, traceability, and Product Scope contract
        run: >-
          cargo run --quiet --locked --
          --workspace "$PWD"
          --read-only
          --no-exec
          --allow-sleep
          intelligence --check --json

      - name: Validate release version consistency
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        run: |
          package_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          full_tag="v${package_version}"
          short_tag="v${package_version%.0}"
          test "${RELEASE_TAG}" = "${full_tag}" || test "${RELEASE_TAG}" = "${short_tag}"
          for manifest in \
            marketplace.json \
            plugin/marketplace.json \
            plugin/plugin.json \
            plugin/.claude-plugin/plugin.json \
            plugin/.codex-plugin/plugin.json \
            plugin/.zcode-plugin/plugin.json
          do
            grep -q '"version": "'"${package_version}"'"' "${manifest}"
          done

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Validate Unix installer
        run: sh -n install.sh

  test:
    name: Test ${{ matrix.name }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install JavaScript test runtime
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check JavaScript test runtime
        run: node --version

      - name: Release regression sentinels
        run: |
          cargo test --locked --lib syntax_search_cache_eviction_is_not_reported_as_file_failure
          cargo test --locked --lib workspace_relative_verification_executable_resolves_from_workspace_root
          cargo test --locked --lib engineering_fitness_live_controls_preserve_safety_and_precision
          cargo test --locked --test release_contract release_metadata_versions_match_the_cargo_package

      - name: Test
        run: cargo test --locked

      - name: Validate real WebKit Observatory layout
        if: runner.os == 'macOS'
        run: |
          node tests/unit/ui/browser.cjs .
          swift tests/unit/ui/browser_webkit.swift

      - name: Upload WebKit layout diagnostics
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: webkit-layout-diagnostics
          path: |
            target/wcode-browser-audit.json
            target/wcode-browser-fixture.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw install.ps1)) | Out-Null'

  build:
    name: Build release ${{ matrix.name }}
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [test, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            platform: linux
            artifact: wcode-linux-x86_64
            archive: wcode-linux-x86_64.tar.gz
          - name: macOS Universal
            os: macos-latest
            platform: macos
            artifact: wcode-macos-universal
            archive: wcode-macos-universal.tar.gz
          - name: Windows x86_64
            os: windows-latest
            platform: windows
            artifact: wcode-windows-x86_64
            archive: wcode-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}

      - name: Assert validated build candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.quality.outputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package dist/candidates
          for opt in z s; do
            CARGO_PROFILE_RELEASE_OPT_LEVEL="$opt" cargo build --release --locked
            install -m 755 target/release/wcode "dist/candidates/wcode-${opt}"
          done
          z_bytes=$(stat -c%s dist/candidates/wcode-z)
          s_bytes=$(stat -c%s dist/candidates/wcode-s)
          if (( s_bytes < z_bytes )); then
            selected_opt=s
          else
            selected_opt=z
          fi
          install -m 755 "dist/candidates/wcode-${selected_opt}" dist/package/wcode
          cp README.md dist/package/README.md
          cp LICENSE dist/package/LICENSE
          package_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test "$(dist/package/wcode --version)" = "wcode ${package_version}"
          dist/package/wcode --help >/dev/null
          tar -C dist/package -cf - . | gzip -9n > "dist/${{ matrix.archive }}"
          (
            cd dist
            sha256sum "${{ matrix.archive }}" > SHA256SUMS
          )
          WCODE_BASE_URL="file://$PWD/dist" \
            WCODE_INSTALL_DIR="$PWD/dist/install-smoke" \
            sh install.sh
          binary_bytes=$(stat -c%s dist/package/wcode)
          archive_bytes=$(stat -c%s "dist/${{ matrix.archive }}")
          {
            echo "### ${{ matrix.name }}"
            echo "- Size candidates: z=${z_bytes} bytes, s=${s_bytes} bytes"
            echo "- Selected opt-level: ${selected_opt}"
            echo "- Binary: ${binary_bytes} bytes"
            echo "- Archive: ${archive_bytes} bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build macOS universal binary
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          mkdir -p dist/candidates dist/package-universal dist/package-arm64 dist/package-x86_64
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            for opt in z s; do
              CARGO_PROFILE_RELEASE_OPT_LEVEL="$opt" cargo build --release --locked --target "$target"
              install -m 755 "target/${target}/release/wcode" "dist/candidates/wcode-${target}-${opt}"
            done
          done

          arm64_z_bytes=$(stat -f%z dist/candidates/wcode-aarch64-apple-darwin-z)
          arm64_s_bytes=$(stat -f%z dist/candidates/wcode-aarch64-apple-darwin-s)
          if (( arm64_s_bytes < arm64_z_bytes )); then
            arm64_opt=s
          else
            arm64_opt=z
          fi
          x86_64_z_bytes=$(stat -f%z dist/candidates/wcode-x86_64-apple-darwin-z)
          x86_64_s_bytes=$(stat -f%z dist/candidates/wcode-x86_64-apple-darwin-s)
          if (( x86_64_s_bytes < x86_64_z_bytes )); then
            x86_64_opt=s
          else
            x86_64_opt=z
          fi

          install -m 755 "dist/candidates/wcode-aarch64-apple-darwin-${arm64_opt}" dist/package-arm64/wcode
          install -m 755 "dist/candidates/wcode-x86_64-apple-darwin-${x86_64_opt}" dist/package-x86_64/wcode

          # Cargo's release profile strips symbols. Apple Silicon requires a valid
          # signature after any post-link binary modification, so re-sign every
          # distributed Mach-O before packaging it.
          codesign --force --sign - dist/package-arm64/wcode
          codesign --force --sign - dist/package-x86_64/wcode
          lipo -create \
            dist/package-arm64/wcode \
            dist/package-x86_64/wcode \
            -output dist/package-universal/wcode
          chmod +x dist/package-universal/wcode
          codesign --force --sign - dist/package-universal/wcode
          for binary in \
            dist/package-arm64/wcode \
            dist/package-x86_64/wcode \
            dist/package-universal/wcode
          do
            codesign --verify --strict --verbose=2 "$binary"
          done

          cp README.md dist/package-universal/README.md
          cp README.md dist/package-arm64/README.md
          cp README.md dist/package-x86_64/README.md
          cp LICENSE dist/package-universal/LICENSE
          cp LICENSE dist/package-arm64/LICENSE
          cp LICENSE dist/package-x86_64/LICENSE
          package_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          for binary in \
            dist/package-arm64/wcode \
            dist/package-x86_64/wcode \
            dist/package-universal/wcode
          do
            test "$("$binary" --version)" = "wcode ${package_version}"
            "$binary" --help >/dev/null
          done
          COPYFILE_DISABLE=1 tar -C dist/package-universal -cf - . | gzip -9n > "dist/${{ matrix.archive }}"
          COPYFILE_DISABLE=1 tar -C dist/package-arm64 -cf - . | gzip -9n > dist/wcode-macos-aarch64.tar.gz
          COPYFILE_DISABLE=1 tar -C dist/package-x86_64 -cf - . | gzip -9n > dist/wcode-macos-x86_64.tar.gz
          (
            cd dist
            shasum -a 256 \
              "${{ matrix.archive }}" \
              wcode-macos-aarch64.tar.gz \
              wcode-macos-x86_64.tar.gz > SHA256SUMS
          )
          WCODE_BASE_URL="file://$PWD/dist" \
            WCODE_INSTALL_DIR="$PWD/dist/install-smoke" \
            sh install.sh
          universal_binary_bytes=$(stat -f%z dist/package-universal/wcode)
          universal_archive_bytes=$(stat -f%z "dist/${{ matrix.archive }}")
          arm64_binary_bytes=$(stat -f%z dist/package-arm64/wcode)
          arm64_archive_bytes=$(stat -f%z dist/wcode-macos-aarch64.tar.gz)
          x86_64_binary_bytes=$(stat -f%z dist/package-x86_64/wcode)
          x86_64_archive_bytes=$(stat -f%z dist/wcode-macos-x86_64.tar.gz)
          {
            echo "### ${{ matrix.name }}"
            echo "- Apple Silicon candidates: z=${arm64_z_bytes} bytes, s=${arm64_s_bytes} bytes; selected ${arm64_opt}"
            echo "- Intel candidates: z=${x86_64_z_bytes} bytes, s=${x86_64_s_bytes} bytes; selected ${x86_64_opt}"
            echo "- Universal binary: ${universal_binary_bytes} bytes"
            echo "- Universal archive: ${universal_archive_bytes} bytes"
            echo "- Apple Silicon binary: ${arm64_binary_bytes} bytes"
            echo "- Apple Silicon archive: ${arm64_archive_bytes} bytes"
            echo "- Intel binary: ${x86_64_binary_bytes} bytes"
            echo "- Intel archive: ${x86_64_archive_bytes} bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist/package, dist/candidates | Out-Null
          $candidateBytes = @{}
          foreach ($opt in @("z", "s")) {
            $env:CARGO_PROFILE_RELEASE_OPT_LEVEL = $opt
            cargo build --release --locked
            if ($LASTEXITCODE -ne 0) {
              throw "release: Windows cargo build failed for opt-level $opt"
            }
            $candidate = "dist/candidates/wcode-$opt.exe"
            Copy-Item target/release/wcode.exe $candidate
            $candidateBytes[$opt] = (Get-Item $candidate).Length
          }
          if ($candidateBytes["s"] -lt $candidateBytes["z"]) {
            $selectedOpt = "s"
          } else {
            $selectedOpt = "z"
          }
          Copy-Item "dist/candidates/wcode-$selectedOpt.exe" dist/package/wcode.exe
          Copy-Item README.md dist/package/README.md
          Copy-Item LICENSE dist/package/LICENSE
          $versionOutput = & dist/package/wcode.exe --version
          if ($LASTEXITCODE -ne 0) {
            throw "release: Windows binary failed the version smoke test"
          }
          $expectedVersion = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"$' | Select-Object -First 1).Matches.Groups[1].Value
          if (($versionOutput -join "`n").Trim() -ne "wcode $expectedVersion") {
            throw "release: Windows binary version does not match Cargo.toml"
          }
          & dist/package/wcode.exe --help
          if ($LASTEXITCODE -ne 0) {
            throw "release: Windows binary failed the help smoke test"
          }
          Compress-Archive -Path dist/package/* -DestinationPath "dist/${{ matrix.archive }}" -CompressionLevel Optimal -Force
          $binaryBytes = (Get-Item dist/package/wcode.exe).Length
          $archiveBytes = (Get-Item "dist/${{ matrix.archive }}").Length
          @(
            "### ${{ matrix.name }}",
            "- Size candidates: z=$($candidateBytes['z']) bytes, s=$($candidateBytes['s']) bytes",
            "- Selected opt-level: $selectedOpt",
            "- Binary: $binaryBytes bytes",
            "- Archive: $archiveBytes bytes"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload macOS slim artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: wcode-macos-slim
          path: |
            dist/wcode-macos-aarch64.tar.gz
            dist/wcode-macos-x86_64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum -- *.tar.gz *.zip > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

  release-download:
    name: Verify published archive ${{ matrix.name }}
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [quality, release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            python: python3
          - name: macOS
            os: macos-latest
            python: python3
          - name: Windows
            os: windows-latest
            python: python
    steps:
      - name: Download and exercise official release archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.quality.outputs.candidate_sha }}
          CANDIDATE_VERSION: ${{ needs.quality.outputs.candidate_version }}
        run: |
          ${{ matrix.python }} - <<'PY'
          """Verify published release packages against this run's validated candidate."""
          import hashlib
          import io
          import json
          import os
          from pathlib import Path, PurePosixPath
          import platform
          import re
          import socket
          import subprocess
          import tarfile
          import tempfile
          import time
          import urllib.request
          import zipfile

          REPO = os.environ["GITHUB_REPOSITORY"]
          TAG = os.environ["RELEASE_TAG"]
          TARGET = os.environ["CANDIDATE_SHA"]
          VERSION = os.environ["CANDIDATE_VERSION"]
          RELEASE_RUN = int(os.environ["GITHUB_RUN_ID"])
          RUN_ATTEMPT = int(os.environ["GITHUB_RUN_ATTEMPT"])
          PACKAGES = {
              "Linux": ["wcode-linux-x86_64.tar.gz"],
              "Windows": ["wcode-windows-x86_64.zip"],
              "Darwin": ["wcode-macos-aarch64.tar.gz", "wcode-macos-x86_64.tar.gz", "wcode-macos-universal.tar.gz"],
          }
          EXPECTED = {name for names in PACKAGES.values() for name in names}


          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)


          def read_url(url, bound, api=False):
              headers = {"User-Agent": "wcode-release-download-verification"}
              if api and os.environ.get("GH_TOKEN"):
                  require(url.startswith(f"https://api.github.com/repos/{REPO}/"), "Foreign API request")
                  headers["Authorization"] = "Bearer " + os.environ["GH_TOKEN"]
                  headers["Accept"] = "application/vnd.github+json"
                  headers["X-GitHub-Api-Version"] = "2022-11-28"
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60) as response:
                  data = response.read(bound + 1)
              require(len(data) <= bound, "Download exceeded its size bound")
              return data


          def get_api(path):
              return json.loads(read_url(f"https://api.github.com/repos/{REPO}/{path}", 1_048_576, api=True))


          def parse_checksums(data):
              checksums = {}
              for line in data.decode("ascii").splitlines():
                  match = re.fullmatch(r"([0-9a-f]{64})  (wcode-[A-Za-z0-9_.-]+)", line)
                  require(match is not None, "Malformed checksum manifest")
                  digest, name = match.groups()
                  require(name in EXPECTED and name not in checksums, "Unknown or duplicate checksum entry")
                  checksums[name] = digest
              require(set(checksums) == EXPECTED, "Checksum manifest does not cover all five packages")
              return checksums


          def binary_bytes(data, name):
              expected_binary = "wcode.exe" if name.endswith(".zip") else "wcode"
              found = {}
              def accept(member_name, payload):
                  while member_name.startswith("./"):
                      member_name = member_name[2:]
                  require(PurePosixPath(member_name).parts == (member_name,), "Unsafe archive member")
                  require(member_name in {expected_binary, "README.md", "LICENSE"}, "Unexpected archive member")
                  require(member_name not in found, "Duplicate archive member")
                  found[member_name] = payload
              if name.endswith(".zip"):
                  with zipfile.ZipFile(io.BytesIO(data)) as archive:
                      require(len(archive.infolist()) <= 8, "Excessive ZIP entries")
                      for item in archive.infolist():
                          require(not item.is_dir() and ((item.external_attr >> 16) & 0o170000) != 0o120000,
                                  "ZIP directories and symbolic links are not executable packages")
                          require(item.file_size <= (134_217_728 if item.filename == expected_binary else 4_194_304), "Oversized ZIP member")
                          accept(item.filename, archive.read(item))
              else:
                  with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as archive:
                      for count, item in enumerate(archive):
                          require(count < 8, "Excessive TAR entries")
                          if item.isdir() and item.name in (".", "./"):
                              continue
                          require(item.isfile() and not item.issym() and not item.islnk(), "Non-regular TAR entry")
                          require(item.size <= (134_217_728 if item.name.removeprefix("./") == expected_binary else 4_194_304), "Oversized TAR member")
                          payload = archive.extractfile(item).read(item.size + 1)
                          require(len(payload) == item.size, "Truncated TAR member")
                          accept(item.name, payload)
              require(set(found) == {expected_binary, "README.md", "LICENSE"}, "Incomplete package")
              return found[expected_binary]


          def exercise(binary, folder, name):
              workspace = folder / "workspace"
              workspace.mkdir()
              home = folder / "home"
              home.mkdir()
              env = {key: value for key, value in os.environ.items()
                     if key not in ("GH_TOKEN", "GITHUB_TOKEN") and not key.startswith("WCODE_")}
              env.update(HOME=str(home), USERPROFILE=str(home), XDG_CONFIG_HOME=str(home / "config"),
                         XDG_CACHE_HOME=str(home / "cache"), XDG_DATA_HOME=str(home / "data"))
              def invoke(args):
                  result = subprocess.run([str(binary), *args], cwd=workspace, env=env,
                                          stdin=subprocess.DEVNULL, capture_output=True, timeout=30)
                  require(result.returncode == 0, f"{name}: command {args[0]} failed with {result.returncode}")
                  return result.stdout.decode("utf-8")
              require(invoke(["--version"]).strip() == "wcode " + VERSION, "Wrong binary version")
              require("mcp-stdio" in invoke(["--help"]), "Incomplete help")
              catalog = json.loads(invoke(["help-all", "--json"]))
              require(catalog.get("version") == VERSION and catalog.get("runtime_started") is False,
                      "Incorrect declarative command catalog")
              if platform.system() == "Darwin":
                  subprocess.run(["codesign", "--verify", "--strict", str(binary)], check=True, capture_output=True, timeout=30)
                  archs = set(subprocess.check_output(["lipo", "-archs", str(binary)], text=True, timeout=10).split())
                  expected_archs = {"arm64", "x86_64"} if "universal" in name else {"arm64" if "aarch64" in name else "x86_64"}
                  require(archs == expected_archs, "Mach-O architecture mismatch")
              with socket.socket() as sock:
                  sock.bind(("127.0.0.1", 0))
                  port = sock.getsockname()[1]
              args = [str(binary), "--workspace", str(workspace), "--host", "127.0.0.1", "--port", str(port),
                      "--read-only", "--no-exec", "--no-semantic", "--no-tunnel", "--no-monitor", "--no-open", "--allow-sleep"]
              process = subprocess.Popen(args, cwd=workspace, env=env, stdin=subprocess.DEVNULL,
                                         stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              health = None
              try:
                  deadline = time.monotonic() + 30
                  while time.monotonic() < deadline:
                      require(process.poll() is None, f"{name}: runtime exited before becoming healthy")
                      try:
                          with urllib.request.build_opener(urllib.request.ProxyHandler({})).open(
                                  f"http://127.0.0.1:{port}/healthz/probe", timeout=1) as response:
                              health = json.loads(response.read(4096))
                          if health.get("ok") is True and isinstance(health.get("instance_id"), str) and health["instance_id"]:
                              break
                      except (OSError, ValueError):
                          pass
                      time.sleep(0.2)
                  require(health is not None and health.get("ok") is True and bool(health.get("instance_id")), "Runtime health probe failed")
                  require(process.poll() is None, "Runtime did not remain alive after health probe")
              finally:
                  process.terminate()
                  try:
                      process.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait(timeout=10)
              return {"version": "wcode " + VERSION, "help": True, "command_catalog": True, "http_startup": True,
                      "macos_signature_and_architecture": True if platform.system() == "Darwin" else None}


          def tag_commit():
              obj = get_api(f"git/ref/tags/{TAG}")["object"]
              for _ in range(4):
                  if obj.get("type") == "commit":
                      require(re.fullmatch(r"[0-9a-f]{40}", obj.get("sha", "")) is not None, "Invalid tag commit")
                      return obj["sha"]
                  require(obj.get("type") == "tag" and re.fullmatch(r"[0-9a-f]{40}", obj.get("sha", "")),
                          "Unsupported tag object")
                  obj = get_api(f"git/tags/{obj['sha']}")["object"]
              raise RuntimeError("Excessive annotated tag depth")


          def main():
              system = platform.system()
              require(system in PACKAGES, "Unsupported verification platform")
              require(re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", REPO) is not None, "Invalid repository")
              require(re.fullmatch(r"[0-9a-f]{40}", TARGET) is not None, "Invalid candidate SHA")
              require(re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?", VERSION) is not None,
                      "Invalid candidate version")
              allowed_tags = {"v" + VERSION, "v" + VERSION.removesuffix(".0")}
              require(TAG in allowed_tags and tag_commit() == TARGET, "Release tag identity mismatch")
              run = get_api(f"actions/runs/{RELEASE_RUN}")
              require(run.get("id") == RELEASE_RUN and run.get("repository", {}).get("full_name") == REPO
                      and run.get("run_attempt") == RUN_ATTEMPT, "Publication run identity mismatch")
              # Failed archive checks can be rerun without republishing a successful release.
              jobs = get_api(f"actions/runs/{RELEASE_RUN}/jobs?filter=all&per_page=100")
              require(jobs.get("total_count") == len(jobs.get("jobs", [])) <= 100, "Incomplete publication jobs")
              publish = [job for job in jobs["jobs"] if job.get("name") == "Publish GitHub Release"]
              require(bool(publish), "Publication job is missing")
              publish = max(publish, key=lambda job: job["id"])
              require(publish.get("run_id") == RELEASE_RUN
                      and publish.get("run_url") == f"https://api.github.com/repos/{REPO}/actions/runs/{RELEASE_RUN}"
                      and publish.get("status") == "completed" and publish.get("conclusion") == "success",
                      "Latest publication job did not succeed")
              release = get_api(f"releases/tags/{TAG}")
              require(release.get("tag_name") == TAG and release.get("draft") is False
                      and release.get("prerelease") is False and release.get("published_at"), "Not a final published release")
              assets = {item["name"]: item for item in release["assets"]}
              require(len(assets) == len(release["assets"]) and set(assets) == EXPECTED | {"SHA256SUMS"}, "Release asset set mismatch")
              def download(name):
                  asset = assets[name]
                  require(asset.get("state") == "uploaded" and 0 < asset["size"] <= 268_435_456, "Invalid uploaded asset")
                  url = f"https://github.com/{REPO}/releases/download/{TAG}/{name}"
                  require(asset["browser_download_url"] == url, "Unexpected download origin")
                  data = read_url(url, asset["size"])
                  require(len(data) == asset["size"], "Truncated asset")
                  digest = hashlib.sha256(data).hexdigest()
                  require(asset.get("digest") == "sha256:" + digest, "GitHub asset digest mismatch")
                  return data, digest
              manifest, manifest_sha = download("SHA256SUMS")
              checksums = parse_checksums(manifest)
              reports = []
              for name in sorted(EXPECTED):
                  data, digest = download(name)
                  require(digest == checksums[name], "SHA256SUMS mismatch")
                  payload = binary_bytes(data, name)
                  if name not in PACKAGES[system]:
                      reports.append({"asset": name, "archive_sha256": digest, "archive_size": len(data),
                                      "safe_members": True, "native_checks": "not_executed_on_this_platform"})
                      continue
                  with tempfile.TemporaryDirectory(prefix="wcode-published-") as tmp:
                      folder = Path(tmp)
                      binary = folder / ("wcode.exe" if system == "Windows" else "wcode")
                      binary.write_bytes(payload)
                      binary.chmod(0o755)
                      reports.append({"asset": name, "archive_sha256": digest, "archive_size": len(data),
                                      "checks": exercise(binary, folder, name)})
              require(tag_commit() == TARGET, "Tag moved during verification")
              output = {"tag": TAG, "commit": TARGET, "version": VERSION, "release_id": release["id"],
                        "release_run": RELEASE_RUN, "verification_attempt": RUN_ATTEMPT, "publish_job": publish["id"],
                        "platform": system, "checksums_sha256": manifest_sha, "results": reports, "passed": True}
              Path(os.environ["RUNNER_TEMP"], f"release-download-{system}.json").write_text(
                  json.dumps(output, indent=2) + "\n", encoding="utf-8")
              print(json.dumps(output))


          if __name__ == "__main__":
              try:
                  main()
              except Exception as error:
                  report = {"tag": TAG, "commit": TARGET, "release_run": RELEASE_RUN,
                            "platform": platform.system(), "passed": False, "error_type": type(error).__name__}
                  Path(os.environ["RUNNER_TEMP"], f"release-download-{platform.system()}.json").write_text(
                      json.dumps(report, indent=2) + "\n", encoding="utf-8")
                  raise
          PY

      - name: Upload native archive verification proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-download-${{ matrix.name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-download-*.json
          if-no-files-found: error
          retention-days: 14