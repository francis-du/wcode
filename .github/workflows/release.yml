name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to build and publish
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: wcode-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.release_tag == '' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
      candidate_version: ${{ steps.candidate.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}

      - name: Record validated candidate identity
        id: candidate
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import tomllib

          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          assert re.fullmatch(r"[0-9a-f]{40}", sha), "Invalid checkout identity"
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?", version), "Invalid version"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"sha={sha}\nversion={version}\n")
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Check
        run: cargo check --locked

      - name: Audit Rust dependencies
        uses: actions-rust-lang/audit@v1
        with:
          createIssues: false

      - name: Validate Design, traceability, and Product Scope contract
        run: >-
          cargo run --quiet --locked --
          --workspace "$PWD"
          --read-only
          --no-exec
          --allow-sleep
          intelligence --check --json

      - name: Validate release version consistency
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        run: |
          package_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          full_tag="v${package_version}"
          short_tag="v${package_version%.0}"
          test "${RELEASE_TAG}" = "${full_tag}" || test "${RELEASE_TAG}" = "${short_tag}"
          for manifest in \
            marketplace.json \
            plugin/marketplace.json \
            plugin/plugin.json \
            plugin/.claude-plugin/plugin.json \
            plugin/.codex-plugin/plugin.json \
            plugin/.zcode-plugin/plugin.json
          do
            grep -q '"version": "'"${package_version}"'"' "${manifest}"
          done

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Validate Unix installer
        run: sh -n install.sh

  test:
    name: Test ${{ matrix.name }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install JavaScript test runtime
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check JavaScript test runtime
        run: node --version

      - name: Release regression sentinels
        run: |
          cargo test --locked --lib syntax_search_cache_eviction_is_not_reported_as_file_failure
          cargo test --locked --lib workspace_relative_verification_executable_resolves_from_workspace_root
          cargo test --locked --lib engineering_fitness_live_controls_preserve_safety_and_precision
          cargo test --locked --test release_contract release_metadata_versions_match_the_cargo_package

      - name: Test
        run: cargo test --locked

      - name: Upload production TUI render review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tui-render-review-${{ runner.os }}
          path: target/wcode-tui-review/
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate real WebKit Observatory layout
        if: runner.os == 'macOS'
        run: |
          node tests/unit/ui/browser.cjs .
          swift tests/unit/ui/browser_webkit.swift

      - name: Upload WebKit layout diagnostics
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: webkit-layout-diagnostics
          path: |
            target/wcode-browser-audit.json
            target/wcode-browser-fixture.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw install.ps1)) | Out-Null'

  build:
    name: Build release ${{ matrix.name }}
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [test, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            platform: linux
            artifact: wcode-linux-x86_64
            archive: wcode-linux-x86_64.tar.gz
          - name: macOS Universal
            os: macos-latest
            platform: macos
            artifact: wcode-macos-universal
            archive: wcode-macos-universal.tar.gz
          - name: Windows x86_64
            os: windows-latest
            platform: windows
            artifact: wcode-windows-x86_64
            archive: wcode-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}

      - name: Assert validated build candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.quality.outputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package dist/candidates
          for opt in z s; do
            CARGO_PROFILE_RELEASE_OPT_LEVEL="$opt" cargo build --release --locked
            install -m 755 target/release/wcode "dist/candidates/wcode-${opt}"
          done
          z_bytes=$(stat -c%s dist/candidates/wcode-z)
          s_bytes=$(stat -c%s dist/candidates/wcode-s)
          if (( s_bytes < z_bytes )); then
            selected_opt=s
          else
            selected_opt=z
          fi
          install -m 755 "dist/candidates/wcode-${selected_opt}" dist/package/wcode
          cp README.md dist/package/README.md
          cp LICENSE dist/package/LICENSE
          package_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test "$(dist/package/wcode --version)" = "wcode ${package_version}"
          dist/package/wcode --help >/dev/null
          tar -C dist/package -cf - . | gzip -9n > "dist/${{ matrix.archive }}"
          (
            cd dist
            sha256sum "${{ matrix.archive }}" > SHA256SUMS
          )
          WCODE_BASE_URL="file://$PWD/dist" \
            WCODE_INSTALL_DIR="$PWD/dist/install-smoke" \
            sh install.sh
          binary_bytes=$(stat -c%s dist/package/wcode)
          archive_bytes=$(stat -c%s "dist/${{ matrix.archive }}")
          {
            echo "### ${{ matrix.name }}"
            echo "- Size candidates: z=${z_bytes} bytes, s=${s_bytes} bytes"
            echo "- Selected opt-level: ${selected_opt}"
            echo "- Binary: ${binary_bytes} bytes"
            echo "- Archive: ${archive_bytes} bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build macOS universal binary
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          mkdir -p dist/candidates dist/package-universal dist/package-arm64 dist/package-x86_64
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            for opt in z s; do
              CARGO_PROFILE_RELEASE_OPT_LEVEL="$opt" cargo build --release --locked --target "$target"
              install -m 755 "target/${target}/release/wcode" "dist/candidates/wcode-${target}-${opt}"
            done
          done

          arm64_z_bytes=$(stat -f%z dist/candidates/wcode-aarch64-apple-darwin-z)
          arm64_s_bytes=$(stat -f%z dist/candidates/wcode-aarch64-apple-darwin-s)
          if (( arm64_s_bytes < arm64_z_bytes )); then
            arm64_opt=s
          else
            arm64_opt=z
          fi
          x86_64_z_bytes=$(stat -f%z dist/candidates/wcode-x86_64-apple-darwin-z)
          x86_64_s_bytes=$(stat -f%z dist/candidates/wcode-x86_64-apple-darwin-s)
          if (( x86_64_s_bytes < x86_64_z_bytes )); then
            x86_64_opt=s
          else
            x86_64_opt=z
          fi

          install -m 755 "dist/candidates/wcode-aarch64-apple-darwin-${arm64_opt}" dist/package-arm64/wcode
          install -m 755 "dist/candidates/wcode-x86_64-apple-darwin-${x86_64_opt}" dist/package-x86_64/wcode

          # Cargo's release profile strips symbols. Apple Silicon requires a valid
          # signature after any post-link binary modification, so re-sign every
          # distributed Mach-O before packaging it.
          codesign --force --sign - dist/package-arm64/wcode
          codesign --force --sign - dist/package-x86_64/wcode
          lipo -create \
            dist/package-arm64/wcode \
            dist/package-x86_64/wcode \
            -output dist/package-universal/wcode
          chmod +x dist/package-universal/wcode
          codesign --force --sign - dist/package-universal/wcode
          for binary in \
            dist/package-arm64/wcode \
            dist/package-x86_64/wcode \
            dist/package-universal/wcode
          do
            codesign --verify --strict --verbose=2 "$binary"
          done

          cp README.md dist/package-universal/README.md
          cp README.md dist/package-arm64/README.md
          cp README.md dist/package-x86_64/README.md
          cp LICENSE dist/package-universal/LICENSE
          cp LICENSE dist/package-arm64/LICENSE
          cp LICENSE dist/package-x86_64/LICENSE
          package_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          for binary in \
            dist/package-arm64/wcode \
            dist/package-x86_64/wcode \
            dist/package-universal/wcode
          do
            test "$("$binary" --version)" = "wcode ${package_version}"
            "$binary" --help >/dev/null
          done
          COPYFILE_DISABLE=1 tar -C dist/package-universal -cf - . | gzip -9n > "dist/${{ matrix.archive }}"
          COPYFILE_DISABLE=1 tar -C dist/package-arm64 -cf - . | gzip -9n > dist/wcode-macos-aarch64.tar.gz
          COPYFILE_DISABLE=1 tar -C dist/package-x86_64 -cf - . | gzip -9n > dist/wcode-macos-x86_64.tar.gz
          (
            cd dist
            shasum -a 256 \
              "${{ matrix.archive }}" \
              wcode-macos-aarch64.tar.gz \
              wcode-macos-x86_64.tar.gz > SHA256SUMS
          )
          WCODE_BASE_URL="file://$PWD/dist" \
            WCODE_INSTALL_DIR="$PWD/dist/install-smoke" \
            sh install.sh
          universal_binary_bytes=$(stat -f%z dist/package-universal/wcode)
          universal_archive_bytes=$(stat -f%z "dist/${{ matrix.archive }}")
          arm64_binary_bytes=$(stat -f%z dist/package-arm64/wcode)
          arm64_archive_bytes=$(stat -f%z dist/wcode-macos-aarch64.tar.gz)
          x86_64_binary_bytes=$(stat -f%z dist/package-x86_64/wcode)
          x86_64_archive_bytes=$(stat -f%z dist/wcode-macos-x86_64.tar.gz)
          {
            echo "### ${{ matrix.name }}"
            echo "- Apple Silicon candidates: z=${arm64_z_bytes} bytes, s=${arm64_s_bytes} bytes; selected ${arm64_opt}"
            echo "- Intel candidates: z=${x86_64_z_bytes} bytes, s=${x86_64_s_bytes} bytes; selected ${x86_64_opt}"
            echo "- Universal binary: ${universal_binary_bytes} bytes"
            echo "- Universal archive: ${universal_archive_bytes} bytes"
            echo "- Apple Silicon binary: ${arm64_binary_bytes} bytes"
            echo "- Apple Silicon archive: ${arm64_archive_bytes} bytes"
            echo "- Intel binary: ${x86_64_binary_bytes} bytes"
            echo "- Intel archive: ${x86_64_archive_bytes} bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist/package, dist/candidates | Out-Null
          $candidateBytes = @{}
          foreach ($opt in @("z", "s")) {
            $env:CARGO_PROFILE_RELEASE_OPT_LEVEL = $opt
            cargo build --release --locked
            if ($LASTEXITCODE -ne 0) {
              throw "release: Windows cargo build failed for opt-level $opt"
            }
            $candidate = "dist/candidates/wcode-$opt.exe"
            Copy-Item target/release/wcode.exe $candidate
            $candidateBytes[$opt] = (Get-Item $candidate).Length
          }
          if ($candidateBytes["s"] -lt $candidateBytes["z"]) {
            $selectedOpt = "s"
          } else {
            $selectedOpt = "z"
          }
          Copy-Item "dist/candidates/wcode-$selectedOpt.exe" dist/package/wcode.exe
          Copy-Item README.md dist/package/README.md
          Copy-Item LICENSE dist/package/LICENSE
          $versionOutput = & dist/package/wcode.exe --version
          if ($LASTEXITCODE -ne 0) {
            throw "release: Windows binary failed the version smoke test"
          }
          $expectedVersion = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"$' | Select-Object -First 1).Matches.Groups[1].Value
          if (($versionOutput -join "`n").Trim() -ne "wcode $expectedVersion") {
            throw "release: Windows binary version does not match Cargo.toml"
          }
          & dist/package/wcode.exe --help
          if ($LASTEXITCODE -ne 0) {
            throw "release: Windows binary failed the help smoke test"
          }
          Compress-Archive -Path dist/package/* -DestinationPath "dist/${{ matrix.archive }}" -CompressionLevel Optimal -Force
          $binaryBytes = (Get-Item dist/package/wcode.exe).Length
          $archiveBytes = (Get-Item "dist/${{ matrix.archive }}").Length
          @(
            "### ${{ matrix.name }}",
            "- Size candidates: z=$($candidateBytes['z']) bytes, s=$($candidateBytes['s']) bytes",
            "- Selected opt-level: $selectedOpt",
            "- Binary: $binaryBytes bytes",
            "- Archive: $archiveBytes bytes"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload macOS slim artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: wcode-macos-slim
          path: |
            dist/wcode-macos-aarch64.tar.gz
            dist/wcode-macos-x86_64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum -- *.tar.gz *.zip > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

  release-download:
    name: Verify published archive ${{ matrix.name }}
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [quality, release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            python: python3
          - name: macOS
            os: macos-latest
            python: python3
          - name: Windows
            os: windows-latest
            python: python
    steps:
      - name: Checkout archive verifier
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download and exercise official release archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.quality.outputs.candidate_sha }}
          CANDIDATE_VERSION: ${{ needs.quality.outputs.candidate_version }}
        run: ${{ matrix.python }} tests/published_release.py

      - name: Upload native archive verification proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-download-${{ matrix.name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-download-*.json
          if-no-files-found: error
          retention-days: 14
